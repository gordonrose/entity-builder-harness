success_criteria:
  - "A human can locate a target's complete alarm policy without searching cloud templates or console state."
  - "Every target alarm declares its signal, dimensions, condition, evaluation, response, implementation, and any telemetry prerequisite."
  - "The repository-wide target index links policies without duplicating mutable policy values."
  - "Policy-to-IaC drift and live delivery proof remain explicit readiness requirements."
