rules:
  - id: platform-target-alerting-policy.has-one-canonical-catalogue
    title: Each target has one canonical alarm catalogue
    severity: error
    summary: >
      A product platform target records its complete alarm policy under
      `observability.alarms` in its target profile. A repository index links
      to that policy but must not duplicate policy values.
    must:
      - "Declare the alarm-policy standard path, catalogue index path, and `observability.alarms` as the canonical catalogue in `observability.policy`."
      - "Keep target-specific alarm IDs, metrics, dimensions, thresholds, delivery destinations, and runbooks in that target profile."
      - "Add one target row to `infra/04.deploy/03.product/targets/README.md` when a new target declares an alarm policy."
      - "Use a static, plan-time, or deployment-time policy-to-IaC check before treating the target as operationally ready."
    must_not:
      - "Do not use a provider console, a CloudFormation template, an alarm name list, or an incident ticket as a second canonical policy store."
      - "Do not repeat target thresholds, dimensions, or notification configuration in the repository-wide target index."
      - "Do not define provider alarm thresholds, notification routes, or incident routing in packages/core."
    required_checks:
      - "Verify `observability.policy` points to this rule and the target catalogue index."
      - "Verify the target profile contains one structured `observability.alarms` list with unique IDs."
      - "Verify the target index links the target profile, implementation source, and runbook."
    agent_guidance: >
      When asked what alerts a target has, start at its target profile. Use the
      index to find the target, then follow the policy's implementation and
      runbook references. Never reconstruct policy by searching provider
      resources alone.

  - id: platform-target-alerting-policy.defines-an-operable-alarm
    title: Every alarm definition is complete and operable
    severity: error
    summary: >
      An alarm is an operational decision system, not a metric name and a
      threshold. Every definition must identify the signal, decision window,
      response, and owning implementation.
    must:
      - "Give every alarm a stable semantic `id` and a human-readable `purpose`."
      - "Declare `signal.namespace`, `signal.metric`, and bounded resource dimensions with resolvers or values."
      - "Declare a statistic, comparison operator, threshold value or source, and unit under `condition`."
      - "Declare period seconds, evaluation periods, datapoints to alarm, and `treat_missing_data` under `evaluation`."
      - "Declare a severity from the target policy's explicit severity vocabulary, an owned destination, and a version-controlled runbook under `response`."
      - "Declare stack ownership, logical resource, provider alarm name, and human-safe description under `implementation`."
      - "Declare telemetry prerequisites, a read-only proof method, and a fail-closed update path whenever a metric is not natively guaranteed."
    must_not:
      - "Do not use tenant, principal, request, trace, session, email, IP, raw route, or another unbounded/sensitive value as a metric dimension."
      - "Do not put credentials, tokens, customer values, raw payloads, prompts, transcripts, signed URLs, or provider error bodies in alarm descriptions, tags, dimensions, or notification content."
      - "Do not leave metric dimensions, missing-data semantics, notification ownership, or response runbooks implicit."
    required_checks:
      - "Verify every declared alarm contains id, purpose, signal, condition, evaluation, response, and implementation objects."
      - "Verify every severity is included in the target's declared severity vocabulary."
      - "Verify every declared runbook path exists and can be followed without collecting sensitive payloads."
      - "Verify telemetry prerequisites before applying a dependent alarm resource."
    agent_guidance: >
      Ask: what is measured, for exactly which resource, what counts as bad,
      how long must it last, what does no data mean, who reacts, and where is
      the provider resource owned? If any answer is absent, the policy is not
      ready to implement.

  - id: platform-target-alerting-policy.proves-delivery-and-drift-control
    title: Alarm policy is proven against implementation and live delivery
    severity: error
    summary: >
      A provider accepting an alarm resource does not prove metric publication,
      notification delivery, safe operator response, or alignment with the
      reviewed policy.
    must:
      - "Compare every policy definition with the owning IaC resource's metric, dimensions, condition, evaluation, missing-data rule, destination, tags, and provider identity."
      - "Use least-privilege deployment permissions that can create or manage only reviewed alarm resources and destinations."
      - "Record safe live-state evidence, notification-delivery proof, and any pending alarm gaps in the target readiness record."
      - "Keep alarm response runbooks version controlled and review them when a policy changes."
    must_not:
      - "Do not mark a target ready solely because its templates parse or its alarms are in an OK state."
      - "Do not lower, delete, or bypass a required alarm because a telemetry prerequisite is unavailable; record and resolve a readiness blocker."
      - "Do not store email endpoints, notification content, raw logs, or customer data as delivery proof in the repository."
    required_checks:
      - "Run the target's static infrastructure policy gate."
      - "Run prerequisite preflights before infrastructure mutation when the target declares them."
      - "Inspect provider alarm state and delivery evidence read-only after a governed apply."
      - "Verify target readiness records distinguish source policy, implemented resources, and live proof."
    agent_guidance: >
      Treat policy, resource creation, and live proof as separate stages. A
      missing metric or undelivered notification is a readiness gap, not a
      reason to weaken the policy.

