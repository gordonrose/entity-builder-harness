id: concern.untrusted-input-and-bounded-agent-safety
title: Untrusted input and bounded agent safety rules
version: 1
status: active

source_derivation:
  provenance_version: rag-rulebook/source-derivation-provenance/v1
  mode: direct-source-material
  generator: agent-assisted-source-to-rule
  generator_version: v1
  generated_at_utc: "2026-09-02T22:06:35Z"
  derivation_workflow: .agentic/02.rag-rulebook/workflows/derive-rules-from-source.md
  derivation_report: .agentic/02.rag-rulebook/derivation-reports/03.product/2026-09-02-untrusted-input-and-bounded-agent-safety-v1.yml
  source_material:
    - path: docs/03.product/source-material/guides/markdown/untrusted-input-and-bounded-agent-safety-v1.md
      sha256: 6cb6af3535b44d5e9b002bfd62273f0eb654d8b5c33d713e905c97445aa77b18

description: >
  Product-wide rules that keep untrusted data from becoming executable code or
  higher-priority instructions, and constrain agent capabilities through
  independently enforced identity, tenant, authorization, approval, and audit
  boundaries.

applies_to:
  paths:
    - ".agentic/03.product/**"
    - "packages/**"
    - "platform/**"
    - "apps/**"
    - "products/**"

