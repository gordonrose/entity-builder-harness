#   kind: schema
#   purpose: Define the non-secret declaration required when a workload receives secret material for a dependency.
#   portability: { class: reusable, targets: [entity-builder] }
#   used_by:
#   - id: deploy.standard.require-secret-dependency-declaration
#     path: .agentic/04.deploy/00-target-alignment/standards/require-secret-dependency-declaration.md
#   - id: deploy.command.validate-secret-dependency-declaration
#     path: scripts/04.deploy/lifecycle/00-target-alignment/validate-secret-dependency-declaration/script.sh
schema: deploy/secret-dependency-contract-schema/v1
owner: scope configuration.secret_dependencies[]
required_when_any_secret_is_injected:
  - id
  - dependency
  - purpose
  - owner
  - authorised_workloads
  - access_class
  - injection_name
  - target_reference_id
  - expected_fields
  - delivery
  - access_grant
  - rotation
  - revocation
  - retirement
  - failure_behaviour
  - safe_diagnostics
allowed_access_classes: [runtime, migration, administrative]
dependency: must-identify-a-declared-scope-dependency
workload_lifecycle:
  runtime: [long-running-server, continuous-worker, run-to-completion-task]
  migration: [run-to-completion-task]
  administrative: [run-to-completion-task]
administrative_runtime_identity_probe:
  owner: health_recovery.workloads[].administrative_execution.runtime_identity_probe
  variants:
    in_administrator:
      exact_fields: [dependency, credential_access_class, purpose]
      identity_owner: administrative-executor
    separate_task:
      exact_fields: [dependency, credential_access_class, purpose, workload, target_workload]
      workload: distinct-uniquely-declared-run-to-completion-task-with-successful-completion
      target_workload: uniquely-declared-application-server-or-worker
      authentication: same-single-runtime-workload-identity-reference-for-proof-and-target
      prohibited_on_proof: [administrative-credentials, migration-credentials, administrative-execution, migration-execution, server-mediated-proof]
  dependency: same-declared-dependency-as-administrative-execution
  credential_access_class: runtime
  purpose: nonempty-description
  evidence: provider-binding-and-actual-permitted-denied-operations-required
  application_path: independently-required-not-proven-by-separate-task
  field_guide:
    - path: administrative_execution.runtime_identity_probe.workload
      what: Optional separate task that performs the runtime permission check.
      does: Moves runtime authentication off the administrator without removing proof.
      validation: Required together with target_workload; unique distinct completion task, no privileged access, matching runtime authentication reference.
    - path: administrative_execution.runtime_identity_probe.target_workload
      what: Application server or worker whose database identity is tested.
      does: Prevents substituting an unrelated runtime account as proof.
      validation: Required together with workload; unique server/worker sharing the one runtime reference for the same dependency. Physical binding and application-path proof remain required.
delivery: { method: target-secret-store-injection, phase: workload-startup }
access_grant:
  required: [owner, policy, privilege_boundary, proof_requirement]
  privilege_boundary: declared-access-class-boundary-not-effective-privilege-proof
  proof_requirement: provider-binding-and-effective-access-observation-required
rotation:
  application_behavior: replacement-required
  completed_task_behavior: no-replay
revocation:
  required: [owner, policy, condition, workload_effect, proof_requirement]
  workload_effect: block-new-start-and-stop-active-authorised-workloads
  proof_requirement: delivery-and-dependency-access-denied-observation-required
retirement:
  required: [owner, policy, condition]
failure_behaviour:
  server_or_worker:
    startup: { unavailable: process-exits, invalid_shape: process-exits }
    readiness: { unavailable: block-readiness, invalid_shape: block-readiness }
  completion_task:
    completion:
      unavailable: { outcome: unsuccessful-completion, diagnostic_code: safe_diagnostics.unavailable }
      invalid_shape: { outcome: unsuccessful-completion, diagnostic_code: safe_diagnostics.invalid_shape }
prohibitions:
  - secret values
  - passwords
  - tokens
  - connection strings
  - provider-specific secret ARNs
  - unsupported live-refresh claims
  - unbounded secret-store reads
  - credentials in diagnostics or evidence
workload_identity_dependency:
  owner: scope configuration.workload_identity_dependencies[]
  use_when: provider supplies a short-lived task/workload identity token rather than an injected secret
  required: [id, dependency, purpose, owner, authorised_workloads, access_class, authentication_reference_id, delivery, access_grant, authentication_lifecycle, revocation, retirement, failure_behaviour, safe_diagnostics]
  delivery: { method: workload-identity-token, phase: dependency-connection }
  reference: opaque-target-neutral-authentication-reference-only
  provider_proof: provider-binding-and-effective-access-observation-required
  authentication_lifecycle:
    required: [owner, policy, task_role_credential_renewal, new_connection_token_generation, existing_session_behavior, replacement_policy, completed_task_behavior]
    task_role_credential_renewal: provider-managed-automatic
    new_connection_token_generation: generate-for-each-new-database-connection
    existing_session_behavior: remains-valid-until-closed-or-governed-revocation
    replacement_policy: not-required-for-normal-token-expiry
    completed_task_behavior: no-replay
  prohibitions: [token-values, provider-specific-identity-arns-in-portable-contract, implicit-authentication]
