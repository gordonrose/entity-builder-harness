#   layer: 04.deploy
#   domain: deployment.secret-management
#   disciplines: [agentic, security, sre]
#   kind: schema-template
#   purpose: Provide the safe shape for a workload secret dependency declaration.
#   portability: { class: reusable, targets: [entity-builder] }
#   used_by:
#   - id: deploy.schema.secret-dependency-contract.v1
#     path: .agentic/04.deploy/00-target-alignment/schemas/secret-dependency-contract.v1.schema.yml
configuration:
  value_policy: names-and-shapes-only-no-values
  secret_names: [EXAMPLE_RUNTIME_SECRET_JSON]
  secret_dependencies:
    - id: example-runtime-credential
      dependency: example-dependency
      purpose: authenticate-one-workload-to-one-dependency
      owner: dependency-owner
      authorised_workloads: [example-server]
      access_class: runtime
      injection_name: EXAMPLE_RUNTIME_SECRET_JSON
      target_reference_id: example-runtime-credential
      expected_fields: [username, password]
      delivery: { method: target-secret-store-injection, phase: workload-startup }
      access_grant: { owner: dependency-owner, policy: governed-access-grant, privilege_boundary: declared-access-class-boundary-not-effective-privilege-proof, proof_requirement: provider-binding-and-effective-access-observation-required }
      rotation: { owner: dependency-owner, policy: governed-rotation, application_behavior: replacement-required, completed_task_behavior: no-replay }
      revocation: { owner: dependency-owner, policy: governed-revocation, condition: workload-retirement-or-security-incident, workload_effect: block-new-start-and-stop-active-authorised-workloads, proof_requirement: delivery-and-dependency-access-denied-observation-required }
      retirement: { owner: dependency-owner, policy: governed-revocation-and-removal, condition: after-dependent-workload-retirement }
      failure_behaviour:
        startup: { unavailable: process-exits, invalid_shape: process-exits }
        readiness: { unavailable: block-readiness, invalid_shape: block-readiness }
      safe_diagnostics: { unavailable: DEPENDENCY_SECRET_UNAVAILABLE, invalid_shape: DEPENDENCY_SECRET_SHAPE_INVALID, credential_rejected: DEPENDENCY_CREDENTIAL_REJECTED, access_denied: DEPENDENCY_ACCESS_DENIED }
