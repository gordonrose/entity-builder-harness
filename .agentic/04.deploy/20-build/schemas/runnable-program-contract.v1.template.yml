schema: deploy/runnable-program-contract/v1
id: replace-with-stable-contract-id
version: 1
runnable_programs:
  - id: replace-with-program-id
    entrypoint: artifacts/replace-with-program.main.js
    runtime_executable: node
    approved_dependencies:
      - replace-with-reviewed-dependency-id
    observed_dependencies:
      - replace-with-reviewed-dependency-id
image_contracts:
  - id: replace-with-image-contract-id
    program: replace-with-program-id
    command_mode: exec
    command:
      - node
      - artifacts/replace-with-program.main.js
package_candidates:
  - id: replace-with-candidate-id
    image_contract: replace-with-image-contract-id
    immutable_identity_rule: runtime-bound-sha256
candidate_verification:
  candidate: replace-with-candidate-id
  required_evidence_fields:
    - package_contract_id
    - candidate_id
    - program_id
    - source_revision
    - image_digest
    - release_identity
    - health_verdict
    - verification_verdict
    - checked_at
    - receipt_reference
