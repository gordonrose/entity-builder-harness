schema: deploy/runnable-program-contract-schema/v1
contract_schema: deploy/runnable-program-contract/v1
companion_guide: .agentic/04.deploy/20-build/schemas/runnable-program-contract.v1.guide.md
required_top_level:
  - schema
  - id
  - version
  - runnable_programs
  - image_contracts
  - package_candidates
  - candidate_verification
safe_evidence_fields:
  - candidate_id
  - checked_at
  - health_verdict
  - image_digest
  - package_contract_id
  - program_id
  - receipt_reference
  - release_identity
  - source_revision
  - verification_verdict
field_guide:
  - path: dependency_bindings
    what: Optional executable bindings for workspace-TypeScript programs, keyed by the existing logical dependency approval IDs.
    validation: Each selected binding contains exactly one workspace_package name or a nonempty external_packages list; package paths and exports are read from workspace manifests, never copied here.
  - path: runnable_programs[].build
    what: Optional build selection for a workspace-TypeScript program.
    validation: kind is workspace-typescript and typescript_project names an existing repository-relative tsconfig; selected approved dependencies must have bindings and derived runtime dependencies must remain within approval.
  - path: runnable_programs[]
    what: One program that may be selected as a package root.
    validation: Requires a stable ID, a relative entrypoint, runtime_executable, and approved and observed dependency lists.
  - path: runnable_programs[].execution_kind
    what: Process execution by default, or explicit managed-handler invocation by an external managed runtime.
    validation: process retains the executable-plus-file command; managed-handler requires node, a relative .js/.cjs/.mjs entrypoint without traversal and an ASCII handler_export identifier.
  - path: runnable_programs[].approved_dependencies
    what: Dependencies deliberately allowed in the program boundary.
    validation: Every observed dependency must be listed here before package construction may continue.
  - path: image_contracts[]
    what: An executable image boundary for one declared program.
    validation: Process programs require exec-form tokens beginning with runtime_executable followed immediately by entrypoint, without shell syntax. Managed handlers require command_mode handler and exactly one module.export token derived from the declared entrypoint and handler_export; provider packaging proves the actual runtime bootstrap separately.
  - path: package_candidates[]
    what: A candidate package formed from one image contract.
    validation: Requires runtime-bound-sha256 as its immutable identity rule until a package digest exists.
  - path: candidate_verification.required_evidence_fields
    what: Field names expected in the later safe candidate receipt.
    validation: Every field name is drawn from safe_evidence_fields; values are not declared here.
prohibitions:
  - secret values
  - credential values
  - tokens
  - headers
  - request bodies
  - personal data
  - connection data
  - full locations
  - raw provider responses
