schema: deploy/scope-lifecycle-inventory-schema/v1
embedded_in: infra/04.deploy/03.product/targets/<target>/20-scopes/scope-index.yml
required_fields: [target, scopes]
lifecycle_states: [active, candidate, accepted-historical]
scope_entry:
  required_fields: [id, lifecycle, declaration, workload_binding, workload_ownership]
  canonical_paths:
    declaration: <scope>/00-declaration/declaration-contract.yml
    workload_binding: <scope>/10-workload-binding/workload-binding.yml
  workload_ownership: exact-set-of-workload-binding.workloads[].id
succession:
  candidate:
    required_fields: [predecessor]
    predecessor_state: active
    ownership: must-overlap-predecessor
  accepted_historical:
    required_fields: [successor]
    successor_state: active
    successor_predecessor: must-reference-historical-scope
    ownership: must-overlap-successor
  active:
    predecessor: optional; when-present-must-be-accepted-historical-reciprocal-successor
active_ownership: exactly-one-active-scope-per-workload-identity
inventory_completeness: every-new-framework-scope-directory-is-indexed
legacy_exceptions:
  prohibition: cannot-cover-any-indexed-new-framework-scope
  status: retiring-reference-only
prohibitions:
  - secret values
  - credential values
  - connection strings
  - raw provider responses
  - personal data
  - internal addresses
