schema: deploy/persistence-accepted-release-schema/v1
record_schema: deploy/persistence-accepted-release/v1
required_fields:
- schema
- target
- scope
- status
- release
- acceptance
- provider_observation
evidence_classes:
- live
- simulated
legacy_evidence_class: live
production_status: accepted
simulation_status: rehearsed
identity_fields:
- source_revision
- image_digest
- runtime_task_definition
- verifier_task_definition
- package_custody_reference
- restoration_verifier_release
retention: Completed proof receipts remain immutable; validation never queries expired
  historical tasks.
required_proofs:
- migration-applied-state
- effective-privilege
- server-replacement
- server-replacement-read
- runtime-identity-initial-access
- credential-revocation
- credential-revocation-unready
- credential-recovery
- credential-recovery-health
- credential-recovery-read
- rollback-b-health
- rollback-b-read
- rollback-final-health
- rollback-final-read
- isolated-restore
ordinary_update:
  qualification: unchanged-recovery-inputs-and-current-functional-proof
  fresh_tasks: [migration-applied-state, effective-privilege, runtime-identity-initial-access, rollback-final-read]
  retained_evidence: exact-accepted-predecessor-capability-history
  changed_inputs: require-affected-capability-requalification
  # The baseline's read verifier is its meaningful workload smoke. Readiness
  # and running-image/source identity remain separately observed, never reused.
  recovery_input_paths:
  - packages/core
  - platform
  - infra/04.deploy/03.product/entrypoints
  - infra/04.deploy/03.product/image/core-server-persistence
  - scripts/04.deploy/lifecycle/20-build
  - scripts/04.deploy/lifecycle/40-package
  - scripts/repo/workspace-build
  - package.json
  - package-lock.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - tsconfig.json
  - .npmrc
successor_record_schema: deploy/persistence-collected-acceptance/v2
