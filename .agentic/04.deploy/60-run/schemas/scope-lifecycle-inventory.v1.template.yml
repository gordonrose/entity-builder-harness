#   - id: deploy.workflow.govern-scope-lifecycle
#     path: .agentic/04.deploy/60-run/workflows/govern-scope-lifecycle.md
schema: deploy/scope-lifecycle-inventory/v1
target: replace-with-target
scopes:
  - id: replace-with-active-scope
    lifecycle: active
    declaration: replace-with-active-scope/00-declaration/declaration-contract.yml
    workload_binding: replace-with-active-scope/10-workload-binding/workload-binding.yml
    workload_ownership: [replace-with-bound-workload-id]

  # Add only when an accepted scope is being succeeded. It is not active and
  # cannot accept a release until the governed transition is complete.
  - id: replace-with-candidate-scope
    lifecycle: candidate
    predecessor: replace-with-active-scope
    declaration: replace-with-candidate-scope/00-declaration/declaration-contract.yml
    workload_binding: replace-with-candidate-scope/10-workload-binding/workload-binding.yml
    workload_ownership: [replace-with-bound-workload-id]
legacy_exceptions: []
