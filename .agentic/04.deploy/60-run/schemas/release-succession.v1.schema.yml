schema: deploy/release-succession-schema/v1
records:
  rollback_compatibility:
    schema: deploy/release-rollback-compatibility/v1
    required: [target, scope, status, historical_release, rollback, proof, proof_set]
    historical_release_required: [release_id, source_revision, image_digest]
    rollback_required: [id, configuration_contract, permission_contract, workloads, proof_set_sha256]
    proof_required: [qualified_at, receipt_count]
    intent: additive-fresh-proof-for-a-retained-image-not-retroactive-acceptance
  candidate:
    schema: deploy/release-candidate/v1
    required: [target, scope, status, release, proof, proof_set]
    release_required: [id, source_revision, image_digest, configuration_contract, permission_contract, proof_set_sha256]
    contract_required: [path, sha256]
    proof_required: [accepted_at, receipt_count]
    proof_set_entry_required: [path, sha256]
    proof_set_path_base: evidence-root
    contract_path_base: repository-root
    receipt_count: exact-proof-set-cardinality
    evidence_class: live-by-default-or-explicit-simulated-in-temporary-rehearsal
  immutable_history:
    schema: deploy/accepted-release-history/v1
    required: [target, scope, status, release, predecessor, evidence]
    evidence_required: [path, sha256, kind]
    legacy_contract_status: legacy-not-recorded
  current_reference:
    schema: deploy/release-current-ref/v1
    required: [target, scope, status, release_id, record, predecessor, promoted_at]
    record_required: [path, sha256]
promotion:
  expected_predecessor: required
  rejects: [stale, conflicting, malformed, incomplete, altered, cross-target, cross-scope]
  idempotency: same-successor-and-recorded-predecessor
  interruption_recovery: validate-archive-then-advance-current-reference
rollback_compatibility:
  source: release-candidates
  immutable_archive: rollback-compatibility
  required_before_selecting_legacy_retained_image: true
  preserves: [least-privilege-runtime-grants, separate-administration-identity, protected-migration-history, revocation]
  forbids: [re-broaden-runtime-grants, inject-administrator-into-ordinary-migration, replay-completed-migration, undo-revocation]


evidence_reuse:
  historical: verify-retained-candidate-and-receipt-bytes-without-requiring-current-contract-equality
  promotion_and_rollback: require-current-configuration-and-permission-contract-hashes
  current_reference: verify-complete-predecessor-lineage
rehearsal:
  cli_flag: --rehearsal-root
  location: temporary-root-outside-repository
  production_accepts_simulated: false
