schema: deploy/provider-condition-evidence-schema/v1
evidence_schema: deploy/provider-condition-evidence/v1
required_fields:
  - schema
  - condition_id
  - target
  - status
  - checked_at
  - next_check_after
  - evidence_reference
allowed_statuses:
  - not-requested
  - requested
  - waiting-on-provider
  - verified
  - expired
  - waived-by-approved-exception
waiver_required_fields:
  - authority_reference
  - reason_code
  - expires_at
  - compensating_controls
  - follow_up_owner
prohibited_values:
  - account identifiers
  - secret values
  - email addresses
  - provider response bodies
  - endpoint URLs
