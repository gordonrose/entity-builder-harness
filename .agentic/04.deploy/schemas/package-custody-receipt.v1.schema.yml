schema: deploy/package-custody-receipt-schema/v1
receipt_schema: deploy/package-custody-receipt/v1
companion_guide: .agentic/04.deploy/schemas/package-custody-receipt.v1.guide.md
required_fields:
  - schema
  - target
  - environment_class
  - provider_region_alias
  - candidate_id
  - package_contract_id
  - program_id
  - source_revision
  - image_digest
  - release_identity
  - checked_at
  - checks
  - verdict
  - receipt_reference
allowed_check_ids:
  - runnable_program_contract
  - dependency_boundary
  - delivery_access_static
  - delivery_access_live
  - local_image_smoke
  - ecr_scan
  - sbom
  - provenance_attestation
required_check_verdict: passed
allowed_verdicts:
  - qualified
  - rejected
safe_value_rules:
  source_revision: full commit SHA only
  image_digest: sha256 digest only
  provider_region_alias: provider and region alias; never account identifier
  receipt_reference: opaque delivery-run identifier; never a URL
prohibited_values:
  - secret values
  - credential values
  - tokens
  - email addresses
  - request headers
  - request bodies
  - personal data
  - connection data
  - full provider locations
  - raw provider responses
  - vulnerability details
