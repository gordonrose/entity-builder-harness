schema: deploy/declaration-contract-schema/v1
required:
  - schema
  - id
  - status
  - target
  - scope
  - requirements
field_guide:
  - path: schema
    meaning: Identifies the declaration-contract format.
    rules: Must equal deploy/declaration-contract/v1 in a contract instance.
  - path: id
    meaning: Stable identifier for one bounded declaration scope.
    rules: Must not be reused for a materially different capability scope.
  - path: target
    meaning: Names the target profile and environment this contract expects.
    rules: Must not contain credentials or secret values.
  - path: scope
    meaning: States what the contract covers and explicitly excludes.
    rules: A coverage result applies only to the named scope.
  - path: requirements[]
    meaning: Lists the complete declaration and proof chain for one requirement.
    rules: Each item must have a unique id, owner, non-secret expectation, declaration, and proof references.
requirement_required:
  - id
  - purpose
  - required_by
  - declarations
  - expectation
  - local_proofs
  - target_proofs
  - owner
requirement_optional:
  - package_proofs
  - run_proofs
  - notes
  - not_applicable
proof_contract:
  references: Stable check IDs from scripts/repo/check-selection/checks.yml; informal command strings do not qualify.
  subject: Each check binds kind profile and the exact target.profile of this declaration.
  stages: local_proofs local; package_proofs package; target_proofs deploy; run_proofs acceptance.
  non_applicability: Empty package/target/run lists require a nonempty not_applicable reason; local proof is mandatory.
local_only_scope:
  profile_schema: deploy/local-target-profile/v1
  execution: {kind: local, publication: none, provider_deployment: none}
  stage_applicability: Deploy and acceptance may be explicitly inapplicable with reasons only for this local execution profile; applicable scopes cannot use this exemption.
  package_proof: Finished-image behaviour remains required for supported local images.
prohibitions:
  - secret values
  - tokens
  - raw provider responses
  - customer data
  - unbounded provider queries
