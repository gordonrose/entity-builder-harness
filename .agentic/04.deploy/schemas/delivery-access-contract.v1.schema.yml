schema: deploy/delivery-access-contract-schema/v1
contract_schema: deploy/delivery-access-contract/v1
required_fields:
  - schema
  - pipeline
  - actor
  - provider_policy_source
  - workflow
  - operations
operation_required_fields:
  - id
  - workflow_step
  - provider_action
  - resource_class
  - purpose
  - proof
safe_value_rules:
  provider_action: provider action name only; never a credential or command line
  resource_class: logical resource class or declared resource identifier; never an endpoint
  proof: bounded safe diagnostic or named check only
  workflow: repository-relative workflow path only
prohibited_values:
  - credentials
  - account identifiers
  - secret values
  - endpoint URLs
  - raw provider responses
