  drift:
    status: expected
    items:
      - Existing staging alarm policy now declares the reusable rule and target index explicitly; its five thresholds and resource definitions are unchanged.
      - The existing static staging verifier is extended to reject a missing or incorrect policy/index declaration and unsupported policy severity.
  ownership:
    status: ok
    notes:
      - Target-specific thresholds, dimensions, and notification choices remain deploy target-profile policy.
      - Provider-neutral monitoring vocabulary remains in packages/core and does not own provider alarms.
      - CloudFormation remains the provider implementation, while the deploy target owns policy and readiness evidence.
      - The target index is discovery-only and intentionally does not become an implementation source.

