      summary: Each product target keeps its complete alarm policy in the target profile's observability alarms list.
      evidence_path: docs/04.deploy/source-material/03.product/platform-target-alerting-policy.md
    - claim_id: platform-target-alerting.link-only-index
      summary: The repository-wide target index links canonical policies and must not duplicate mutable threshold or dimension values.
      evidence_path: docs/04.deploy/source-material/03.product/platform-target-alerting-policy.md
    - claim_id: platform-target-alerting.complete-definition
      summary: Every alarm defines an exact signal, condition, evaluation, response, provider implementation, and telemetry prerequisite where needed.
      evidence_path: docs/04.deploy/source-material/03.product/platform-target-alerting-policy.md
    - claim_id: platform-target-alerting.safe-boundary
      summary: Alarm metadata, notification proof, and metric dimensions exclude sensitive or unbounded values.
      evidence_path: docs/04.deploy/source-material/03.product/platform-target-alerting-policy.md
    - claim_id: platform-target-alerting.drift-and-live-proof
      summary: Policy-to-IaC comparison and safe live delivery proof are required separately from provider resource syntax.
      evidence_path: docs/04.deploy/source-material/03.product/platform-target-alerting-policy.md
