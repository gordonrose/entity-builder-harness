    - claim_id: untrusted-input-and-bounded-agent-safety.retrieval-is-scoped
      summary: Retrieval filters access before model exposure, preserves provenance, and never constructs policy, secrets, tool definitions, or executable instructions from retrieved text.
      evidence_path: docs/03.product/source-material/guides/markdown/untrusted-input-and-bounded-agent-safety-v1.md
    - claim_id: untrusted-input-and-bounded-agent-safety.consequential-actions-and-proof
