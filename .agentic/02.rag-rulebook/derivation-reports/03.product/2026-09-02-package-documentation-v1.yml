semantic_review:
  source_claims:
    - claim_id: package-documentation.root-readme-at-a-package-boundary
      summary: New or materially reorganised package boundaries need concise root README documentation of purpose, public surface, responsibility map, dependency direction, and verification.
      evidence_path: docs/03.product/source-material/guides/markdown/package-documentation-v1.md
    - claim_id: package-documentation.local-readme-for-multi-file-capability
      summary: A named multi-file capability module needs a local README only when it reduces genuine search and inference cost.
      evidence_path: docs/03.product/source-material/guides/markdown/package-documentation-v1.md
    - claim_id: package-documentation.barrel-readme-and-tests-have-distinct-roles
      summary: index.ts defines supported exports, README explains responsibility layout, and tests prove behaviour; none replaces the others.
      evidence_path: docs/03.product/source-material/guides/markdown/package-documentation-v1.md
    - claim_id: package-documentation-maintenance-is-same-change
      summary: The nearest relevant README must be updated when a substantive responsibility file changes, with security-safe and incremental adoption constraints.
      evidence_path: docs/03.product/source-material/guides/markdown/package-documentation-v1.md
  conflicts:
    status: none-found
    search_scope:
      - docs/03.product/rules/core/layers/packages-core.yml
      - docs/03.product/rules/platform/layers/platform.yml
      - docs/03.product/rules/apps/layers/apps.yml
      - docs/03.product/rules/concerns/
      - packages/core/README.md
      - platform/**/README.md
    items: []
  drift:
    status: expected
    items:
      - type: layer-rule-reference
        summary: Core, platform, and app layer rules now reference the single canonical concern instead of carrying independent README conventions.
      - type: retrieval-coverage
        summary: New source and rule require a source projection, generated recognition material, and a focused selector fixture.
      - type: staged-adoption
        summary: Existing package documentation is not retroactively rewritten; coverage grows with material package or capability changes.
  ownership:
    status: ok
    notes:
      - The policy is product-wide architecture guidance, so it belongs in docs/03.product/rules/concerns rather than a core-only or platform-only ruleset.
      - The source material belongs in docs/03.product/source-material and review/derivation evidence belongs in .agentic/02.rag-rulebook.
      - The rule governs package documentation; individual package README files remain adjacent to the packages they explain.

