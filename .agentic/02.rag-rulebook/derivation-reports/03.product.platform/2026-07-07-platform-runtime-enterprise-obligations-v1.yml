semantic_review:
  source_claims:
    - claim_id: platform.contracts.define-app-facing-runtime-boundary
      summary: Before concrete server or worker runtime modules are implemented, platform/contracts should define stable provider-neutral app registration, mount, route, job, health, config schema, lifecycle, feature flag, request context, and job context contracts.
      evidence_path: docs/03.product/source-material/platform/platform-runtime-enterprise-obligations-v1.md
    - claim_id: platform.contexts.compose-core-facts-in-platform-contracts
      summary: Composed request and job contexts may combine core primitives such as correlation id, causation id, tenant, principal, locale, logger, metrics, config, queue message, delivery metadata, flags, and cancellation, but should start in platform/contracts rather than packages/core/shared.
      evidence_path: docs/03.product/source-material/platform/platform-runtime-enterprise-obligations-v1.md
    - claim_id: platform.flags.provider-neutral-reader
      summary: Feature flag access should start as a provider-neutral reader contract and platform adapters may bind it to environment, config, database, or third-party providers later.
      evidence_path: docs/03.product/source-material/platform/platform-runtime-enterprise-obligations-v1.md
    - claim_id: platform.contract-identifiers-name-owner-and-capability
      summary: Platform-contract types, fields, and registries carry functional category; app-owned route, job, flag, health, and permission values carry stable app ownership and capability without repeating the category.
      evidence_path: docs/03.product/source-material/platform/platform-runtime-enterprise-obligations-v1.md
    - claim_id: platform.contract-permissions-exclude-policy-facts
      summary: Stable permission and contribution names must not encode tenant, region, group, role, customer, provider, claim, scope, API version, personal data, or secret information; those are evaluation facts, not identifier vocabulary.
      evidence_path: docs/03.product/source-material/platform/platform-runtime-enterprise-obligations-v1.md
    - claim_id: platform.registry-validates-app-identifier-ownership
      summary: Constructors validate local identifier syntax, while a later platform registry implementation validates that app-owned declarations begin with the mounting app id; migrations require compatibility evidence and no silent renames.
      evidence_path: docs/03.product/source-material/platform/platform-runtime-enterprise-obligations-v1.md
    - claim_id: platform.logging.normalizes-rich-runtime-values
      summary: Platform logging adapters should normalize errors, provider failures, framework objects, dates, maps, sets, buffers, streams, circular values, and oversized fields into redacted bounded plain log fields.
      evidence_path: docs/03.product/source-material/platform/platform-runtime-enterprise-obligations-v1.md
    - claim_id: platform.events.use-durable-outbox-when-publication-matters
      summary: Platform event delivery should record outbox messages in the same transaction as important state changes and publish them through a retryable observable platform relay.
      evidence_path: docs/03.product/source-material/platform/platform-runtime-enterprise-obligations-v1.md
    - claim_id: platform.audit.requires-durable-runtime-and-lifecycle
      summary: Platform audit runtime should provide durable recorders with retention, legal hold, export, SIEM integration, access controls, and explicit audit-failure behavior where required.
      evidence_path: docs/03.product/source-material/platform/platform-runtime-enterprise-obligations-v1.md
    - claim_id: platform.payload-metadata-size-budgets-required
      summary: Platform adapters should define size, depth, key-count, truncation, rejection, summary, pointer, checksum, and storage-reference policies for logs, events, audit, prompts, and diagnostics.
      evidence_path: docs/03.product/source-material/platform/platform-runtime-enterprise-obligations-v1.md
    - claim_id: infra.provisions-runtime-obligation-resources
      summary: Infra should provision log sinks, brokers, queues, DLQs, stores, encryption, backups, retention, alarms, dashboards, IAM permissions, and deployment topology that platform adapters need.
      evidence_path: docs/03.product/source-material/platform/platform-runtime-enterprise-obligations-v1.md
  conflicts:
    status: none-found
    search_scope:
      - docs/03.product/rules/platform/layers/platform.yml
      - docs/03.product/rules/core/layers/packages-core.yml
      - docs/04.deploy/rules/layers/infra.yml
      - docs/03.product/rules/platform/concerns/events-messaging-async.yml
      - docs/03.product/rules/platform/concerns/persistence-files-storage.yml
      - docs/03.product/rules/platform/concerns/reporting-analytics-audit.yml
      - docs/03.product/rules/platform/concerns/config-runtime-settings.yml
      - docs/03.product/rules/platform/concerns/identity-access-security.yml
      - docs/03.product/rules/platform/concerns/tenancy.yml
    items: []
  drift:
    status: expected
    items:
      - topic: platform-contract-identifier-enforcement
        impact: Existing platform-contract constructors and tests currently validate syntax but do not enforce app-prefix ownership; the rule documents the target convention without claiming that runtime enforcement is already present.
        handling: A later implementation slice must preserve public imports, add registry-level accepted/rejected tests, and migrate any existing nonconforming identifiers deliberately.
  ownership:
    status: ok
    notes:
      - Core remains contract-only and provider-neutral.
      - Platform owns runtime adapters, normalization, durable delivery, audit recorders, and enforcement.
      - Infra owns cloud resources, retention topology, alarms, permissions, and deployment resources.

