schema: rag-rulebook/retrieval-selector-evaluation/v1
fixture_id: retrieval-selector.v1.platform-contract-identifier-naming
status: active
owner_layer: 02.rag-rulebook
purpose: Prove a platform-contract naming request retrieves the ownership-and-capability naming rule without treating policy facts as identifier text.
input:
  request_text: I need to implement the semantic identifier standard in platform/contracts and docs/03.product/rules/platform/layers/platform.yml. How should a PlatformAppId and app-mounted routes, jobs, feature flags, health checks, permissions, config keys, and error codes express app ownership and capability without repeating the category or exposing tenant, role, group, provider, or customer policy facts?
  session:
    trust_routing: true
    layer: 03.product
    mode: implementation
    workflow: .agentic/03.product/workflows/default.md
  max_chunks: 8
expected:
  routing:
    layer: 03.product
    mode: implementation
    status: ready
  matched_corpora:
    required:
      - corpus.03.product.platform
  selected_corpora:
    required:
      - corpus.03.product.platform
  selected_content_kinds:
    required:
      - rule
  selected_chunks:
    required_artifact_ids:
      - artifact.layer.platform
    required_rule_ids:
      - platform.contract-identifiers-are-semantic
  required_checks:
    min_count: 1
  citations:
    min_count: 1
  gaps:
    no_unexpected: true
banned:
  selected_corpora:
    - corpus.04.deploy
source_refs:
  - docs/03.product/source-material/platform/platform-runtime-enterprise-obligations-v1.md
  - docs/03.product/rules/platform/layers/platform.yml
  - docs/03.product/rules/platform/concerns/identity-access-security.yml
  - docs/03.product/rules/platform/concerns/tenancy.yml
update_triggers:
