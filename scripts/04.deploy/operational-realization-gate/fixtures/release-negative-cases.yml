    operation: set
    path: [acceptance_matrix, rows, 0, secret_value]
    value: SENTINEL-SENSITIVE-DO-NOT-PRINT
  - id: unsupported-applicability
    operation: set
    path: [acceptance_matrix, rows, 8, verdict]
    value: not-applicable
    expected_code: applicability-unsupported
  - id: missing-accountable-owner
    operation: remove
    path: [acceptance_matrix, rows, 16, owner]
  - id: duplicate-gate
    operation: set
    path: [acceptance_matrix, rows, 1, gate]
    value: scope-risk
  - id: mutable-artifact
    operation: set
    path: [artifact_digests, 0, digest]
    value: latest
