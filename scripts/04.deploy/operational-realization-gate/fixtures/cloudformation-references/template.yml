#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: fixture
#   purpose: Exercise independently discovered CloudFormation references without provider execution.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.test.release-control-cloudformation-inventory
#     path: scripts/04.deploy/release-control/discovery/test_cloudformation_inventory.py
Parameters:
  Prefix:
    Type: String
Conditions:
  UseBackup: !Equals [!Ref Prefix, backup]
Resources:
  Primary:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${Prefix}-primary-${AWS::Region}'
  Backup:
    Type: AWS::SQS::Queue
  Role:
    Type: AWS::IAM::Role
    DependsOn: Primary
    Properties:
      Description: !If [UseBackup, !GetAtt Backup.Arn, !GetAtt Primary.Arn]
Outputs:
  Selected:
    Value: !Ref Role
