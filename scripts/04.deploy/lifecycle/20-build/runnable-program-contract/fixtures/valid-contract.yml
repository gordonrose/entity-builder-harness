schema: deploy/runnable-program-contract/v1
id: generic-server-candidate
version: 1
runnable_programs:
  - id: generic-server
    entrypoint: artifacts/generic-server.main.js
    runtime_executable: node
    approved_dependencies:
      - platform-health
      - platform-observability
      - platform-server
    observed_dependencies:
      - platform-health
      - platform-observability
      - platform-server
image_contracts:
  - id: generic-server-image
    program: generic-server
    command_mode: exec
    command:
      - node
      - artifacts/generic-server.main.js
package_candidates:
  - id: generic-server-candidate
    image_contract: generic-server-image
    immutable_identity_rule: runtime-bound-sha256
candidate_verification:
  candidate: generic-server-candidate
  required_evidence_fields:
    - package_contract_id
    - candidate_id
    - program_id
    - source_revision
    - image_digest
    - release_identity
    - health_verdict
    - verification_verdict
    - checked_at
    - receipt_reference
