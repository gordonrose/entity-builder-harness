name: Delivery coverage
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-local-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyYAML==6.0.2
      - name: Reconcile independent delivery census
        run: python3 scripts/04.deploy/inventory-deploy-control/script.py --delivery --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Exercise discovery and command boundaries
        run: bash scripts/04.deploy/inventory-deploy-control/smoke-test.sh
      - name: Execute selected local proofs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        # The selector defaults to integration; preserve the protected exact argv.
        run: bash scripts/repo/check-selection/script.sh --ci --execute-local --json
