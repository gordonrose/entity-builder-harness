name: Reconcile Platform Shell Staging AWS State

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-shell-staging-reconciliation
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::337159794548:role/github-platform-shell-staging-reconciliation

jobs:
  reconcile:
    name: Reconcile declared staging controls
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce remote-main source
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Reconciliation blocked: expected refs/heads/main, got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate reconciliation policy locally
        run: npm run platform:shell:deployment-reconciliation -- --validate --json

      - name: Configure reconciliation AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reconcile declared AWS state
        run: npm run platform:shell:deployment-reconciliation -- --aws-credential-source environment --mode continuous --json
