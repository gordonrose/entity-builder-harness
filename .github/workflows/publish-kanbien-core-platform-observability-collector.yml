name: Publish Kanbien Core Platform Observability Collector
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: kanbien-core-platform-observability-collector-publication, cancel-in-progress: false }

jobs:
  build-and-qualify:
    outputs:
      archive_sha256: ${{ steps.archive.outputs.sha256 }}
      image_id: ${{ steps.archive.outputs.image_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Enforce protected main source
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Install script dependencies
        run: python3 -m pip install PyYAML==6.0.2
      - name: Enforce delivery-chain registration and contracts
        run: python3 scripts/04.deploy/inventory-deploy-control/script.py --delivery --check

      - name: Qualify target collector contract
        run: |
          bash scripts/04.deploy/lifecycle/00-target-alignment/validate-observability-mvp-declaration/script.sh --json
          bash scripts/04.deploy/lifecycle/40-package/targets/kanbien-core-platform/core-server-persistence-observability-collector-package-custody/script.sh --json
          bash scripts/04.deploy/lifecycle/40-package/targets/kanbien-core-platform/core-server-persistence-package-custody/validate-delivery-access/script.sh --json
      - name: Build the declared minimal collector source
        run: |
          set -euo pipefail
          docker build --pull --platform linux/amd64 \
            --file infra/04.deploy/03.product/image/core-server-persistence-observability-collector/Dockerfile \
            --tag kanbien-observability-collector:qualification .
      - name: Qualify exact collector startup with non-secret configuration
        run: |
          bash scripts/04.deploy/lifecycle/40-package/targets/kanbien-core-platform/core-server-persistence-observability-collector-package-custody/qualify-image.sh
          python3 scripts/04.deploy/lifecycle/40-package/package-custody-receipt/qualification.py record --image kanbien-observability-collector:qualification --receipt "$RUNNER_TEMP/qualified-image.json" --input infra/04.deploy/03.product/image/core-server-persistence-observability-collector/image-contract.yml --input infra/04.deploy/03.product/image/core-server-persistence-observability-collector/collector-qualification-config.yml --configuration-input scripts/04.deploy/lifecycle/00-target-alignment/provider-adapters/aws/ecs-runtime-configuration.py infra/04.deploy/03.product/targets/kanbien-core-platform/30-provider-realization/aws/cloudformation/core-server-persistence.yml observability-collector --input scripts/04.deploy/lifecycle/40-package/targets/kanbien-core-platform/core-server-persistence-observability-collector-package-custody/qualify-image.sh --input scripts/04.deploy/lifecycle/40-package/targets/kanbien-core-platform/core-server-persistence-observability-collector-package-custody/behavior-test.py
      - name: Export exact qualified collector archive
        id: archive
        run: |
          set -euo pipefail
          image_id="$(python3 scripts/04.deploy/lifecycle/40-package/package-custody-receipt/qualification.py verify --image kanbien-observability-collector:qualification --receipt "$RUNNER_TEMP/qualified-image.json" --configuration-input scripts/04.deploy/lifecycle/00-target-alignment/provider-adapters/aws/ecs-runtime-configuration.py infra/04.deploy/03.product/targets/kanbien-core-platform/30-provider-realization/aws/cloudformation/core-server-persistence.yml observability-collector)"
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          docker save kanbien-observability-collector:qualification -o "$RUNNER_TEMP/observability-collector.scan-input.tar"
          sha256sum "$RUNNER_TEMP/observability-collector.scan-input.tar" | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"
      - name: Export exact qualified image for unprivileged scan
        uses: actions/upload-artifact@v4
        with:
          name: kanbien-core-platform-observability-collector-scan-input-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/observability-collector.scan-input.tar
            ${{ runner.temp }}/qualified-image.json
          if-no-files-found: error
          overwrite: false
          retention-days: 1

  scan-qualified-payload:
    needs: build-and-qualify
    permissions: { contents: read }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retrieve exact qualified collector archive
        uses: actions/download-artifact@v4
        with:
          name: kanbien-core-platform-observability-collector-scan-input-${{ github.run_id }}
          path: scan-input
      - name: Verify collector archive provenance
        run: |
          set -euo pipefail
          actual="$(sha256sum scan-input/observability-collector.scan-input.tar | awk '{print $1}')"
          test "$actual" = "${{ needs.build-and-qualify.outputs.archive_sha256 }}"
      - name: Install pinned portable scanner
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true
      - name: Scan exact qualified collector payload
        id: vulnerability_scan
        continue-on-error: true
        run: |
          trivy image --input scan-input/observability-collector.scan-input.tar \
            --severity HIGH,CRITICAL \
            --ignore-unfixed=false \
            --exit-code 1 \
            --format json \
            --output observability-collector.trivy.json
      - name: Retain vulnerability scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kanbien-core-platform-observability-collector-vulnerability-scan-${{ github.run_id }}
          path: observability-collector.trivy.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Require clean portable vulnerability scan of qualified payload
        if: steps.vulnerability_scan.outcome != 'success'
        run: exit 1

  complete-custody:
    needs: [build-and-qualify, scan-qualified-payload]
    permissions: { contents: read, id-token: write, attestations: write, artifact-metadata: write }
    env:
      AWS_REGION: eu-west-1
      AWS_ROLE_ARN: arn:aws:iam::337159794548:role/github-kanbien-core-platform-delivery
      ECR_REPOSITORY: kanbien-core-platform/core-server
      ECR_URI: 337159794548.dkr.ecr.eu-west-1.amazonaws.com/kanbien-core-platform/core-server
      CANDIDATE_TAG: observability-collector-${{ github.sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: kanbien-core-platform
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Retrieve scanned collector archive
        uses: actions/download-artifact@v4
        with:
          name: kanbien-core-platform-observability-collector-scan-input-${{ github.run_id }}
          path: scan-input
      - name: Retrieve clean collector scan evidence
        uses: actions/download-artifact@v4
        with:
          name: kanbien-core-platform-observability-collector-vulnerability-scan-${{ github.run_id }}
          path: scan-proof
      - name: Verify archive is the scanned qualified payload
        run: |
          set -euo pipefail
          actual="$(sha256sum scan-input/observability-collector.scan-input.tar | awk '{print $1}')"
          test "$actual" = "${{ needs.build-and-qualify.outputs.archive_sha256 }}"
          docker load --input scan-input/observability-collector.scan-input.tar
          python3 scripts/04.deploy/lifecycle/40-package/package-custody-receipt/qualification.py verify --image "${{ needs.build-and-qualify.outputs.image_id }}" --receipt scan-input/qualified-image.json --configuration-input scripts/04.deploy/lifecycle/00-target-alignment/provider-adapters/aws/ecs-runtime-configuration.py infra/04.deploy/03.product/targets/kanbien-core-platform/30-provider-realization/aws/cloudformation/core-server-persistence.yml observability-collector
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ env.AWS_ROLE_ARN }}', aws-region: '${{ env.AWS_REGION }}' }
      - name: Prove fixed delivery read access
        id: access
        run: bash scripts/04.deploy/lifecycle/00-target-alignment/targets/kanbien-core-platform/verify-delivery-role-access/script.sh
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Publish exact scanned collector to private ECR
        id: image
        run: |
          set -euo pipefail
          qualified_image="$(python3 scripts/04.deploy/lifecycle/40-package/package-custody-receipt/qualification.py verify --image "${{ needs.build-and-qualify.outputs.image_id }}" --receipt scan-input/qualified-image.json --configuration-input scripts/04.deploy/lifecycle/00-target-alignment/provider-adapters/aws/ecs-runtime-configuration.py infra/04.deploy/03.product/targets/kanbien-core-platform/30-provider-realization/aws/cloudformation/core-server-persistence.yml observability-collector)"
          docker tag "$qualified_image" "$ECR_URI:$CANDIDATE_TAG"
          docker push "$ECR_URI:$CANDIDATE_TAG"
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$CANDIDATE_TAG" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$ECR_URI@$digest" >/dev/null
          test "$(docker image inspect "$ECR_URI@$digest" --format '{{.Id}}')" = "$qualified_image"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.ECR_URI }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/observability-collector.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest collector provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.ECR_URI }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest collector SBOM
        id: sbom-attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.ECR_URI }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/observability-collector.sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Write and validate safe collector custody receipt
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          QUALIFICATION_OUTCOME: ${{ needs.build-and-qualify.result }}
          ACCESS_OUTCOME: ${{ steps.access.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.image.outcome }}
          SCAN_OUTCOME: ${{ needs.scan-qualified-payload.result }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          SBOM_ATTESTATION_OUTCOME: ${{ steps.sbom-attestation.outcome }}
        run: |
          python3 scripts/04.deploy/lifecycle/40-package/package-custody-receipt/capture.py --target kanbien-core-platform --environment-class private-persistence-candidate --provider-region-alias aws-eu-west-1 --candidate observability-collector --package-contract core-server-persistence-observability-collector-image --program kanbien-observability-collector --scan-check vulnerability_scan --sbom "$RUNNER_TEMP/observability-collector.sbom.spdx.json" --output "$RUNNER_TEMP/observability-collector-package-custody-receipt.json"
          bash scripts/04.deploy/lifecycle/40-package/package-custody-receipt/script.sh --receipt "$RUNNER_TEMP/observability-collector-package-custody-receipt.json" --expected-target kanbien-core-platform --expected-candidate observability-collector --expected-package-contract core-server-persistence-observability-collector-image --expected-program kanbien-observability-collector --json
      - name: Upload safe collector custody evidence
        uses: actions/upload-artifact@v4
        with:
          name: kanbien-core-platform-observability-collector-package-custody-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/observability-collector-package-custody-receipt.json
            ${{ runner.temp }}/observability-collector.sbom.spdx.json
            scan-input/qualified-image.json
            scan-proof/observability-collector.trivy.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30

  retain-safe-failure-diagnostic:
    needs: [build-and-qualify, scan-qualified-payload, complete-custody]
    if: ${{ always() && (needs.build-and-qualify.result == 'failure' || needs.scan-qualified-payload.result == 'failure' || needs.complete-custody.result == 'failure') }}
    permissions: { contents: read }
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Write safe package failure diagnostic
        env:
          BUILD_RESULT: ${{ needs.build-and-qualify.result }}
          SCAN_RESULT: ${{ needs.scan-qualified-payload.result }}
          CUSTODY_RESULT: ${{ needs.complete-custody.result }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/observability-collector-package-failure-diagnostic.json"
          python3 scripts/04.deploy/shared/deployment-operation-diagnostics.py record \
            --target kanbien-core-platform --scope core-server-persistence \
            --operation-id "collector-package-${GITHUB_RUN_ID}" --stage package \
            --original-code collector-package-workflow-failed --exit-status 1 \
            --outcome failed --classification package-workflow-failed \
            --evidence-reference "github-actions-artifact:kanbien-core-platform-observability-collector-package-failure-${GITHUB_RUN_ID}" \
            --next-decision inspect-retained-evidence --report "$report" \
            --fact artifact_identity=observability-collector
      - name: Retain safe package failure diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: kanbien-core-platform-observability-collector-package-failure-${{ github.run_id }}
          path: ${{ runner.temp }}/observability-collector-package-failure-diagnostic.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
