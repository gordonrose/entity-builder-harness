#   kind: ci-workflow
#   purpose: Qualify and mirror the pinned ADOT collector to target-private ECR without deploying it.
#   portability: { class: internal, targets: [] }
#   used_by:
#   - id: infra.04-deploy.03-product.image.core-server-persistence-observability-collector.contract
#     path: infra/04.deploy/03.product/image/core-server-persistence-observability-collector/image-contract.yml
name: Publish Kanbien Core Platform Observability Collector
on: { workflow_dispatch: {} }
permissions: { contents: read }
concurrency: { group: kanbien-core-platform-observability-collector-publication, cancel-in-progress: false }
env:
  # This contract-pinned public identity is pulled only by the protected
  # mirror job. The scanner receives a local artifact after that mirror.
  COLLECTOR_SOURCE_IMAGE: public.ecr.aws/aws-observability/aws-otel-collector@sha256:7968fb60db6a2390a47ba6a2df029745638486e285c9b2487da1b722d0855a3e
jobs:
  qualify-and-publish:
    permissions: { contents: read, id-token: write }
    outputs:
      image_digest: ${{ steps.image.outputs.digest }}
    env:
      AWS_REGION: eu-west-1
      AWS_ROLE_ARN: arn:aws:iam::337159794548:role/github-kanbien-core-platform-delivery
      ECR_REPOSITORY: kanbien-core-platform/core-server
      ECR_URI: 337159794548.dkr.ecr.eu-west-1.amazonaws.com/kanbien-core-platform/core-server
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: kanbien-core-platform
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Enforce protected main source
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Qualify target collector contract
        run: |
          bash scripts/04.deploy/lifecycle/00-target-alignment/validate-observability-mvp-declaration/script.sh --json
          bash scripts/04.deploy/lifecycle/40-package/targets/kanbien-core-platform/core-server-persistence-observability-collector-package-custody/script.sh --json
          bash scripts/04.deploy/lifecycle/40-package/targets/kanbien-core-platform/core-server-persistence-package-custody/validate-delivery-access/script.sh --json
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ env.AWS_ROLE_ARN }}', aws-region: '${{ env.AWS_REGION }}' }
      - name: Prove fixed delivery read access
        run: bash scripts/04.deploy/lifecycle/00-target-alignment/targets/kanbien-core-platform/verify-delivery-role-access/script.sh
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Qualify pinned collector startup
        id: source
        run: |
          set -euo pipefail
          docker pull "$COLLECTOR_SOURCE_IMAGE"
          # The source reference is an OCI index digest. Docker may report the
          # selected AMD64 child digest after pull, so validate the immutable
          # source string through the fixed workflow contract rather than
          # mistaking a platform child for a source-identity mismatch.
          name="kanbien-observability-collector-qualification-$GITHUB_RUN_ID"
          docker run --detach --rm --name "$name" --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=16m --cap-drop ALL --security-opt no-new-privileges -e "AOT_CONFIG_CONTENT=$(cat infra/04.deploy/03.product/image/core-server-persistence-observability-collector/collector-qualification-config.yml)" "$COLLECTOR_SOURCE_IMAGE" >/dev/null
          trap 'docker logs "$name" || true; docker rm -f "$name" >/dev/null 2>&1 || true' EXIT
          sleep 5
          test "$(docker inspect --format '{{.State.Running}}' "$name")" = true
          ! docker logs "$name" 2>&1 | grep -Ei 'error.*(config|awsemf)|failed.*(config|awsemf)'
          docker rm -f "$name" >/dev/null
          trap - EXIT
          echo "source_digest=sha256:7968fb60db6a2390a47ba6a2df029745638486e285c9b2487da1b722d0855a3e" >> "$GITHUB_OUTPUT"
      - name: Mirror immutable collector image
        id: image
        run: |
          set -euo pipefail
          tag="observability-collector-${GITHUB_SHA::12}-run${GITHUB_RUN_ID}"
          docker tag "$COLLECTOR_SOURCE_IMAGE" "$ECR_URI:$tag"
          docker push "$ECR_URI:$tag"
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull "$ECR_URI@$digest" >/dev/null
          docker save "$ECR_URI@$digest" -o "$RUNNER_TEMP/observability-collector.scan-input.tar"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Export exact private image for unprivileged scan
        uses: actions/upload-artifact@v4
        with:
          name: kanbien-core-platform-observability-collector-scan-input-${{ github.run_id }}
          path: ${{ runner.temp }}/observability-collector.scan-input.tar
          if-no-files-found: error
          retention-days: 1
  scan-mirrored-payload:
    needs: qualify-and-publish
    permissions: { contents: read }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Retrieve exact private image scan input
        uses: actions/download-artifact@v4
        with:
          name: kanbien-core-platform-observability-collector-scan-input-${{ github.run_id }}
          path: scan-input
      - name: Require clean portable vulnerability scan of mirrored payload
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          input: scan-input/observability-collector.scan-input.tar
          severity: HIGH,CRITICAL
          ignore-unfixed: 'false'
          exit-code: '1'
          format: json
          output: observability-collector.trivy.json
      - name: Retain vulnerability scan artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanbien-core-platform-observability-collector-vulnerability-scan-${{ github.run_id }}
          path: observability-collector.trivy.json
          if-no-files-found: error
          retention-days: 30
  complete-custody:
    needs: [qualify-and-publish, scan-mirrored-payload]
    permissions: { contents: read, id-token: write, attestations: write, artifact-metadata: write }
    env:
      AWS_REGION: eu-west-1
      AWS_ROLE_ARN: arn:aws:iam::337159794548:role/github-kanbien-core-platform-delivery
      ECR_REPOSITORY: kanbien-core-platform/core-server
      ECR_URI: 337159794548.dkr.ecr.eu-west-1.amazonaws.com/kanbien-core-platform/core-server
      IMAGE_DIGEST: ${{ needs.qualify-and-publish.outputs.image_digest }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: kanbien-core-platform
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ env.AWS_ROLE_ARN }}', aws-region: '${{ env.AWS_REGION }}' }
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.ECR_URI }}@${{ env.IMAGE_DIGEST }}
          format: spdx-json
          output-file: ${{ runner.temp }}/observability-collector.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest collector provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.ECR_URI }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest collector SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.ECR_URI }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          sbom-path: ${{ runner.temp }}/observability-collector.sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Write and validate safe collector custody receipt
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/observability-collector-package-custody-receipt.json"
          export RECEIPT_CHECKED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 - "$receipt" <<'PY'
          import json, os, sys
          json.dump({
            'schema': 'deploy/package-custody-receipt/v1', 'target': 'kanbien-core-platform',
            'environment_class': 'private-persistence-candidate', 'provider_region_alias': 'aws-eu-west-1',
            'candidate_id': 'observability-collector', 'package_contract_id': 'core-server-persistence-observability-collector-image',
            'program_id': 'aws-otel-collector', 'source_revision': os.environ['GITHUB_SHA'],
            'image_digest': os.environ['IMAGE_DIGEST'], 'release_identity': 'source-' + os.environ['GITHUB_SHA'],
            'checked_at': os.environ['RECEIPT_CHECKED_AT'],
            'checks': {'runnable_program_contract':'passed','dependency_boundary':'passed','delivery_access_static':'passed','delivery_access_live':'passed','local_image_smoke':'passed','vulnerability_scan':'passed','sbom':'passed','provenance_attestation':'passed'},
            'verdict': 'qualified', 'receipt_reference': 'github-actions-run:' + os.environ['GITHUB_RUN_ID']
          }, open(sys.argv[1], 'w', encoding='utf-8'), sort_keys=True)
          PY
          bash scripts/04.deploy/lifecycle/40-package/package-custody-receipt/script.sh --receipt "$receipt" --expected-target kanbien-core-platform --expected-candidate observability-collector --expected-package-contract core-server-persistence-observability-collector-image --expected-program aws-otel-collector --json
      - name: Upload safe collector custody evidence
        uses: actions/upload-artifact@v4
        with:
          name: kanbien-core-platform-observability-collector-package-custody-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/observability-collector-package-custody-receipt.json
            ${{ runner.temp }}/observability-collector.sbom.spdx.json
          if-no-files-found: error
          retention-days: 30
