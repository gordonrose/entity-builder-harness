name: Publish Kanbien Core Platform Core Server

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: kanbien-core-platform-core-server-publication
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::337159794548:role/github-kanbien-core-platform-delivery
  ECR_REPOSITORY: kanbien-core-platform/core-server
  ECR_URI: 337159794548.dkr.ecr.eu-west-1.amazonaws.com/kanbien-core-platform/core-server

jobs:
  publish-core-server:
    name: Qualify and publish immutable core server image
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: kanbien-core-platform

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce protected main source
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo 'Publication blocked: expected refs/heads/main.' >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Install script dependencies
        run: python3 -m pip install PyYAML==6.0.2
      - name: Enforce delivery-chain registration and contracts
        run: python3 scripts/04.deploy/inventory-deploy-control/script.py --delivery --check

      - name: Qualify the declared core-server candidate
        id: qualification
        run: |
          bash scripts/04.deploy/lifecycle/20-build/runnable-program-contract/script.sh --contract infra/04.deploy/03.product/entrypoints/runnable-program-index.yml --json
          bash scripts/04.deploy/lifecycle/20-build/core-server-dependency-boundary/script.sh --json
          bash scripts/04.deploy/lifecycle/40-package/targets/kanbien-core-platform/core-server-package-custody/script.sh --json
          bash scripts/04.deploy/lifecycle/40-package/targets/kanbien-core-platform/core-server-package-custody/validate-delivery-access/script.sh --json
          bash scripts/04.deploy/lifecycle/50-deploy/targets/kanbien-core-platform/bootstrap-runtime/release-contract/script.sh --json
          bash scripts/04.deploy/lifecycle/40-package/smoke-test-core-server-image/script.sh --tag kanbien-core-server:publication

          python3 scripts/04.deploy/lifecycle/40-package/package-custody-receipt/qualification.py record --image kanbien-core-server:publication --receipt "$RUNNER_TEMP/qualified-image.json" --input infra/04.deploy/03.product/image/core-server/image-contract.yml --input scripts/04.deploy/lifecycle/40-package/smoke-test-core-server-image/script.sh --configuration-input scripts/04.deploy/lifecycle/00-target-alignment/provider-adapters/aws/ecs-runtime-configuration.py infra/04.deploy/03.product/targets/kanbien-core-platform/30-provider-realization/aws/cloudformation/bootstrap-runtime.yml '*'

      - name: Configure target-scoped AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prove fixed delivery read access
        id: access
        run: bash scripts/04.deploy/lifecycle/00-target-alignment/targets/kanbien-core-platform/verify-delivery-role-access/script.sh

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish immutable image
        id: image
        run: |
          set -euo pipefail
          tag="core-${GITHUB_SHA::12}-run${GITHUB_RUN_ID}"
          qualified_image="$(python3 scripts/04.deploy/lifecycle/40-package/package-custody-receipt/qualification.py verify --image kanbien-core-server:publication --receipt "$RUNNER_TEMP/qualified-image.json" --configuration-input scripts/04.deploy/lifecycle/00-target-alignment/provider-adapters/aws/ecs-runtime-configuration.py infra/04.deploy/03.product/targets/kanbien-core-platform/30-provider-realization/aws/cloudformation/bootstrap-runtime.yml '*')"
          docker tag "$qualified_image" "$ECR_URI:$tag"
          docker push "$ECR_URI:$tag"
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$ECR_URI@$digest"
          docker pull "$image" >/dev/null
          test "$(docker image inspect "$image" --format '{{.Id}}')" = "$qualified_image"
          revision="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$revision" = "$GITHUB_SHA"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Require clean ECR scan
        id: scan
        run: python3 scripts/04.deploy/shared/provider-adapters/aws/ecr-scan.py --repository "$ECR_REPOSITORY" --image-digest "${{ steps.image.outputs.digest }}" --report "$RUNNER_TEMP/ecr-scan.json"
      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.ECR_URI }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/core-server.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest image provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.ECR_URI }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest image SBOM
        id: sbom-attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.ECR_URI }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/core-server.sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Write and validate safe package-custody receipt
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
          ACCESS_OUTCOME: ${{ steps.access.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.image.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          SBOM_ATTESTATION_OUTCOME: ${{ steps.sbom-attestation.outcome }}
        run: |
          python3 scripts/04.deploy/lifecycle/40-package/package-custody-receipt/capture.py --target kanbien-core-platform --environment-class private-bootstrap --provider-region-alias aws-eu-west-1 --candidate kanbien-core-server-candidate --package-contract kanbien-core-server-image --program kanbien-core-server --scan-check ecr_scan --sbom "$RUNNER_TEMP/core-server.sbom.spdx.json" --output "$RUNNER_TEMP/package-custody-receipt.json"
          bash scripts/04.deploy/lifecycle/40-package/package-custody-receipt/script.sh --receipt "$RUNNER_TEMP/package-custody-receipt.json" --expected-target kanbien-core-platform --expected-candidate kanbien-core-server-candidate --expected-package-contract kanbien-core-server-image --expected-program kanbien-core-server --json
      - name: Upload safe package-custody evidence
        uses: actions/upload-artifact@v4
        with:
          name: kanbien-core-platform-package-custody-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/package-custody-receipt.json
            ${{ runner.temp }}/core-server.sbom.spdx.json
            ${{ runner.temp }}/qualified-image.json
            ${{ runner.temp }}/ecr-scan.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30

      - name: Record package-custody summary
        run: |
          {
            echo '## Kanbien core platform package custody'
            echo "- Source revision: $GITHUB_SHA"
            echo "- Immutable image digest: ${{ steps.image.outputs.digest }}"
            echo "- ECR scan: ${{ steps.scan.outputs.verdict }}"
            echo "- Receipt: github-actions-run:$GITHUB_RUN_ID"
            echo '- Deployment: not performed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
