# Retirement tombstone: preserve the workflow identity and history, with no
# deployment steps, AWS credentials, environment, or token permissions.
name: Retired RAG Rulebook Staging

on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    name: Hosted RAG is retired; use local retrieval
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hosted RAG is retired. Use RAG_RULEBOOK_PROVIDER=local."
