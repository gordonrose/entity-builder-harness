name: Run Platform Shell Staging Synthetic

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: platform-shell-staging-synthetic
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::337159794548:role/github-platform-shell-staging-synthetic

jobs:
  run-synthetic:
    name: Run protected staging synthetic
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce remote-main source
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Synthetic blocked: expected refs/heads/main, got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Validate fixed synthetic policy locally
        run: npm run platform:shell:controlled-smoke -- --validate

      - name: Configure read-only AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run protected staging synthetic
        run: npm run platform:shell:controlled-smoke -- --aws-credential-source environment

      - name: Wait for first cumulative counter export
        run: sleep 75 # Exceed the reviewed 60-second export interval before issuing the fixed counter-advancing request.

      - name: Run protected staging synthetic counter advance
        run: npm run platform:shell:controlled-smoke -- --aws-credential-source environment # Reuse the fixed policy command; no free-form request input is accepted.
