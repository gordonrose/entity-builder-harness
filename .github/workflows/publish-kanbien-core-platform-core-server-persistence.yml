name: Publish Kanbien Core Platform Core Server Persistence
on: { workflow_dispatch: {} }
permissions: { contents: read, id-token: write, attestations: write, artifact-metadata: write }
concurrency: { group: kanbien-core-platform-core-server-persistence-publication, cancel-in-progress: false }
env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::337159794548:role/github-kanbien-core-platform-delivery
  ECR_REPOSITORY: kanbien-core-platform/core-server
  ECR_URI: 337159794548.dkr.ecr.eu-west-1.amazonaws.com/kanbien-core-platform/core-server
jobs:
  qualify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: kanbien-core-platform
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: Enforce protected main source
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install script dependencies
        run: python3 -m pip install PyYAML==6.0.2
      - name: Enforce delivery-chain registration and contracts
        run: python3 scripts/04.deploy/inventory-deploy-control/script.py --delivery --check

      - name: Qualify declarations and actual candidate payload
        id: qualification
        run: |
          bash scripts/04.deploy/lifecycle/40-package/targets/kanbien-core-platform/core-server-persistence-package-custody/script.sh --json
          bash scripts/04.deploy/lifecycle/40-package/targets/kanbien-core-platform/core-server-persistence-package-custody/validate-delivery-access/script.sh --json
          bash scripts/04.deploy/lifecycle/40-package/build-core-server-persistence-image/script.sh --tag kanbien-core-server-persistence:qualification
          bash scripts/04.deploy/lifecycle/40-package/smoke-test-core-server-persistence-image/script.sh --tag kanbien-core-server-persistence:qualification --port 39455
          python3 scripts/04.deploy/lifecycle/40-package/smoke-test-core-server-persistence-image/capability-negative-test.py --image kanbien-core-server-persistence:qualification
          python3 scripts/04.deploy/lifecycle/40-package/package-custody-receipt/qualification.py record --image kanbien-core-server-persistence:qualification --receipt "$RUNNER_TEMP/qualified-image.json" --input infra/04.deploy/03.product/image/core-server-persistence/image-contract.yml --input scripts/04.deploy/lifecycle/40-package/smoke-test-core-server-persistence-image/script.sh --input scripts/04.deploy/lifecycle/40-package/smoke-test-core-server-persistence-image/capability-negative-test.py --configuration-input scripts/04.deploy/lifecycle/00-target-alignment/provider-adapters/aws/ecs-runtime-configuration.py infra/04.deploy/03.product/targets/kanbien-core-platform/30-provider-realization/aws/cloudformation/core-server-persistence.yml core-server-persistence,persistence-migration,persistence-administration,private-persistence-verifier,persistence-restoration-verifier

      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ env.AWS_ROLE_ARN }}', aws-region: '${{ env.AWS_REGION }}' }
      - name: Prove fixed delivery read access
        id: access
        run: bash scripts/04.deploy/lifecycle/00-target-alignment/targets/kanbien-core-platform/verify-delivery-role-access/script.sh
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Publish immutable image
        id: image
        run: |
          set -euo pipefail
          tag="persistence-${GITHUB_SHA::12}-run${GITHUB_RUN_ID}"
          qualified_image="$(python3 scripts/04.deploy/lifecycle/40-package/package-custody-receipt/qualification.py verify --image kanbien-core-server-persistence:qualification --receipt "$RUNNER_TEMP/qualified-image.json" --configuration-input scripts/04.deploy/lifecycle/00-target-alignment/provider-adapters/aws/ecs-runtime-configuration.py infra/04.deploy/03.product/targets/kanbien-core-platform/30-provider-realization/aws/cloudformation/core-server-persistence.yml core-server-persistence,persistence-migration,persistence-administration,private-persistence-verifier,persistence-restoration-verifier)"
          docker tag "$qualified_image" "$ECR_URI:$tag"
          docker push "$ECR_URI:$tag"
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$tag" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="$ECR_URI@$digest"
          docker pull "$image" >/dev/null
          test "$(docker image inspect "$image" --format '{{.Id}}')" = "$qualified_image"
          revision="$(docker image inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          test "$revision" = "$GITHUB_SHA"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Require clean ECR scan
        id: scan
        run: python3 scripts/04.deploy/shared/provider-adapters/aws/ecr-scan.py --repository "$ECR_REPOSITORY" --image-digest "${{ steps.image.outputs.digest }}" --report "$RUNNER_TEMP/ecr-scan.json"
      - name: Generate SBOM
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.ECR_URI }}@${{ steps.image.outputs.digest }}
          format: spdx-json
          output-file: ${{ runner.temp }}/core-server-persistence.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest image provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.ECR_URI }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest image SBOM
        id: sbom-attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.ECR_URI }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/core-server-persistence.sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - name: Write and validate safe package-custody receipt
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
          ACCESS_OUTCOME: ${{ steps.access.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.image.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          SBOM_ATTESTATION_OUTCOME: ${{ steps.sbom-attestation.outcome }}
        run: |
          python3 scripts/04.deploy/lifecycle/40-package/package-custody-receipt/capture.py --target kanbien-core-platform --environment-class private-persistence-candidate --provider-region-alias aws-eu-west-1 --candidate kanbien-core-server-persistence-candidate --package-contract kanbien-core-server-persistence-image --program kanbien-core-server-persistence --scan-check ecr_scan --sbom "$RUNNER_TEMP/core-server-persistence.sbom.spdx.json" --output "$RUNNER_TEMP/package-custody-receipt.json"
          bash scripts/04.deploy/lifecycle/40-package/package-custody-receipt/script.sh --receipt "$RUNNER_TEMP/package-custody-receipt.json" --expected-target kanbien-core-platform --expected-candidate kanbien-core-server-persistence-candidate --expected-package-contract kanbien-core-server-persistence-image --expected-program kanbien-core-server-persistence --json
      - name: Upload safe package-custody evidence
        uses: actions/upload-artifact@v4
        with:
          name: kanbien-core-platform-persistence-package-custody-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/package-custody-receipt.json
            ${{ runner.temp }}/core-server-persistence.sbom.spdx.json
            ${{ runner.temp }}/qualified-image.json
            ${{ runner.temp }}/ecr-scan.json
          if-no-files-found: error
          overwrite: false
          retention-days: 30
      - name: Record package-custody summary
        run: |
          {
            echo '## Kanbien core platform persistence package custody'
            echo "- Source revision: $GITHUB_SHA"
            echo "- Immutable image digest: ${{ steps.image.outputs.digest }}"
            echo "- Scanned AMD64 manifest: ${{ steps.scan.outputs.scan_digest }}"
            echo "- ECR scan: ${{ steps.scan.outputs.verdict }}"
            echo "- Receipt: github-actions-run:$GITHUB_RUN_ID"
            echo '- Deployment: not performed by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
