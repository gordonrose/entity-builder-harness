#   schema: agentic-artifact/v2
#   id: github.workflow.deploy-platform-shell-staging
#   version: 2
#   status: active
#   layer: 04.deploy
#   domain: infra.ci-cd
#   disciplines:
#   - agentic
#   - sre
#   kind: ci-workflow
#   purpose: Build, scan, attest, and publish the Kanbien staging platform shell image without mutating ECS or CloudFormation.
#   portability:
#     class: internal
#     targets: []
#   effects:
#   - network
#   used_by:
#   - id: infra.04-deploy.03-product.targets.kanbien.staging.target-profile
#     path: infra/04.deploy/03.product/targets/kanbien/staging/target-profile.yml
#   - id: infra.04-deploy.03-product.targets.kanbien.staging.deploy-readiness
#     path: infra/04.deploy/03.product/targets/kanbien/staging/deploy-readiness.yml

name: Publish Platform Shell Staging Image

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: Push the checked, scanned, and attested image to the staging ECR repository; this workflow never deploys it.
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: platform-shell-staging
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::337159794548:role/github-platform-shell-staging-deploy
  ECR_REPOSITORY: platform-shell
  ECR_URI: 337159794548.dkr.ecr.eu-west-1.amazonaws.com/platform-shell
  READINESS_MANIFEST: infra/04.deploy/03.product/targets/kanbien/staging/deploy-readiness.yml

jobs:
  build-image:
    name: Build staging image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Enforce remote-main deploy source
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Deploy blocked: expected refs/heads/main, got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.23.3"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.4"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          version: v0.37.2
          driver: docker-container
          driver-opts: image=moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Install script dependencies
        run: python -m pip install --require-hashes -r scripts/04.deploy/operational-realization-gate/requirements.lock

      - name: Run platform shell checks
        run: |
          npm run platform:server:check
          npm run platform:server:image-runtime-check
          npm run product:kanbien-platform:check
          npm run platform:shell:infrastructure:check
          npm run platform:shell:deployment-workflow:check
          bash scripts/04.deploy/validate-container-boundaries/script.sh

      - name: Verify blocked deploy-readiness manifest
        run: |
          bash scripts/04.deploy/verify-platform-shell-deploy-readiness/script.sh \
            --manifest "$READINESS_MANIFEST" \
            --allow-blocked \
            --caller-intent planning \
            --json

      - name: Configure AWS credentials
        if: ${{ inputs.publish_image }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: ${{ inputs.publish_image }}
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Acquire reviewed qualification inputs
        id: base-image
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/qualified-image"
          bash scripts/04.deploy/operational-realization-gate/verify-local-build.sh \
            --source-root . --acquire-cache "$RUNNER_TEMP/qualified-packages"
          bash scripts/04.deploy/build-platform-shell-image/script.sh --qualify-local \
            --source-root . --scratch-root "$RUNNER_TEMP/qualified-image" --acquire-base
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          gate = Path('scripts/04.deploy/operational-realization-gate')
          runtime = json.loads((gate / 'container-image.lock.json').read_text())
          toolchain = (gate / 'node-toolchain.lock.json').read_bytes()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('runtime_digest=' + runtime['runtime_image'].split('@')[1] + '\n')
              stream.write('toolchain_digest=sha256:' + hashlib.sha256(toolchain).hexdigest() + '\n')
          PYTHON

      - name: Select immutable staging image tag
        id: image-tag
        run: |
          short_sha="${GITHUB_SHA::12}"
          image_tag="staging-$(date -u +%Y%m%d)-${short_sha}-run${GITHUB_RUN_ID}"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "uri=$ECR_URI:$image_tag" >> "$GITHUB_OUTPUT"

      - name: Check for existing staging image
        if: ${{ inputs.publish_image }}
        id: existing-image
        run: |
          set +e
          digest="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="${{ steps.image-tag.outputs.tag }}" \
              --query "imageDetails[0].imageDigest" \
              --output text 2>/dev/null
          )"
          status=$?
          set -e
          if [ "$status" -eq 0 ] && [ "$digest" != "None" ] && [ -n "$digest" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build platform shell image
        id: qualified-image
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          git ls-files --others --exclude-standard -z | python3 -c 'import sys; raise SystemExit(bool(sys.stdin.buffer.read(1)))'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/04.deploy/smoke-test-platform-shell-image/script.sh --qualify-local \
            --source-root . --scratch-root "$RUNNER_TEMP/qualified-image" \
            --package-cache "$RUNNER_TEMP/qualified-packages" \
            --publication-directory "$RUNNER_TEMP/qualified-image/handoff" \
            > "$RUNNER_TEMP/qualified-image/result.json"
          python3 -I -B scripts/04.deploy/operational-realization-gate/qualified_publication.py \
            --source-root . --scratch-root "$RUNNER_TEMP/qualified-image" \
            --publication-directory "$RUNNER_TEMP/qualified-image/handoff" \
            > "$RUNNER_TEMP/qualified-image/checked.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          value = json.loads((Path(os.environ['RUNNER_TEMP']) / 'qualified-image/checked.json').read_text())
          if value['source_commit'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Qualified source does not match this workflow commit')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('image_id=' + value['artifact']['daemon_image_id'] + '\n')
              stream.write('manifest_digest=' + value['artifact']['manifest_digest'] + '\n')
              stream.write('configuration_digest=' + value['artifact']['configuration_digest'] + '\n')
          PYTHON
          git diff --quiet
          git diff --cached --quiet
          git ls-files --others --exclude-standard -z | python3 -c 'import sys; raise SystemExit(bool(sys.stdin.buffer.read(1)))'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Retain normalized qualification receipts
        id: qualification-receipts
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualified-image/handoff/container-result.json
            ${{ runner.temp }}/qualified-image/handoff/handoff.json
          retention-days: 7
          include-hidden-files: false
          overwrite: false
          if-no-files-found: error

      - name: Push platform shell image
        if: ${{ inputs.publish_image }}
        run: |
          set -euo pipefail
          git diff --quiet
          git diff --cached --quiet
          git ls-files --others --exclude-standard -z | python3 -c 'import sys; raise SystemExit(bool(sys.stdin.buffer.read(1)))'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -I -B scripts/04.deploy/operational-realization-gate/qualified_publication.py \
            --source-root . --scratch-root "$RUNNER_TEMP/qualified-image" \
            --publication-directory "$RUNNER_TEMP/qualified-image/handoff" \
            > "$RUNNER_TEMP/qualified-image/ready-to-publish.json"
          if [ "${{ steps.existing-image.outputs.exists }}" = "true" ]; then
            if [ "${{ steps.existing-image.outputs.digest }}" != "${{ steps.qualified-image.outputs.manifest_digest }}" ]; then
              echo "Existing immutable tag identifies a different image; publication refused." >&2
              exit 1
            fi
          else
            docker tag "${{ steps.qualified-image.outputs.image_id }}" "${{ steps.image-tag.outputs.uri }}"
            actual_id="$(docker image inspect "${{ steps.image-tag.outputs.uri }}" --format '{{.Id}}')"
            if [ "$actual_id" != "${{ steps.qualified-image.outputs.image_id }}" ]; then
              echo "Publication tag does not identify the qualified image." >&2
              exit 1
            fi
            docker push "${{ steps.image-tag.outputs.uri }}"
          fi

      - name: Resolve immutable image digest
        if: ${{ inputs.publish_image }}
        id: image
        run: |
          digest="${{ steps.existing-image.outputs.digest }}"
          if [ -z "$digest" ]; then
            digest="$(
              aws ecr describe-images \
                --repository-name "$ECR_REPOSITORY" \
                --image-ids imageTag="${{ steps.image-tag.outputs.tag }}" \
                --query "imageDetails[0].imageDigest" \
                --output text
            )"
          fi

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Resolved image digest has invalid shape: $digest" >&2
            exit 1
          fi

          if [ "$digest" != "${{ steps.qualified-image.outputs.manifest_digest }}" ]; then
            echo "Published manifest differs from the qualified manifest." >&2
            exit 1
          fi
          aws ecr batch-get-image --repository-name "$ECR_REPOSITORY" \
            --image-ids imageDigest="$digest" \
            --accepted-media-types application/vnd.oci.image.manifest.v1+json application/vnd.docker.distribution.manifest.v2+json \
            --output json > "$RUNNER_TEMP/qualified-image/published-image.json"
          python3 -I -B scripts/04.deploy/operational-realization-gate/qualified_publication.py \
            --source-root . --scratch-root "$RUNNER_TEMP/qualified-image" \
            --publication-directory "$RUNNER_TEMP/qualified-image/handoff" \
            --published-image "$RUNNER_TEMP/qualified-image/published-image.json" \
            > "$RUNNER_TEMP/qualified-image/publication-check.json"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "uri=$ECR_URI@$digest" >> "$GITHUB_OUTPUT"

      - name: Retain normalized publication receipt
        id: publication-receipt
        if: ${{ inputs.publish_image && steps.image.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: published-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualified-image/publication-check.json
          retention-days: 7
          include-hidden-files: false
          overwrite: false
          if-no-files-found: error

      - name: Verify published target-platform image
        if: ${{ inputs.publish_image }}
        run: |
          set -euo pipefail
          expected_platform="linux/amd64"
          docker pull --platform "$expected_platform" "${{ steps.image.outputs.uri }}" >/dev/null
          actual_platform="$(docker image inspect "${{ steps.image.outputs.uri }}" --format '{{.Os}}/{{.Architecture}}')"
          source_revision="$(docker image inspect "${{ steps.image.outputs.uri }}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "$actual_platform" != "$expected_platform" ]; then
            echo "Published image does not match the reviewed runtime platform." >&2
            exit 1
          fi
          if [ "$source_revision" != "$GITHUB_SHA" ]; then
            echo "Published image source revision does not match the checked-out commit." >&2
            exit 1
          fi

      - name: Read ECR scan finding counts
        if: ${{ inputs.publish_image }}
        id: scan
        run: |
          set -euo pipefail

          # ECR creates the scan record asynchronously after an image push.
          # The AWS waiter exits immediately if that record is not present yet,
          # so first poll specifically for record creation, then use the waiter
          # for the actual scan-completion state.
          for attempt in $(seq 1 30); do
            set +e
            aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageDigest="${{ steps.image.outputs.digest }}" \
              --max-results 1 >/dev/null 2>"$RUNNER_TEMP/ecr-scan-record.err"
            describe_status=$?
            set -e

            if [ "$describe_status" -eq 0 ]; then
              break
            fi
            if ! grep -q "ScanNotFoundException" "$RUNNER_TEMP/ecr-scan-record.err"; then
              cat "$RUNNER_TEMP/ecr-scan-record.err" >&2
              exit "$describe_status"
            fi
            if [ "$attempt" = "30" ]; then
              echo "ECR did not create an image scan record within five minutes." >&2
              exit 1
            fi
            sleep 10
          done

          if ! aws ecr wait image-scan-complete \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageDigest="${{ steps.image.outputs.digest }}"; then
            echo "Image scan did not complete for the immutable image digest." >&2
            exit 1
          fi

          scan_status="$(
            aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageDigest="${{ steps.image.outputs.digest }}" \
              --query "imageScanStatus.status" \
              --output text
          )"
          critical="$(
            aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageDigest="${{ steps.image.outputs.digest }}" \
              --query "imageScanFindings.findingSeverityCounts.CRITICAL || \`0\`" \
              --output text
          )"
          high="$(
            aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageDigest="${{ steps.image.outputs.digest }}" \
              --query "imageScanFindings.findingSeverityCounts.HIGH || \`0\`" \
              --output text
          )"

          critical="${critical:-0}"
          high="${high:-0}"
          echo "status=$scan_status" >> "$GITHUB_OUTPUT"
          echo "critical=$critical" >> "$GITHUB_OUTPUT"
          echo "high=$high" >> "$GITHUB_OUTPUT"

          if [ "$scan_status" != "COMPLETE" ]; then
            echo "Image scan did not report COMPLETE: $scan_status" >&2
            exit 1
          fi
          if [ "$critical" != "0" ]; then
            echo "Image scan found CRITICAL vulnerabilities: $critical" >&2
            exit 1
          fi
          if [ "$high" != "0" ]; then
            echo "Image scan found HIGH vulnerabilities: $high. Fix them before deployment; this initial public target has no risk-acceptance mechanism." >&2
            exit 1
          fi

      - name: Generate image SBOM
        if: ${{ inputs.publish_image }}
        id: sbom
        env:
          SYFT_IMAGE: ${{ steps.image.outputs.uri }}
          SYFT_CHECK_FOR_APP_UPDATE: "false"
        run: |
          set -euo pipefail
          [[ "$SYFT_IMAGE" =~ ^[a-z0-9][a-z0-9./:-]*@sha256:[a-f0-9]{64}$ ]]
          umask 077
          tool_dir="$(mktemp -d "$RUNNER_TEMP/reviewed-syft.XXXXXX")"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            https://github.com/anchore/syft/releases/download/v1.42.3/syft_1.42.3_linux_amd64.tar.gz \
            --output "$tool_dir/archive.tar.gz"
          printf '%s  %s\n' 0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509 "$tool_dir/archive.tar.gz" | sha256sum --check --status
          tar --extract --gzip --file "$tool_dir/archive.tar.gz" --directory "$tool_dir" --no-same-owner --no-same-permissions syft
          test -f "$tool_dir/syft" && test ! -L "$tool_dir/syft"
          printf '%s  %s\n' 6c1eb5c6f15c177fa3dd727ee186c61a660a3939a4e1dc1bc4b3e00eafec098e "$tool_dir/syft" | sha256sum --check --status
          chmod 700 "$tool_dir/syft"
          test "$("$tool_dir/syft" version --output json | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')" = "1.42.3"
          "$tool_dir/syft" scan "docker:$SYFT_IMAGE" --output "spdx-json=$RUNNER_TEMP/platform-shell.sbom.spdx.json"

      - name: Attest image provenance
        if: ${{ inputs.publish_image }}
        id: provenance-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.ECR_URI }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest image SBOM
        if: ${{ inputs.publish_image }}
        id: sbom-attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.ECR_URI }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/platform-shell.sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Record image-publication summary
        run: |
          {
            echo "## Platform Shell staging image"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow run: ${GITHUB_RUN_ID}"
            echo "- Locked compiler contract: ${{ steps.base-image.outputs.toolchain_digest }}"
            echo "- Runtime digest: ${{ steps.base-image.outputs.runtime_digest }}"
            echo "- Image tag: ${{ steps.image-tag.outputs.tag }}"
            echo "- Qualification receipts: ${{ steps.qualification-receipts.outputs.artifact-url }} (7 days)"
            if [ "${{ inputs.publish_image }}" = "true" ]; then
              echo "- Image digest: ${{ steps.image.outputs.digest }}"
              echo "- Publication receipt: ${{ steps.publication-receipt.outputs.artifact-url }} (7 days)"
              echo "- Deploy image URI: ${{ steps.image.outputs.uri }}"
              echo "- ECR scan status: ${{ steps.scan.outputs.status }}"
              echo "- ECR scan CRITICAL: ${{ steps.scan.outputs.critical }}"
              echo "- ECR scan HIGH: ${{ steps.scan.outputs.high }}"
              echo "- SBOM: attested from SPDX JSON before deployment"
              echo "- Provenance attestation: ${{ steps.provenance-attestation.outputs.attestation-url }}"
              echo "- SBOM attestation: ${{ steps.sbom-attestation.outputs.attestation-url }}"
            else
              echo "- Image publish: skipped by workflow input"
            fi
            echo "- Service deployment: not performed by this workflow"
            echo ""
            echo "- Next action: create and review target CloudFormation change sets using the immutable image URI above."
            echo "- Public health, authentication, rate-limit, WAF, alarm-delivery, and rollback proof remain separate governed deployment evidence."
          } >> "$GITHUB_STEP_SUMMARY"
