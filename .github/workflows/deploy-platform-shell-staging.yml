#   version: 2
#   status: active
#   layer: 04.deploy
#   domain: infra.ci-cd
#   disciplines:
#   - agentic
#   - sre
#   kind: ci-workflow
#   purpose: Build, scan, attest, and publish the Kanbien staging platform shell image without mutating ECS or CloudFormation.
#   portability:
#     class: internal
#     targets: []
#   effects:
#   - network
#   used_by:
#   - id: infra.04-deploy.03-product.targets.kanbien.staging.target-profile
#     path: infra/04.deploy/03.product/targets/kanbien/staging/target-profile.yml
#   - id: infra.04-deploy.03-product.targets.kanbien.staging.deploy-readiness
#     path: infra/04.deploy/03.product/targets/kanbien/staging/deploy-readiness.yml

name: Publish Platform Shell Staging Image

on:
  workflow_dispatch:
    inputs:
      base_image_ref:
        description: Build-stage Node image tag or digest to resolve and pin for this staging build.
        required: true
        default: node:22-bookworm-slim
      runtime_image_ref:
        description: Final minimal Node runtime image tag or digest to resolve and pin for this staging build.
        required: true
        default: gcr.io/distroless/nodejs22-debian12:nonroot
      publish_image:
        description: Push the checked, scanned, and attested image to the staging ECR repository; this workflow never deploys it.
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: platform-shell-staging
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::337159794548:role/github-platform-shell-staging-deploy
  ECR_REPOSITORY: platform-shell
  ECR_URI: 337159794548.dkr.ecr.eu-west-1.amazonaws.com/platform-shell
  READINESS_MANIFEST: infra/04.deploy/03.product/targets/kanbien/staging/deploy-readiness.yml

jobs:
  build-image:
    name: Build staging image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce remote-main deploy source
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Deploy blocked: expected refs/heads/main, got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Install script dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Run platform shell checks
        run: |
          npm run platform:server:check
          npm run platform:server:image-runtime-check
          npm run product:kanbien-platform:check
          npm run platform:shell:infrastructure:check
          npm run platform:shell:deployment-workflow:check
          bash scripts/04.deploy/validate-container-boundaries/script.sh

      - name: Verify blocked deploy-readiness manifest
        run: |
          bash scripts/04.deploy/verify-platform-shell-deploy-readiness/script.sh \
            --manifest "$READINESS_MANIFEST" \
            --allow-blocked \
            --caller-intent planning \
            --json

      - name: Configure AWS credentials
        if: ${{ inputs.publish_image }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        if: ${{ inputs.publish_image }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve digest-pinned build and runtime images
        id: base-image
        run: |
          set -euo pipefail

          resolve_image() {
            local reference="$1"
            local kind="$2"
            local repository
            local digest
            local image

            if [[ "$reference" == *@sha256:* ]]; then
              repository="${reference%@sha256:*}"
              digest="sha256:${reference##*@sha256:}"
              image="$reference"
            else
              repository="${reference%:*}"
              if [ "$repository" = "$reference" ]; then
                echo "$kind image must include a tag or digest: $reference" >&2
                exit 1
              fi
              digest="$(docker buildx imagetools inspect "$reference" --format '{{.Manifest.Digest}}')"
              image="${repository}@${digest}"
            fi

            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Resolved $kind image digest has invalid shape: $digest" >&2
              exit 1
            fi

            printf '%s\t%s\t%s\n' "$repository" "$digest" "$image"
          }

          IFS=$'\t' read -r build_repository build_digest build_image < <(
            resolve_image "${{ inputs.base_image_ref }}" "build"
          )
          IFS=$'\t' read -r runtime_repository runtime_digest runtime_image < <(
            resolve_image "${{ inputs.runtime_image_ref }}" "runtime"
          )

          echo "build_repository=$build_repository" >> "$GITHUB_OUTPUT"
          echo "build_digest=$build_digest" >> "$GITHUB_OUTPUT"
          echo "build_image=$build_image" >> "$GITHUB_OUTPUT"
          echo "runtime_repository=$runtime_repository" >> "$GITHUB_OUTPUT"
          echo "runtime_digest=$runtime_digest" >> "$GITHUB_OUTPUT"
          echo "runtime_image=$runtime_image" >> "$GITHUB_OUTPUT"

      - name: Select immutable staging image tag
        id: image-tag
        run: |
          short_sha="${GITHUB_SHA::12}"
          image_tag="staging-$(date -u +%Y%m%d)-${short_sha}-run${GITHUB_RUN_ID}"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "uri=$ECR_URI:$image_tag" >> "$GITHUB_OUTPUT"

      - name: Check for existing staging image
        if: ${{ inputs.publish_image }}
        id: existing-image
        run: |
          set +e
          digest="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="${{ steps.image-tag.outputs.tag }}" \
              --query "imageDetails[0].imageDigest" \
              --output text 2>/dev/null
          )"
          status=$?
          set -e
          if [ "$status" -eq 0 ] && [ "$digest" != "None" ] && [ -n "$digest" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build platform shell image
        if: ${{ !inputs.publish_image || steps.existing-image.outputs.exists != 'true' }}
        run: |
          bash scripts/04.deploy/build-platform-shell-image/script.sh \
            --tag "${{ steps.image-tag.outputs.uri }}" \
            --base-image "${{ steps.base-image.outputs.build_image }}" \
            --runtime-image "${{ steps.base-image.outputs.runtime_image }}" \
            --require-digest-base

      - name: Push platform shell image
        if: ${{ inputs.publish_image && steps.existing-image.outputs.exists != 'true' }}
        run: docker push "${{ steps.image-tag.outputs.uri }}"

      - name: Resolve immutable image digest
        if: ${{ inputs.publish_image }}
        id: image
        run: |
          digest="${{ steps.existing-image.outputs.digest }}"
          if [ -z "$digest" ]; then
            digest="$(
              aws ecr describe-images \
                --repository-name "$ECR_REPOSITORY" \
                --image-ids imageTag="${{ steps.image-tag.outputs.tag }}" \
                --query "imageDetails[0].imageDigest" \
                --output text
            )"
          fi

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Resolved image digest has invalid shape: $digest" >&2
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "uri=$ECR_URI@$digest" >> "$GITHUB_OUTPUT"

      - name: Read ECR scan finding counts
        if: ${{ inputs.publish_image }}
        id: scan
        run: |
          set -euo pipefail

          # ECR creates the scan record asynchronously after an image push.
          # The AWS waiter exits immediately if that record is not present yet,
          # so first poll specifically for record creation, then use the waiter
          # for the actual scan-completion state.
          for attempt in $(seq 1 30); do
            set +e
            aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageDigest="${{ steps.image.outputs.digest }}" \
              --max-results 1 >/dev/null 2>"$RUNNER_TEMP/ecr-scan-record.err"
            describe_status=$?
            set -e

            if [ "$describe_status" -eq 0 ]; then
              break
            fi
            if ! grep -q "ScanNotFoundException" "$RUNNER_TEMP/ecr-scan-record.err"; then
              cat "$RUNNER_TEMP/ecr-scan-record.err" >&2
              exit "$describe_status"
            fi
            if [ "$attempt" = "30" ]; then
              echo "ECR did not create an image scan record within five minutes." >&2
              exit 1
            fi
            sleep 10
          done

          if ! aws ecr wait image-scan-complete \
            --repository-name "$ECR_REPOSITORY" \
            --image-id imageDigest="${{ steps.image.outputs.digest }}"; then
            echo "Image scan did not complete for the immutable image digest." >&2
            exit 1
          fi

          scan_status="$(
            aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageDigest="${{ steps.image.outputs.digest }}" \
              --query "imageScanStatus.status" \
              --output text
          )"
          critical="$(
            aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageDigest="${{ steps.image.outputs.digest }}" \
              --query "imageScanFindings.findingSeverityCounts.CRITICAL || \`0\`" \
              --output text
          )"
          high="$(
            aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageDigest="${{ steps.image.outputs.digest }}" \
              --query "imageScanFindings.findingSeverityCounts.HIGH || \`0\`" \
              --output text
          )"

          critical="${critical:-0}"
          high="${high:-0}"
          echo "status=$scan_status" >> "$GITHUB_OUTPUT"
          echo "critical=$critical" >> "$GITHUB_OUTPUT"
          echo "high=$high" >> "$GITHUB_OUTPUT"

          if [ "$scan_status" != "COMPLETE" ]; then
            echo "Image scan did not report COMPLETE: $scan_status" >&2
            exit 1
          fi
          if [ "$critical" != "0" ]; then
            echo "Image scan found CRITICAL vulnerabilities: $critical" >&2
            exit 1
          fi
          if [ "$high" != "0" ]; then
            echo "Image scan found HIGH vulnerabilities: $high. Fix them before deployment; this initial public target has no risk-acceptance mechanism." >&2
            exit 1
          fi

      - name: Generate image SBOM
        if: ${{ inputs.publish_image }}
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.uri }}
          format: spdx-json
          output-file: ${{ runner.temp }}/platform-shell.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest image provenance
        if: ${{ inputs.publish_image }}
        id: provenance-attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.ECR_URI }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest image SBOM
        if: ${{ inputs.publish_image }}
        id: sbom-attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.ECR_URI }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/platform-shell.sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Record image-publication summary
        run: |
          {
            echo "## Platform Shell staging image"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow run: ${GITHUB_RUN_ID}"
            echo "- Build image: ${{ steps.base-image.outputs.build_image }}"
            echo "- Build digest: ${{ steps.base-image.outputs.build_digest }}"
            echo "- Runtime image: ${{ steps.base-image.outputs.runtime_image }}"
            echo "- Runtime digest: ${{ steps.base-image.outputs.runtime_digest }}"
            echo "- Image tag: ${{ steps.image-tag.outputs.tag }}"
            if [ "${{ inputs.publish_image }}" = "true" ]; then
              echo "- Image digest: ${{ steps.image.outputs.digest }}"
              echo "- Deploy image URI: ${{ steps.image.outputs.uri }}"
              echo "- ECR scan status: ${{ steps.scan.outputs.status }}"
              echo "- ECR scan CRITICAL: ${{ steps.scan.outputs.critical }}"
              echo "- ECR scan HIGH: ${{ steps.scan.outputs.high }}"
              echo "- SBOM: attested from SPDX JSON before deployment"
              echo "- Provenance attestation: ${{ steps.provenance-attestation.outputs.attestation-url }}"
              echo "- SBOM attestation: ${{ steps.sbom-attestation.outputs.attestation-url }}"
            else
              echo "- Image publish: skipped by workflow input"
            fi
            echo "- Service deployment: not performed by this workflow"
            echo ""
            echo "- Next action: create and review target CloudFormation change sets using the immutable image URI above."
            echo "- Public health, authentication, rate-limit, WAF, alarm-delivery, and rollback proof remain separate governed deployment evidence."
          } >> "$GITHUB_STEP_SUMMARY"
