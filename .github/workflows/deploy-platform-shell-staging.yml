name: Publish Platform Shell Staging Image

on:
  workflow_dispatch:
    inputs:
      base_image_ref:
        description: Build-stage Node image tag or digest to resolve and pin for this staging build.
        required: true
        default: node:22-bookworm-slim
      runtime_image_ref:
        description: Final minimal Node runtime image tag or digest to resolve and pin for this staging build.
        required: true
        default: gcr.io/distroless/nodejs22-debian12:nonroot
      publish_image:
        description: Push the checked, scanned, and attested image to the staging ECR repository; this workflow never deploys it.
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: platform-shell-staging
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::337159794548:role/github-platform-shell-staging-deploy
  ECR_REPOSITORY: platform-shell
  ECR_URI: 337159794548.dkr.ecr.eu-west-1.amazonaws.com/platform-shell
  READINESS_MANIFEST: infra/04.deploy/03.product/targets/kanbien/staging/deploy-readiness.yml

jobs:
  build-image:
    name: Build staging image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Enforce remote-main deploy source
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Deploy blocked: expected refs/heads/main, got $GITHUB_REF" >&2
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install repository dependencies
        run: npm ci --ignore-scripts

      - name: Install script dependencies
        run: python -m pip install PyYAML==6.0.2

      - name: Enforce delivery-chain registration and contracts
        run: python3 scripts/04.deploy/inventory-deploy-control/script.py --delivery --check

      - name: Run platform shell checks
        id: source-checks
        run: |
          npm run platform:server:check
          npm run platform:server:image-runtime-check
          npm run product:kanbien-platform:check
          npm run platform:shell:infrastructure:check
          npm run platform:shell:deployment-workflow:check
          bash scripts/04.deploy/validate-container-boundaries/script.sh

      - name: Verify blocked deploy-readiness manifest
        run: |
          bash scripts/04.deploy/verify-platform-shell-deploy-readiness/script.sh \
            --manifest "$READINESS_MANIFEST" \
            --allow-blocked \
            --caller-intent planning \
            --json

      - name: Configure AWS credentials
        id: credentials
        if: ${{ inputs.publish_image }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: registry-login
        if: ${{ inputs.publish_image }}
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve digest-pinned build and runtime images
        id: base-image
        run: |
          set -euo pipefail

          resolve_image() {
            local reference="$1"
            local kind="$2"
            local repository
            local digest
            local image

            if [[ "$reference" == *@sha256:* ]]; then
              repository="${reference%@sha256:*}"
              digest="sha256:${reference##*@sha256:}"
              image="$reference"
            else
              repository="${reference%:*}"
              if [ "$repository" = "$reference" ]; then
                echo "$kind image must include a tag or digest: $reference" >&2
                exit 1
              fi
              digest="$(docker buildx imagetools inspect "$reference" --format '{{.Manifest.Digest}}')"
              image="${repository}@${digest}"
            fi

            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Resolved $kind image digest has invalid shape: $digest" >&2
              exit 1
            fi

            printf '%s\t%s\t%s\n' "$repository" "$digest" "$image"
          }

          IFS=$'\t' read -r build_repository build_digest build_image < <(
            resolve_image "${{ inputs.base_image_ref }}" "build"
          )
          IFS=$'\t' read -r runtime_repository runtime_digest runtime_image < <(
            resolve_image "${{ inputs.runtime_image_ref }}" "runtime"
          )

          echo "build_repository=$build_repository" >> "$GITHUB_OUTPUT"
          echo "build_digest=$build_digest" >> "$GITHUB_OUTPUT"
          echo "build_image=$build_image" >> "$GITHUB_OUTPUT"
          echo "runtime_repository=$runtime_repository" >> "$GITHUB_OUTPUT"
          echo "runtime_digest=$runtime_digest" >> "$GITHUB_OUTPUT"
          echo "runtime_image=$runtime_image" >> "$GITHUB_OUTPUT"

      - name: Select immutable staging image tag
        id: image-tag
        run: |
          short_sha="${GITHUB_SHA::12}"
          image_tag="staging-$(date -u +%Y%m%d)-${short_sha}-run${GITHUB_RUN_ID}"
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "uri=$ECR_URI:$image_tag" >> "$GITHUB_OUTPUT"

      - name: Check for existing staging image
        if: ${{ inputs.publish_image }}
        id: existing-image
        run: |
          set +e
          digest="$(
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="${{ steps.image-tag.outputs.tag }}" \
              --query "imageDetails[0].imageDigest" \
              --output text 2>/dev/null
          )"
          status=$?
          set -e
          if [ "$status" -eq 0 ] && [ "$digest" != "None" ] && [ -n "$digest" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build platform shell image
        if: ${{ !inputs.publish_image || steps.existing-image.outputs.exists != 'true' }}
        run: |
          bash scripts/04.deploy/build-platform-shell-image/script.sh \
            --tag "${{ steps.image-tag.outputs.uri }}" \
            --base-image "${{ steps.base-image.outputs.build_image }}" \
            --runtime-image "${{ steps.base-image.outputs.runtime_image }}" \
            --require-digest-base

      - name: Qualify exact platform shell image
        id: qualification
        env:
          EXISTING_IMAGE: ${{ steps.existing-image.outputs.exists }}
          EXISTING_DIGEST: ${{ steps.existing-image.outputs.digest }}
          CANDIDATE_IMAGE: ${{ steps.image-tag.outputs.uri }}
        run: bash scripts/04.deploy/verify-platform-shell-deployment-workflow/qualify-image.sh

      - name: Push platform shell image
        if: ${{ inputs.publish_image && steps.existing-image.outputs.exists != 'true' }}
        run: |
          set -euo pipefail
          qualified_image="$(python3 scripts/04.deploy/lifecycle/40-package/package-custody-receipt/qualification.py verify --image "${{ steps.qualification.outputs.image_id }}" --receipt "$RUNNER_TEMP/qualified-image.json" --configuration-input scripts/04.deploy/lifecycle/00-target-alignment/provider-adapters/aws/ecs-runtime-configuration.py infra/04.deploy/03.product/targets/kanbien/staging/cloudformation/service.yml '*')"
          docker tag "$qualified_image" "${{ steps.image-tag.outputs.uri }}"
          docker push "${{ steps.image-tag.outputs.uri }}"

      - name: Resolve immutable image digest
        if: ${{ inputs.publish_image }}
        id: image
        run: |
          digest="${{ steps.existing-image.outputs.digest }}"
          if [ -z "$digest" ]; then
            digest="$(
              aws ecr describe-images \
                --repository-name "$ECR_REPOSITORY" \
                --image-ids imageTag="${{ steps.image-tag.outputs.tag }}" \
                --query "imageDetails[0].imageDigest" \
                --output text
            )"
          fi

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Resolved image digest has invalid shape: $digest" >&2
            exit 1
          fi

          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "uri=$ECR_URI@$digest" >> "$GITHUB_OUTPUT"

      - name: Verify published target-platform image
        id: published-image
        if: ${{ inputs.publish_image }}
        run: |
          set -euo pipefail
          expected_platform="linux/amd64"
          docker pull --platform "$expected_platform" "${{ steps.image.outputs.uri }}" >/dev/null
          test "$(docker image inspect "${{ steps.image.outputs.uri }}" --format '{{.Id}}')" = "${{ steps.qualification.outputs.image_id }}"
          actual_platform="$(docker image inspect "${{ steps.image.outputs.uri }}" --format '{{.Os}}/{{.Architecture}}')"
          source_revision="$(docker image inspect "${{ steps.image.outputs.uri }}" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [ "$actual_platform" != "$expected_platform" ]; then
            echo "Published image does not match the reviewed runtime platform." >&2
            exit 1
          fi
          if [ "$source_revision" != "$GITHUB_SHA" ]; then
            echo "Published image source revision does not match the checked-out commit." >&2
            exit 1
          fi

      - name: Read ECR scan finding counts
        if: ${{ inputs.publish_image }}
        id: scan
        run: python3 scripts/04.deploy/shared/provider-adapters/aws/ecr-scan.py --repository "$ECR_REPOSITORY" --image-digest "${{ steps.image.outputs.digest }}" --report "$RUNNER_TEMP/ecr-scan.json"
      - name: Generate image SBOM
        if: ${{ inputs.publish_image }}
        id: sbom
        uses: anchore/sbom-action@v0
        with:
          image: ${{ steps.image.outputs.uri }}
          format: spdx-json
          output-file: ${{ runner.temp }}/platform-shell.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest image provenance
        if: ${{ inputs.publish_image }}
        id: provenance-attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.ECR_URI }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest image SBOM
        if: ${{ inputs.publish_image }}
        id: sbom-attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.ECR_URI }}
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ runner.temp }}/platform-shell.sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

      - name: Capture durable package custody receipt
        if: ${{ inputs.publish_image }}
        env:
          SOURCE_CHECKS_OUTCOME: ${{ steps.source-checks.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.qualification.outcome }}
          CREDENTIALS_OUTCOME: ${{ steps.credentials.outcome }}
          REGISTRY_LOGIN_OUTCOME: ${{ steps.registry-login.outcome }}
          PUBLISHED_IMAGE_OUTCOME: ${{ steps.published-image.outcome }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SBOM_OUTCOME: ${{ steps.sbom.outcome }}
          PROVENANCE_OUTCOME: ${{ steps.provenance-attestation.outcome }}
          SBOM_ATTESTATION_OUTCOME: ${{ steps.sbom-attestation.outcome }}
          PUBLISHED_DIGEST: ${{ steps.image.outputs.digest }}
          SBOM_PATH: ${{ runner.temp }}/platform-shell.sbom.spdx.json
        run: |
          python3 scripts/04.deploy/verify-platform-shell-deployment-workflow/emit-custody.py --output "$RUNNER_TEMP/platform-shell-custody.json"
          bash scripts/04.deploy/lifecycle/40-package/package-custody-receipt/script.sh --receipt "$RUNNER_TEMP/platform-shell-custody.json" --expected-target kanbien-staging --expected-candidate platform-shell --expected-package-contract kanbien-staging-platform-shell --expected-program platform-shell --json

      - name: Retain immutable package custody evidence
        if: ${{ inputs.publish_image }}
        uses: actions/upload-artifact@v4
        with:
          name: platform-shell-package-custody-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/platform-shell-custody.json
            ${{ runner.temp }}/qualified-image.json
            ${{ runner.temp }}/platform-shell.sbom.spdx.json
            ${{ runner.temp }}/ecr-scan.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false

      - name: Record image-publication summary
        run: |
          {
            echo "## Platform Shell staging image"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow run: ${GITHUB_RUN_ID}"
            echo "- Build image: ${{ steps.base-image.outputs.build_image }}"
            echo "- Build digest: ${{ steps.base-image.outputs.build_digest }}"
            echo "- Runtime image: ${{ steps.base-image.outputs.runtime_image }}"
            echo "- Runtime digest: ${{ steps.base-image.outputs.runtime_digest }}"
            echo "- Image tag: ${{ steps.image-tag.outputs.tag }}"
            if [ "${{ inputs.publish_image }}" = "true" ]; then
              echo "- Image digest: ${{ steps.image.outputs.digest }}"
              echo "- Deploy image URI: ${{ steps.image.outputs.uri }}"
              echo "- ECR scan status: ${{ steps.scan.outputs.status }}"
              echo "- ECR scan CRITICAL: ${{ steps.scan.outputs.critical }}"
              echo "- ECR scan HIGH: ${{ steps.scan.outputs.high }}"
              echo "- SBOM: attested from SPDX JSON before deployment"
              echo "- Provenance attestation: ${{ steps.provenance-attestation.outputs.attestation-url }}"
              echo "- SBOM attestation: ${{ steps.sbom-attestation.outputs.attestation-url }}"
            else
              echo "- Image publish: skipped by workflow input"
            fi
            echo "- Service deployment: not performed by this workflow"
            echo ""
            echo "- Next action: create and review target CloudFormation change sets using the immutable image URI above."
            echo "- Public health, authentication, rate-limit, WAF, alarm-delivery, and rollback proof remain separate governed deployment evidence."
          } >> "$GITHUB_STEP_SUMMARY"
