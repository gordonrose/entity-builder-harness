schema: deploy/runnable-program-contract/v1
id: kanbien-core-server-candidate
version: 1
runnable_programs:
  - id: kanbien-core-server
    source_entrypoint: infra/04.deploy/03.product/entrypoints/kanbien-core-server.main.ts
    entrypoint: artifacts/kanbien-core-server.main.js
    role: http-server
    configuration_boundary: platform/server/src/configuration/
    dependency_failure_boundary: platform/server/src/configuration/
    local_proof: scripts/04.deploy/lifecycle/20-build/core-server-dependency-boundary/smoke-test.sh
    owner: 04.deploy/03.product
    approved_dependencies:
      - core
      - platform-config
      - platform-contracts
      - platform-health
      - platform-observability
      - platform-runtime
      - platform-security
      - platform-server
    observed_dependencies:
      - core
      - platform-config
      - platform-contracts
      - platform-health
      - platform-observability
      - platform-runtime
      - platform-security
      - platform-server
    forbidden_dependencies:
      - app-platform-smoke
      - platform-adapter-aws
      - platform-persistence
      - platform-workers
      - product-kanbien-platform
      - staging-platform-server
      - postgresql
      - relay
      - worker
  - id: kanbien-core-server-persistence
    source_entrypoint: infra/04.deploy/03.product/entrypoints/kanbien-core-server-persistence.main.ts
    entrypoint: artifacts/kanbien-core-server-persistence.main.js
    role: http-server
    configuration_boundary: infra/04.deploy/03.product/entrypoints/kanbien-core-server-persistence.main.ts
    dependency_failure_boundary: infra/04.deploy/03.product/entrypoints/kanbien-core-server-persistence.app.ts
    local_proof: scripts/04.deploy/lifecycle/20-build/core-server-persistence-composition/smoke-test.sh
    owner: 04.deploy/03.product
    approved_dependencies: [core, platform-adapter-aws-postgresql, platform-config, platform-contracts, platform-health, platform-observability, platform-persistence, platform-runtime, platform-security, platform-server, postgresql]
    observed_dependencies: [core, platform-adapter-aws-postgresql, platform-config, platform-contracts, platform-health, platform-observability, platform-persistence, platform-runtime, platform-security, platform-server, postgresql]
    forbidden_dependencies: [app-platform-smoke, platform-workers, product-kanbien-platform, staging-platform-server, relay, worker]
image_contracts:
  - id: kanbien-core-server-image
    program: kanbien-core-server
    command_mode: exec
    command:
      - node
      - artifacts/kanbien-core-server.main.js
  - id: kanbien-core-server-persistence-image
    program: kanbien-core-server-persistence
    command_mode: exec
    command: [node, artifacts/kanbien-core-server-persistence.main.js]
package_candidates:
  - id: kanbien-core-server-candidate
    image_contract: kanbien-core-server-image
    immutable_identity_rule: runtime-bound-sha256
  - id: kanbien-core-server-persistence-candidate
    image_contract: kanbien-core-server-persistence-image
    immutable_identity_rule: runtime-bound-sha256
candidate_verifications:
  - candidate: kanbien-core-server-candidate
    required_evidence_fields: [package_contract_id, candidate_id, program_id, source_revision, image_digest, release_identity, health_verdict, verification_verdict, checked_at, receipt_reference]
  - candidate: kanbien-core-server-persistence-candidate
    required_evidence_fields: [package_contract_id, candidate_id, program_id, source_revision, image_digest, release_identity, health_verdict, verification_verdict, checked_at, receipt_reference]
