health_recovery:
  declaration_schema: "deploy/health-failure-and-recovery-declaration/v2"
  workloads:
    -
      id: "entity-smoke-server"
      workload_type: "long-running-server"
      binding: "entity-smoke-server-service"
      persistence_writes: true
      liveness:
        path: "/livez"
        expected_status: 200
      readiness:
        path: "/readyz"
        expected_status: 200
        depends_on:
          ["postgresql"]
      health_signal_mapping:
        provider_replacement_signal: "liveness"
        dependency_readiness_effect: "block-candidate-acceptance"
        candidate_acceptance_signals:
          ["liveness","readiness"]
      startup_failure:
        invalid_required_configuration:
          result: "process-exits"
          diagnostic_code: "ENTITY_SMOKE_OPERATION_NOT_CONFIRMED"
      dependency_failures:
        -
          dependency: "postgresql"
          unavailable:
            result: "not-ready"
            diagnostic_code: "ENTITY_SMOKE_OPERATION_NOT_CONFIRMED"
      automatic_workload_recovery:
        owner: "aws-ecs-service"
        unhealthy_workload: "replace"
        prohibited_automatic_actions:
          ["replay-uncertain-operation"]
      release_recovery:
        strategy: "restore-prior-accepted-immutable-release"
        automatic_restore: "prohibited"
        verification: "repeat-declared-health-and-meaningful-operation"
      proof:
        local:
          status: "planned"
          command: "scripts/04.deploy/lifecycle/20-build/entity-smoke-composition/smoke-test.sh"
