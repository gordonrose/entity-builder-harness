          result_code: "ENTITY_SMOKE_RECORD_RETRIEVED"
        interruption:
          policy: "stop-and-escalate"
        retry_policy: "no-automatic-retries"
      server_mediated_dependency_proof:
        dependency: "postgresql"
        target_workload: "entity-smoke-server"
