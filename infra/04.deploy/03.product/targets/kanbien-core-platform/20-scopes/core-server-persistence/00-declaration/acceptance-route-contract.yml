    command: migration-state-observation
    proof_type: administration
    operation: observe-migration-state
    result_code: PERSISTENCE_MIGRATION_STATE_APPLIED_CONFIRMED
    image_role: candidate
    family: kanbien-core-platform-persistence-administration
    deadline_workload: persistence-administration
  effective-privilege:
    command: effective-privilege
    proof_type: administration
    operation: prove-effective-privilege
    result_code: PERSISTENCE_RUNTIME_PRIVILEGE_PROVEN
    image_role: candidate
    family: kanbien-core-platform-persistence-administration
    deadline_workload: persistence-administration
  server-replacement:
