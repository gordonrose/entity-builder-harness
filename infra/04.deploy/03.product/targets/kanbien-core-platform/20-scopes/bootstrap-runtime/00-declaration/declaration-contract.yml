#   schema: agentic-artifact/v3
#   id: infra.04-deploy.03-product.targets.kanbien-core-platform.scope.bootstrap-runtime.contract
#   version: 11
#   status: active
#   created_on: "2026-10-20"
#   updated_on: "2026-10-25"
#   layer: 04.deploy
#   domain: deployment.bootstrap-runtime
#   disciplines:
#   - architecture
#   - security
#   - sre
#   kind: deployment-scope-contract
#   purpose: Declare the bootstrap runtime's program, configuration names, verification, exclusions, receipt, and rollback requirements.
#   portability:
#     class: internal
#     targets: []
#   used_by:
#   - id: deploy.command.core-platform-target-declaration
#     path: scripts/04.deploy/lifecycle/00-target-alignment/core-platform-target-declaration/script.sh
schema: deploy/target-scope-contract/v1
id: kanbien-core-platform-bootstrap-runtime
target: kanbien-core-platform
scope: bootstrap-runtime
status: healthy-runtime-accepted
owner: platform-runtime
program:
  id: kanbien-core-server
  contract: infra/04.deploy/03.product/entrypoints/runnable-program-index.yml
  image_contract: infra/04.deploy/03.product/image/core-server/image-contract.yml
  local_proof: scripts/04.deploy/lifecycle/40-package/smoke-test-core-server-image/script.sh
workload:
  operation: controlled-update-or-restoration
  runtime_selection: ecs-fargate-private-immutable-digest
  runtime_template: 30-provider-realization/aws/cloudformation/bootstrap-runtime.yml
  runtime_boundary: ecs-fargate-private-immutable-digest
  startup_access: 10-foundation/technical-access.yml#workload-startup
  network: 10-foundation/network.yml#private-verifier-route
configuration:
  value_policy: names-and-shapes-only-no-values
  required_names:
    - NODE_ENV
    - HOST
    - PORT
    - PLATFORM_SOURCE_COMMIT_SHA
  optional_names:
    - PLATFORM_CORS_ORIGIN
    - PLATFORM_CORS_ALLOWLIST
    - PLATFORM_HEALTH_LIVEZ_EXPOSURE
    - PLATFORM_HEALTH_READYZ_EXPOSURE
  secret_names: []
  secret_dependencies: []
persistence_diagnostics:
  status: not-applicable
  reason: bootstrap-runtime explicitly excludes persistence and has no required persistence dependency
verification:
  liveness_path: /livez
  readiness_path: /readyz
  release_verification_path: /internal/release-verification
  route_exposure: private-verifier-only
  status: accepted-baseline-private-verification-complete-and-required-after-every-mutation
  owner: platform-runtime
  verifier:
    type: one-shot-private-ecs-task
    template: 30-provider-realization/aws/cloudformation/bootstrap-runtime.yml#ReleaseVerifierTaskDefinition
    required_evidence:
      - immutable-image-digest
      - expected-source-revision
      - private-release-verification-response
health_recovery:
  declaration_schema: deploy/health-failure-and-recovery-declaration/v2
  workloads:
    - id: core-server
      workload_type: long-running-server
      binding: core-server-service
      liveness: { path: /livez, expected_status: 200 }
      readiness: { path: /readyz, expected_status: 200, depends_on: [] }
      health_signal_mapping:
        provider_replacement_signal: readiness
        dependency_readiness_effect: block-candidate-acceptance
        candidate_acceptance_signals: [liveness, readiness]
        dependency_free_replacement_basis: accepted-bootstrap-has-no-required-dependency
      startup_failure:
        invalid_required_configuration: { result: process-exits, diagnostic_code: CONFIGURATION_REQUIRED_SETTING_MISSING }
      dependency_failures: []
      automatic_workload_recovery:
        owner: aws-ecs-service
        unhealthy_workload: replace
        prohibited_automatic_actions: [replay-uncertain-operation]
      release_recovery:
        strategy: restore-prior-accepted-immutable-release
        automatic_restore: prohibited
        verification: repeat-declared-health-and-meaningful-operation
      proof:
        local: { status: passed, command: scripts/04.deploy/lifecycle/40-package/smoke-test-core-server-image/script.sh }
        package: { status: passed, command: scripts/04.deploy/lifecycle/40-package/smoke-test-core-server-image/script.sh }
        live_recovery:
          status: passed
          evidence_reference: ../30-release-evidence/rehearsals/accepted-workload-replacement-2026-10-22.yml
    - id: private-release-verifier
      workload_type: run-to-completion-task
      binding: private-release-verifier-task
      required_workloads: [core-server]
      not_applicable:
        - concern: http-liveness
          workload_type_basis: run-to-completion-task
          scope_basis: private-release-verification-is-completion-based
        - concern: http-readiness
          workload_type_basis: run-to-completion-task
          scope_basis: private-release-verification-is-completion-based
        - concern: automatic-replacement
          workload_type_basis: run-to-completion-task
          scope_basis: task-interruption-is-governed-by-stop-and-escalate
      completion:
        deadline_seconds: 120
        success: { exit_code: 0, result_code: KANBIEN_CORE_RELEASE_VERIFIED }
        interruption: { policy: stop-and-escalate }
        retry_policy: no-automatic-retries
      proof:
        local: { status: passed, command: scripts/04.deploy/lifecycle/40-package/smoke-test-core-server-image/script.sh }
        package: { status: passed, command: scripts/04.deploy/lifecycle/40-package/smoke-test-core-server-image/script.sh }
        completion:
          status: passed
          evidence_reference: ../30-release-evidence/rehearsals/accepted-workload-replacement-2026-10-22.yml
          exit_code: 0
          result_code: KANBIEN_CORE_RELEASE_VERIFIED
          fresh_after: "2026-10-22T18:40:03Z"
          observed_at: "2026-10-22T18:41:22Z"
dependencies:
  required: []
  optional: []
  persistence: []
  excluded:
    - persistence
    - queue
    - product-application
    - provider-adapter
receipt:
  status: qualified-receipt-required-before-update-or-restore
  owner: deployment-platform
  safe_fields:
    - target
    - environment_class
    - provider_region_alias
    - program_id
    - image_contract_id
    - source_revision
    - image_digest
    - release_identity
    - checked_at
    - health_verdict
    - verification_verdict
    - receipt_reference
rollback:
  status: retained-accepted-immutable-release-required-for-restoration
  owner: deployment-platform
  strategy: retain-prior-immutable-digest
  maximum_automatic_retries: 0
excludes:
  - public-ingress
  - persistence
  - application-identity
  - product-capabilities
  - queues-and-workers
  - provider-adapters
  - full-observability-delivery

change_impact:
  schema: deploy/change-impact/v1
  inputs:
  - package.json
  - infra/04.deploy/03.product/targets/kanbien-core-platform/20-scopes/bootstrap-runtime
  - infra/04.deploy/03.product/targets/kanbien-core-platform/30-provider-realization/aws/cloudformation/bootstrap-runtime.yml
  - packages/core
  - platform/contracts
  - platform/config
  - platform/health
  - platform/observability
  - platform/runtime
  - platform/security
  - platform/server
  - infra/04.deploy/03.product/entrypoints/runnable-program-index.yml
  - infra/04.deploy/03.product/entrypoints/kanbien-core-server.main.ts
  - infra/04.deploy/03.product/entrypoints/kanbien-core-server.tsconfig.json
  - infra/04.deploy/03.product/image/core-server
  - scripts/04.deploy/lifecycle/50-deploy/targets/kanbien-core-platform/bootstrap-runtime
  - scripts/04.deploy/lifecycle/60-run/targets/kanbien-core-platform/bootstrap-runtime
  requirements:
  - id: runtime-implementation-and-release-proof
    purpose: Keep the declared runtime, dependent contracts, package and deployment
      consumers connected to their existing checks.
    owner: platform-runtime
    required_by:
    - infra/04.deploy/03.product/targets/kanbien-core-platform/20-scopes/bootstrap-runtime/10-workload-binding/workload-binding.yml
    - infra/04.deploy/03.product/targets/kanbien-core-platform/30-provider-realization/aws/cloudformation/bootstrap-runtime.yml
    declarations:
    - infra/04.deploy/03.product/targets/kanbien-core-platform/20-scopes/bootstrap-runtime/00-declaration/declaration-contract.yml
    - infra/04.deploy/03.product/entrypoints/runnable-program-index.yml
    - infra/04.deploy/03.product/image/core-server/image-contract.yml
    expectation: Every declared implementation exists; local checks do not substitute
      for qualified package or target evidence.
    local_proofs:
    - scope-inventory
    - runnable-program
    - core-dependency-boundary
    package_proofs:
    - bootstrap-container
    target_proofs:
    - bootstrap-target-alignment
    run_proofs:
    - bootstrap-acceptance
