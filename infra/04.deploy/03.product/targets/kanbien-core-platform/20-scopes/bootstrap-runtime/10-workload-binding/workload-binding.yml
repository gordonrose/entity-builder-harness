schema: deploy/workload-binding/v1
id: kanbien-core-platform-bootstrap-runtime-workload
target: kanbien-core-platform
scope: bootstrap-runtime
status: healthy-runtime-accepted
owner: platform-runtime
program_contract: infra/04.deploy/03.product/entrypoints/runnable-program-index.yml
program_id: kanbien-core-server
image_contract: infra/04.deploy/03.product/image/core-server/image-contract.yml
package_identity: runtime-bound-sha256
provider_workload: fixed-ecs-fargate-runtime-stack-live-verified-fresh-alignment-required
workloads:
  - id: core-server-service
    workload_type: long-running-server
    runtime_class: service
    provider_reference: BootstrapRuntimeService
    execution:
      kind: compiled-entrypoint
      source_reference: infra/04.deploy/03.product/entrypoints/kanbien-core-server.main.ts
      command_description: node artifacts/kanbien-core-server.main.js
  - id: private-release-verifier-task
    workload_type: run-to-completion-task
    runtime_class: task
    provider_reference: ReleaseVerifierTaskDefinition
    execution:
      kind: inline-command
      source_reference: infra/04.deploy/03.product/targets/kanbien-core-platform/30-provider-realization/aws/cloudformation/bootstrap-runtime.yml#ReleaseVerifierTaskDefinition.private-release-verifier.command
      command_description: node -e private release verification request
proposed_provider_binding:
  template: 30-provider-realization/aws/cloudformation/bootstrap-runtime.yml
  workload_kind: ecs-fargate-service
  immutable_image_reference: repository-at-sha256-digest-only
  network_placement: selected-private-subnets-no-public-ip
  workload_identity: execution-role-only-no-task-role
  release_verifier: one-shot-private-ecs-task
mutation:
  status: blocked
  allowed_operation: update-or-restore-after-fresh-alignment-and-reviewed-change-set
