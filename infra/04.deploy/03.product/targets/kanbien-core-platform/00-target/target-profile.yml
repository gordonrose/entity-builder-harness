schema: deploy/target-profile/v1
id: kanbien-core-platform
status: healthy-runtime-accepted
baseline: accepted-immutable-release
live_alignment: fresh-update-or-restore-alignment-required
repository_declaration: repository-declaration-complete
provider:
  family: aws
  selection_status: selected-and-live-verified
  account_id: "337159794548"
  region: eu-west-1
  profile: kanbien-dev
  session_execution_roles:
    schema: deploy/aws-session-execution-roles/v1
    role_name_suffixes: {creation: cfn-create, cleanup: cfn-cleanup}
  session_control:
    schema: deploy/aws-session-control/v1
    stack_suffix: session-control
    template: 30-provider-realization/aws/cloudformation/environment-sessions.yml
    records_stack: kanbien-environment-session-records
    records_template: 30-provider-realization/aws/cloudformation/environment-session-records.yml
    record_key: sessions/kanbien-core-platform/current.json
  foundation:
    stack: kanbien-core-platform-foundation
    template: 30-provider-realization/aws/cloudformation/foundation.yml
    publication_pipeline: core-server-persistence-package-custody
    execution_parameters:
      S3ArtifactPrefixListId: {kind: provider, contract: aws-regional-s3-prefix-list/v1}
      ExistingRepositoryArn: {kind: source, field: repository_arn}
      ExistingRepositoryUri: {kind: source, field: repository_uri}
      ExistingGitHubOidcProviderArn: {kind: omit-if-unused}
      CostAlertEmail: {kind: omit-if-unused}
    instance_prerequisites:
      private-network:
        stack: kanbien-core-platform-private-network
        template: 30-provider-realization/aws/cloudformation/private-network.yml
        execution_parameters:
          VpcCidr: {kind: choice, contract: private-network/v1, field: vpc_cidr}
          PrivateSubnetOneCidr: {kind: choice, contract: private-network/v1, field: subnet_one_cidr}
          PrivateSubnetTwoCidr: {kind: choice, contract: private-network/v1, field: subnet_two_cidr}
          AvailabilityZoneOne: {kind: choice, contract: private-network/v1, field: availability_zone_one}
          AvailabilityZoneTwo: {kind: choice, contract: private-network/v1, field: availability_zone_two}
        foundation_parameters:
          VpcId: VpcId
          VpcCidr: VpcCidr
          PrivateSubnetIds: PrivateSubnetIds
target_mutation:
  status: blocked
  allowed_after: qualified-receipt-fresh-alignment-release-contract-reviewed-change-set-and-explicit-approval
  allowed_operation: update-or-restore
