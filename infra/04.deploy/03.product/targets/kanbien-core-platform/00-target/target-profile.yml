  - id: private-network-placement
    status: live-verified-fresh-alignment-required
    owner: network-owner
    evidence: read-only-network-feasibility-inspection
  - id: image-custody-destination
    status: live-verified-fresh-alignment-required
    owner: deployment-platform
    evidence: read-only-registry-availability-inspection
  - id: private-verifier-placement
    status: live-verified-fresh-alignment-required
    owner: platform-runtime
    evidence: read-only-private-route-feasibility-inspection
  - id: logging-destination
