# agentic-artifact:
#   schema: agentic-artifact/v3
#   id: infra.04-deploy.03-product.targets.kanbien-core-platform.cloudformation.core-server-persistence
#   version: 1
#   status: draft
#   created_on: "2026-10-23"
#   updated_on: "2026-10-25"
#   layer: 04.deploy
#   domain: deployment.core-server-persistence
#   disciplines: [architecture, security, sre]
#   kind: cloudformation-template
#   purpose: Define the private PostgreSQL persistence candidate, its isolated server, verifier, ordinary-migration, and administration ECS workload identities, and its native RDS recovery controls.
#   portability: { class: internal, targets: [] }
#   used_by:
#   - id: deploy.command.kanbien-core-platform.create-core-server-persistence-change-set
#     path: scripts/04.deploy/lifecycle/50-deploy/targets/kanbien-core-platform/core-server-persistence/create-change-set/script.py
AWSTemplateFormatVersion: '2010-09-09'
Description: Private PostgreSQL persistence candidate for kanbien-core-platform; no public database or ingress.

Parameters:
  VpcId: { Type: 'AWS::EC2::VPC::Id' }
  VpcCidr: { Type: String, AllowedPattern: '^(10|172|192)\.[0-9]{1,3}\.[0-9]{1,3}\.0/[0-9]{1,2}$' }
  PrivateSubnetIds: { Type: 'List<AWS::EC2::Subnet::Id>' }
  ClusterArn: { Type: String, AllowedPattern: '^arn:aws:ecs:[a-z0-9-]+:[0-9]{12}:cluster/kanbien-core-platform$' }
  NamespaceId: { Type: String, AllowedPattern: '^ns-[a-z0-9]+$' }
  EndpointSecurityGroupId: { Type: 'AWS::EC2::SecurityGroup::Id' }
  S3ArtifactPrefixListId: { Type: String, AllowedPattern: '^pl-[a-z0-9]+$' }
  VerifierSecurityGroupId: { Type: 'AWS::EC2::SecurityGroup::Id' }
  LogGroupName: { Type: String, AllowedPattern: '^/aws/ecs/kanbien-core-platform$' }
  ImageRepositoryArn: { Type: String, AllowedPattern: '^arn:aws:ecr:[a-z0-9-]+:[0-9]{12}:repository/kanbien-core-platform/core-server$' }
  ImageRepositoryUri: { Type: String, AllowedPattern: '^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/kanbien-core-platform/core-server$' }
  ImageDigest: { Type: String, AllowedPattern: '^sha256:[a-f0-9]{64}$' }
  SupportImageDigest: { Type: String, AllowedPattern: '^sha256:[a-f0-9]{64}$' }
  RestoreVerifierImageDigest: { Type: String, AllowedPattern: '^sha256:[a-f0-9]{64}$' }
  ObservabilityCollectorImage: { Type: String, AllowedPattern: '^.+@sha256:[a-f0-9]{64}$' }
  # Supplied only to the governed target-update route.  It is never retained
  # in the repository or in accepted evidence; CloudFormation creates the
  # target-owned topic and awaits the recipient's normal SNS confirmation.
  ObservabilityAlertEmail: { Type: String, NoEcho: true, AllowedPattern: '^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$' }
  SourceRevision: { Type: String, AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$' }

Resources:
  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for kanbien-core-platform persistence.
      SubnetIds: !Ref PrivateSubnetIds
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL ingress only from persistence server and migration task.
      VpcId: !Ref VpcId
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private persistence-capable core server.
      VpcId: !Ref VpcId
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  MigrationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private one-shot PostgreSQL migration task.
      VpcId: !Ref VpcId
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  AdministrationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private one-shot PostgreSQL administration task, isolated from ordinary migration execution.
      VpcId: !Ref VpcId
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  RestorationVerifierSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: One-shot verifier restricted to a temporary restored PostgreSQL database.
      VpcId: !Ref VpcId
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  RestoredDatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Temporary restored PostgreSQL database reachable only by the restoration verifier.
      VpcId: !Ref VpcId
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  ServerDnsUdpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref ServerSecurityGroup, IpProtocol: udp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr }
  ServerDnsTcpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref ServerSecurityGroup, IpProtocol: tcp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr }
  ServerEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref ServerSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationSecurityGroupId: !Ref EndpointSecurityGroupId }
  ServerArtifactObjectStoreEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref ServerSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3ArtifactPrefixListId }
  ServerDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref ServerSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DatabaseSecurityGroup }
  MigrationDnsUdpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref MigrationSecurityGroup, IpProtocol: udp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr }
  MigrationDnsTcpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref MigrationSecurityGroup, IpProtocol: tcp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr }
  MigrationEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref MigrationSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationSecurityGroupId: !Ref EndpointSecurityGroupId }
  MigrationArtifactObjectStoreEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref MigrationSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3ArtifactPrefixListId }
  MigrationDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref MigrationSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DatabaseSecurityGroup }
  AdministrationDnsUdpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref AdministrationSecurityGroup, IpProtocol: udp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr }
  AdministrationDnsTcpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref AdministrationSecurityGroup, IpProtocol: tcp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr }
  AdministrationEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref AdministrationSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationSecurityGroupId: !Ref EndpointSecurityGroupId }
  AdministrationArtifactObjectStoreEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref AdministrationSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3ArtifactPrefixListId }
  AdministrationDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref AdministrationSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DatabaseSecurityGroup }
  RestorationVerifierDnsUdpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref RestorationVerifierSecurityGroup, IpProtocol: udp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr }
  RestorationVerifierDnsTcpEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref RestorationVerifierSecurityGroup, IpProtocol: tcp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr }
  RestorationVerifierEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref RestorationVerifierSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationSecurityGroupId: !Ref EndpointSecurityGroupId }
  RestorationVerifierArtifactObjectStoreEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref RestorationVerifierSecurityGroup, IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3ArtifactPrefixListId }
  RestorationVerifierRestoredDatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref RestorationVerifierSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref RestoredDatabaseSecurityGroup }
  DatabaseIngressFromServer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref DatabaseSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ServerSecurityGroup }
  DatabaseIngressFromMigration:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref DatabaseSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref MigrationSecurityGroup }
  DatabaseIngressFromAdministration:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref DatabaseSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AdministrationSecurityGroup }
  RestoredDatabaseIngressFromRestorationVerifier:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref RestoredDatabaseSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref RestorationVerifierSecurityGroup }
  ServerIngressFromVerifier:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref ServerSecurityGroup, IpProtocol: tcp, FromPort: 3000, ToPort: 3000, SourceSecurityGroupId: !Ref VerifierSecurityGroupId }
  VerifierEgressToServer:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: { GroupId: !Ref VerifierSecurityGroupId, IpProtocol: tcp, FromPort: 3000, ToPort: 3000, DestinationSecurityGroupId: !Ref ServerSecurityGroup }
  EndpointIngressFromServer:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref EndpointSecurityGroupId, IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref ServerSecurityGroup }
  EndpointIngressFromMigration:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref EndpointSecurityGroupId, IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref MigrationSecurityGroup }
  EndpointIngressFromAdministration:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref EndpointSecurityGroupId, IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref AdministrationSecurityGroup }
  EndpointIngressFromRestorationVerifier:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref EndpointSecurityGroupId, IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref RestorationVerifierSecurityGroup }

  MigrationCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      # Retains the established physical secret during the transition. Despite
      # its legacy logical name, this is the RDS master/administrator secret
      # and may be injected only into the administration task.
      Name: kanbien-core-platform-persistence-migration
      GenerateSecretString:
        SecretStringTemplate: '{"username":"core_migration"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags: [{ Key: Target, Value: kanbien-core-platform }]
  RuntimeCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: kanbien-core-platform-persistence-runtime
      GenerateSecretString:
        SecretStringTemplate: '{"username":"core_runtime"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags: [{ Key: Target, Value: kanbien-core-platform }]
  OrdinaryMigrationCredentialsSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: kanbien-core-platform-persistence-ordinary-migration
      GenerateSecretString:
        SecretStringTemplate: '{"username":"core_schema_migration"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      VpcEndpointType: Interface
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      PrivateDnsEnabled: true
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds: [!Ref EndpointSecurityGroupId]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: secretsmanager:GetSecretValue
            Resource: [!Ref MigrationCredentialsSecret, !Ref OrdinaryMigrationCredentialsSecret, !Ref RuntimeCredentialsSecret]
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  ObservabilityCollectorConfiguration:
    Type: AWS::SSM::Parameter
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: /kanbien/core-platform/core-server-persistence/observability/collector-config
      Type: String
      Tier: Standard
      DataType: text
      Description: Non-secret target-owned ADOT EMF metrics collector configuration for the core-server persistence readiness path.
      Value: !Sub |
        extensions:
          health_check:
            endpoint: 127.0.0.1:13133
        receivers:
          otlp:
            protocols:
              http:
                endpoint: 127.0.0.1:4318
        processors:
          memory_limiter:
            check_interval: 1s
            limit_mib: 96
            spike_limit_mib: 32
          batch:
            send_batch_size: 100
            timeout: 10s
        exporters:
          # ADOT's AWS EMF exporter sends metrics through the existing private
          # CloudWatch Logs endpoint.  It is not an OTLP HTTP CloudWatch API.
          awsemf:
            region: ${AWS::Region}
            namespace: Kanbien/CorePlatform
            log_group_name: ${LogGroupName}
            log_stream_name: core-server-persistence-readiness-metrics
            dimension_rollup_option: NoDimensionRollup
            metric_declarations:
              - dimensions: [[target, scope, workload, dependency, readiness]]
                metric_name_selectors: ['^kanbien\\.core_server\\.postgresql_readiness$']
        service:
          extensions: [health_check]
          telemetry:
            logs:
              level: info
          pipelines:
            metrics:
              receivers: [otlp]
              processors: [memory_limiter, batch]
              exporters: [awsemf]
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  PersistenceDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: kanbien-core-platform-persistence
      Engine: postgres
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: kanbienpersistence
      MasterUsername: core_migration
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${MigrationCredentialsSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      EnableCloudwatchLogsExports: [postgresql, upgrade]
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  PersistenceServiceDiscovery:
    Type: AWS::ServiceDiscovery::Service
    Properties:
      Name: core-server-persistence
      DnsConfig: { NamespaceId: !Ref NamespaceId, DnsRecords: [{ Type: A, TTL: 10 }] }
      HealthCheckCustomConfig: { FailureThreshold: 1 }
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  ServerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kanbien-core-platform-persistence-server-execution
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: 'sts:AssumeRole' }] }
      Policies:
        - PolicyName: pull-log-and-read-runtime-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: ecr:GetAuthorizationToken, Resource: '*' }
              - { Effect: Allow, Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage], Resource: !Ref ImageRepositoryArn }
              - { Effect: Allow, Action: [logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:log-stream:*' }
              - { Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: !Ref RuntimeCredentialsSecret }
              - { Effect: Allow, Action: [ssm:GetParameter, ssm:GetParameters], Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/kanbien/core-platform/core-server-persistence/observability/collector-config' }
      Tags: [{ Key: Target, Value: kanbien-core-platform }]
  ServerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kanbien-core-platform-persistence-server-observability
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: 'sts:AssumeRole' }] }
      Policies:
        - PolicyName: deliver-reviewed-readiness-metrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # The collector emits allowlisted EMF metric records into one
              # fixed stream under the existing target log group.  It does not
              # receive generic CloudWatch or Secrets Manager authority.
              - { Effect: Allow, Action: [logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:log-stream:core-server-persistence-readiness-metrics*' }
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  ObservabilityAlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: kanbien-core-platform-observability-alerts
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  ObservabilityAlertSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref ObservabilityAlarmTopic
      Protocol: email
      Endpoint: !Ref ObservabilityAlertEmail
  MigrationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kanbien-core-platform-persistence-migration-execution
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: 'sts:AssumeRole' }] }
      Policies:
        - PolicyName: pull-log-and-read-ordinary-migration-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: ecr:GetAuthorizationToken, Resource: '*' }
              - { Effect: Allow, Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage], Resource: !Ref ImageRepositoryArn }
              - { Effect: Allow, Action: [logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:log-stream:*' }
              - { Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: !Ref OrdinaryMigrationCredentialsSecret }
      Tags: [{ Key: Target, Value: kanbien-core-platform }]
  AdministrationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kanbien-core-platform-persistence-administration-execution
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: 'sts:AssumeRole' }] }
      Policies:
        - PolicyName: pull-log-and-read-administration-bound-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: ecr:GetAuthorizationToken, Resource: '*' }
              - { Effect: Allow, Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage], Resource: !Ref ImageRepositoryArn }
              - { Effect: Allow, Action: [logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:log-stream:*' }
              - { Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: [!Ref MigrationCredentialsSecret, !Ref OrdinaryMigrationCredentialsSecret, !Ref RuntimeCredentialsSecret] }
      Tags: [{ Key: Target, Value: kanbien-core-platform }]
  VerifierExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kanbien-core-platform-persistence-verifier-execution
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: 'sts:AssumeRole' }] }
      Policies:
        - PolicyName: pull-and-log-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: ecr:GetAuthorizationToken, Resource: '*' }
              - { Effect: Allow, Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage], Resource: !Ref ImageRepositoryArn }
              - { Effect: Allow, Action: [logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:log-stream:*' }
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  RestorationVerifierExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kanbien-core-platform-persistence-restoration-verifier-execution
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: 'sts:AssumeRole' }] }
      Policies:
        - PolicyName: pull-log-and-read-runtime-secret
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: ecr:GetAuthorizationToken, Resource: '*' }
              - { Effect: Allow, Action: [ecr:BatchCheckLayerAvailability, ecr:GetDownloadUrlForLayer, ecr:BatchGetImage], Resource: !Ref ImageRepositoryArn }
              - { Effect: Allow, Action: [logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:log-stream:*' }
              - { Effect: Allow, Action: secretsmanager:GetSecretValue, Resource: !Ref RuntimeCredentialsSecret }
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  CoreServerPersistenceTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: kanbien-core-platform-core-server-persistence
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt ServerExecutionRole.Arn
      TaskRoleArn: !GetAtt ServerTaskRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      Tags: [{ Key: Target, Value: kanbien-core-platform }]
      ContainerDefinitions:
        - Name: core-server-persistence
          Image: !Sub '${ImageRepositoryUri}@${ImageDigest}'
          Essential: true
          Cpu: 128
          MemoryReservation: 256
          DependsOn: [{ ContainerName: observability-collector, Condition: START }]
          ReadonlyRootFilesystem: true
          LinuxParameters: { Capabilities: { Drop: [ALL] } }
          PortMappings: [{ ContainerPort: 3000, Protocol: tcp }]
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: HOST, Value: 0.0.0.0 }
            - { Name: PORT, Value: '3000' }
            - { Name: PLATFORM_SOURCE_COMMIT_SHA, Value: !Ref SourceRevision }
            - { Name: PERSISTENCE_POSTGRES_HOST, Value: !GetAtt PersistenceDatabase.Endpoint.Address }
            - { Name: PERSISTENCE_POSTGRES_PORT, Value: !GetAtt PersistenceDatabase.Endpoint.Port }
            - { Name: PERSISTENCE_POSTGRES_DATABASE, Value: kanbienpersistence }
            - { Name: PERSISTENCE_POSTGRES_SCHEMA, Value: platform }
            - { Name: PERSISTENCE_RUNTIME_SECRET_REFERENCE, Value: !Ref RuntimeCredentialsSecret }
            - { Name: PLATFORM_OBSERVABILITY_METRICS_PROVIDER, Value: cloudwatch-otel }
            - { Name: PLATFORM_OBSERVABILITY_METRICS_ENDPOINT, Value: http://127.0.0.1:4318/v1/metrics }
            - { Name: PLATFORM_OBSERVABILITY_METRICS_REGION, Value: !Ref 'AWS::Region' }
            - { Name: PLATFORM_OBSERVABILITY_SERVICE_NAME, Value: kanbien-core-server-persistence }
            - { Name: PLATFORM_OBSERVABILITY_DEPLOYMENT_ENVIRONMENT, Value: kanbien-core-platform }
            - { Name: PLATFORM_OBSERVABILITY_EXPORT_INTERVAL_MS, Value: '30000' }
            - { Name: PLATFORM_OBSERVABILITY_EXPORT_TIMEOUT_MS, Value: '5000' }
            - { Name: PLATFORM_OBSERVABILITY_TARGET, Value: kanbien-core-platform }
            - { Name: PLATFORM_OBSERVABILITY_SCOPE, Value: core-server-persistence }
            - { Name: PLATFORM_OBSERVABILITY_WORKLOAD, Value: core-server }
            - { Name: PLATFORM_OBSERVABILITY_DEPENDENCY, Value: postgresql }
            - { Name: PLATFORM_OBSERVABILITY_READINESS_CADENCE_MS, Value: '30000' }
            - { Name: PLATFORM_OBSERVABILITY_READINESS_TIMEOUT_MS, Value: '5000' }
            - { Name: PLATFORM_OBSERVABILITY_READINESS_STALE_AFTER_MS, Value: '180000' }
            - { Name: PLATFORM_OBSERVABILITY_METRIC_SERIES_JSON, Value: '[{"sourceName":"platform.dependency.readiness","sourceKind":"gauge","sourceUnit":"count","instrumentName":"kanbien.core_server.postgresql_readiness","description":"Periodic PostgreSQL readiness from the core server","allowedLabelNames":["target","scope","workload","dependency","readiness"],"cardinalityLimit":16}]' }
          Secrets: [{ Name: PERSISTENCE_RUNTIME_CREDENTIALS, ValueFrom: !Ref RuntimeCredentialsSecret }]
          HealthCheck:
            Command: [CMD, /nodejs/bin/node, -e, 'fetch("http://127.0.0.1:3000/livez").then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))']
            Interval: 10
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration: { LogDriver: awslogs, Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: core-server-persistence } }
        - Name: observability-collector
          Image: !Ref ObservabilityCollectorImage
          Essential: false
          Cpu: 64
          MemoryReservation: 128
          ReadonlyRootFilesystem: true
          LinuxParameters: { Capabilities: { Drop: [ALL] } }
          Environment: [{ Name: AWS_REGION, Value: !Ref 'AWS::Region' }]
          Secrets: [{ Name: AOT_CONFIG_CONTENT, ValueFrom: !Ref ObservabilityCollectorConfiguration }]
          LogConfiguration: { LogDriver: awslogs, Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: core-server-persistence-observability-collector } }

  CoreServerPostgreSqlReadinessAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kanbien-core-platform-core-server-postgresql-readiness-not-ready-or-silent
      AlarmDescription: Core-server PostgreSQL readiness is not ready or no periodic readiness observation arrived before its stale deadline.
      Namespace: Kanbien/CorePlatform
      MetricName: kanbien.core_server.postgresql_readiness
      Dimensions:
        - { Name: target, Value: kanbien-core-platform }
        - { Name: scope, Value: core-server-persistence }
        - { Name: workload, Value: core-server }
        - { Name: dependency, Value: postgresql }
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref ObservabilityAlarmTopic]
      OKActions: [!Ref ObservabilityAlarmTopic]
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  PersistenceDatabaseFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kanbien-core-platform-postgresql-free-storage-low
      AlarmDescription: Native RDS free storage is below the declared operating reserve.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions: [{ Name: DBInstanceIdentifier, Value: !Ref PersistenceDatabase }]
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref ObservabilityAlarmTopic]
      OKActions: [!Ref ObservabilityAlarmTopic]
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  CoreServerPersistenceService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: kanbien-core-platform-core-server-persistence
      Cluster: !Ref ClusterArn
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      EnableExecuteCommand: false
      EnableECSManagedTags: true
      PropagateTags: TASK_DEFINITION
      DeploymentConfiguration: { MinimumHealthyPercent: 100, MaximumPercent: 200, DeploymentCircuitBreaker: { Enable: true, Rollback: true } }
      NetworkConfiguration: { AwsvpcConfiguration: { AssignPublicIp: DISABLED, SecurityGroups: [!Ref ServerSecurityGroup], Subnets: !Ref PrivateSubnetIds } }
      ServiceRegistries: [{ RegistryArn: !GetAtt PersistenceServiceDiscovery.Arn }]
      TaskDefinition: !Ref CoreServerPersistenceTaskDefinition
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

  CoreServerPersistenceMigrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: kanbien-core-platform-persistence-migration
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt MigrationExecutionRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      Tags: [{ Key: Target, Value: kanbien-core-platform }]
      ContainerDefinitions:
        - Name: persistence-migration
          Image: !Sub '${ImageRepositoryUri}@${SupportImageDigest}'
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters: { Capabilities: { Drop: [ALL] } }
          Command: [artifacts/kanbien-core-server-persistence-migration.main.js]
          Environment:
            - { Name: PERSISTENCE_POSTGRES_HOST, Value: !GetAtt PersistenceDatabase.Endpoint.Address }
            - { Name: PERSISTENCE_POSTGRES_PORT, Value: !GetAtt PersistenceDatabase.Endpoint.Port }
            - { Name: PERSISTENCE_POSTGRES_DATABASE, Value: kanbienpersistence }
            - { Name: PERSISTENCE_POSTGRES_SCHEMA, Value: platform }
            - { Name: PERSISTENCE_MIGRATION_SECRET_REFERENCE, Value: !Ref OrdinaryMigrationCredentialsSecret }
          Secrets:
            - { Name: PERSISTENCE_MIGRATION_CREDENTIALS, ValueFrom: !Ref OrdinaryMigrationCredentialsSecret }
          LogConfiguration: { LogDriver: awslogs, Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: persistence-migration } }

  CoreServerPersistenceAdministrationTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: kanbien-core-platform-persistence-administration
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt AdministrationExecutionRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      Tags: [{ Key: Target, Value: kanbien-core-platform }]
      ContainerDefinitions:
        - Name: persistence-administration
          Image: !Sub '${ImageRepositoryUri}@${SupportImageDigest}'
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters: { Capabilities: { Drop: [ALL] } }
          Command: [artifacts/kanbien-core-server-persistence-administration.main.js]
          Environment:
            - { Name: PERSISTENCE_POSTGRES_HOST, Value: !GetAtt PersistenceDatabase.Endpoint.Address }
            - { Name: PERSISTENCE_POSTGRES_PORT, Value: !GetAtt PersistenceDatabase.Endpoint.Port }
            - { Name: PERSISTENCE_POSTGRES_DATABASE, Value: kanbienpersistence }
            - { Name: PERSISTENCE_POSTGRES_SCHEMA, Value: platform }
            - { Name: PERSISTENCE_ADMINISTRATOR_SECRET_REFERENCE, Value: !Ref MigrationCredentialsSecret }
          Secrets:
            - { Name: PERSISTENCE_ADMINISTRATOR_CREDENTIALS, ValueFrom: !Ref MigrationCredentialsSecret }
            - { Name: PERSISTENCE_ADMINISTRATION_MIGRATION_CREDENTIALS, ValueFrom: !Ref OrdinaryMigrationCredentialsSecret }
            - { Name: PERSISTENCE_ADMINISTRATION_RUNTIME_CREDENTIALS, ValueFrom: !Ref RuntimeCredentialsSecret }
          LogConfiguration: { LogDriver: awslogs, Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: persistence-administration } }

  CoreServerPersistenceVerifierTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: kanbien-core-platform-persistence-verifier
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt VerifierExecutionRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      Tags: [{ Key: Target, Value: kanbien-core-platform }]
      ContainerDefinitions:
        - Name: private-persistence-verifier
          Image: !Sub '${ImageRepositoryUri}@${ImageDigest}'
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters: { Capabilities: { Drop: [ALL] } }
          Command: [artifacts/kanbien-core-server-persistence-verifier.main.js]
          Environment: [{ Name: PERSISTENCE_VERIFIER_MODE, Value: create }, { Name: KANBIEN_PRIVATE_PERSISTENCE_URL, Value: http://core-server-persistence.kanbien-core-platform.internal:3000 }]
          LogConfiguration: { LogDriver: awslogs, Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: persistence-verifier } }

  CoreServerPersistenceRestorationVerifierTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: kanbien-core-platform-persistence-restoration-verifier
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt RestorationVerifierExecutionRole.Arn
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      Tags: [{ Key: Target, Value: kanbien-core-platform }]
      ContainerDefinitions:
        - Name: persistence-restoration-verifier
          Image: !Sub '${ImageRepositoryUri}@${RestoreVerifierImageDigest}'
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters: { Capabilities: { Drop: [ALL] } }
          Command: [artifacts/kanbien-core-server-persistence-restore-verifier.main.js]
          Environment:
            - { Name: PERSISTENCE_POSTGRES_PORT, Value: '5432' }
            - { Name: PERSISTENCE_POSTGRES_DATABASE, Value: kanbienpersistence }
            - { Name: PERSISTENCE_POSTGRES_SCHEMA, Value: platform }
            - { Name: PERSISTENCE_RUNTIME_SECRET_REFERENCE, Value: !Ref RuntimeCredentialsSecret }
          Secrets: [{ Name: PERSISTENCE_RESTORE_RUNTIME_CREDENTIALS, ValueFrom: !Ref RuntimeCredentialsSecret }]
          LogConfiguration: { LogDriver: awslogs, Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: persistence-restoration-verifier } }

Outputs:
  PersistenceDatabaseEndpoint: { Value: !GetAtt PersistenceDatabase.Endpoint.Address }
  PersistenceDatabaseIdentifier: { Value: !Ref PersistenceDatabase }
  RuntimeCredentialsSecretArn: { Value: !Ref RuntimeCredentialsSecret }
  MigrationCredentialsSecretArn: { Value: !Ref MigrationCredentialsSecret }
  AdministratorCredentialsSecretArn: { Value: !Ref MigrationCredentialsSecret }
  OrdinaryMigrationCredentialsSecretArn: { Value: !Ref OrdinaryMigrationCredentialsSecret }
  CoreServerPersistenceServiceArn: { Value: !Ref CoreServerPersistenceService }
  CoreServerPersistenceTaskDefinitionArn: { Value: !Ref CoreServerPersistenceTaskDefinition }
  CoreServerPersistenceMigrationTaskDefinitionArn: { Value: !Ref CoreServerPersistenceMigrationTaskDefinition }
  CoreServerPersistenceAdministrationTaskDefinitionArn: { Value: !Ref CoreServerPersistenceAdministrationTaskDefinition }
  CoreServerPersistenceVerifierTaskDefinitionArn: { Value: !Ref CoreServerPersistenceVerifierTaskDefinition }
  CoreServerPersistenceRestorationVerifierTaskDefinitionArn: { Value: !Ref CoreServerPersistenceRestorationVerifierTaskDefinition }
  PersistenceServiceDiscoveryArn: { Value: !GetAtt PersistenceServiceDiscovery.Arn }
  PersistenceMigrationSecurityGroupId: { Value: !Ref MigrationSecurityGroup }
  PersistenceAdministrationSecurityGroupId: { Value: !Ref AdministrationSecurityGroup }
  PersistenceRestorationVerifierSecurityGroupId: { Value: !Ref RestorationVerifierSecurityGroup }
  PersistenceRestoredDatabaseSecurityGroupId: { Value: !Ref RestoredDatabaseSecurityGroup }
  ObservabilityCollectorConfigurationParameter: { Value: !Ref ObservabilityCollectorConfiguration }
  CoreServerPostgreSqlReadinessAlarmArn: { Value: !GetAtt CoreServerPostgreSqlReadinessAlarm.Arn }
  PersistenceDatabaseFreeStorageAlarmArn: { Value: !GetAtt PersistenceDatabaseFreeStorageAlarm.Arn }
