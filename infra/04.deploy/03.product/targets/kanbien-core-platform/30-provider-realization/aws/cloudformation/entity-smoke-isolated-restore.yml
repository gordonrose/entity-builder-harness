# agentic-artifact:
#   schema: agentic-artifact/v3
#   id: infra.04-deploy.entity-smoke.aws.isolated-restore-template
#   version: 1
#   status: draft
#   created_on: "2026-11-08"
#   updated_on: "2026-11-09"
#   layer: 04.deploy
#   domain: deployment.entity-smoke
#   disciplines: [security, sre]
#   kind: cloudformation-template
#   purpose: Restore an owned snapshot into a separate private database and give only its runtime identity to an isolated fact reader.
#   portability: {class: internal, targets: []}
#   used_by:
#   - id: deploy.plan.entity-smoke-core-platform
#     path: .agentic/04.deploy/plans/implementation/entity-smoke-core-platform.md
AWSTemplateFormatVersion: '2010-09-09'
Description: Disposable entity-smoke restore proof; no source database access, secret delivery, migration, grants or feature service.
Parameters:
  VpcId: { Type: 'AWS::EC2::VPC::Id' }
  VpcCidr: { Type: String, AllowedPattern: '^(10|172|192)\.[0-9]{1,3}\.[0-9]{1,3}\.0/[0-9]{1,2}$' }
  EndpointSecurityGroupId: { Type: 'AWS::EC2::SecurityGroup::Id' }
  S3ArtifactPrefixListId: { Type: String, AllowedPattern: '^pl-[a-z0-9]+$' }
  LogGroupName: { Type: String, AllowedValues: ['/aws/ecs/kanbien-core-platform'] }
  DatabaseSubnetGroupName: { Type: String, AllowedPattern: '^[a-z][a-z0-9-]{0,254}$' }
  RestoredDatabaseName: { Type: String, AllowedPattern: '^[a-z][a-z0-9_]{0,62}$' }
  RestoredDatabaseIdentifier: { Type: String, AllowedPattern: '^kanbien-core-platform-entity-smoke-restore-[a-f0-9]{16}$' }
  SourceSnapshotArn: { Type: String, AllowedPattern: '^arn:aws:rds:eu-west-1:[0-9]{12}:snapshot:kanbien-core-platform-entity-smoke-[a-f0-9]{24}$' }
  ProofLabel: { Type: String, AllowedPattern: '^entity-smoke-[a-f0-9]{24}$' }
  ImageRepositoryUri: { Type: String, AllowedPattern: '^[0-9]{12}\.dkr\.ecr\.eu-west-1\.amazonaws\.com/kanbien-core-platform/entity-smoke$' }
  ImageRepositoryArn: { Type: String, AllowedPattern: '^arn:aws:ecr:eu-west-1:[0-9]{12}:repository/kanbien-core-platform/entity-smoke$' }
  ImageDigest: { Type: String, AllowedPattern: '^sha256:[a-f0-9]{64}$' }
  SourceRevision: { Type: String, AllowedPattern: '^[a-f0-9]{40}$' }
Resources:
  RestoreDatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Separate restored database; only the owned restore reader can connect.
      VpcId: !Ref VpcId
      Tags: [{ Key: Target, Value: kanbien-core-platform }, { Key: Scope, Value: entity-smoke }, { Key: ProofLabel, Value: !Ref ProofLabel }]
      SecurityGroupEgress:
        - { IpProtocol: udp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr }
        - { IpProtocol: tcp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr }
  RestoredDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      DBInstanceIdentifier: !Ref RestoredDatabaseIdentifier
      DBSnapshotIdentifier: !Ref SourceSnapshotArn
      DBInstanceClass: db.t4g.micro
      DBSubnetGroupName: !Ref DatabaseSubnetGroupName
      VPCSecurityGroups: [!GetAtt RestoreDatabaseSecurityGroup.GroupId]
      PubliclyAccessible: false
      MultiAZ: false
      EnableIAMDatabaseAuthentication: true
      DeletionProtection: false
      CopyTagsToSnapshot: true
      Tags: [{ Key: Target, Value: kanbien-core-platform }, { Key: Scope, Value: entity-smoke }, { Key: Purpose, Value: isolated-restore-proof }, { Key: ProofLabel, Value: !Ref ProofLabel }]
  RestoreReaderSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Private entity-smoke restore-reader only.
      VpcId: !Ref VpcId
      Tags: [{ Key: Target, Value: kanbien-core-platform }, { Key: Scope, Value: entity-smoke }]
      SecurityGroupEgress:
        - { IpProtocol: udp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr }
        - { IpProtocol: tcp, FromPort: 53, ToPort: 53, CidrIp: !Ref VpcCidr }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationSecurityGroupId: !Ref EndpointSecurityGroupId }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, DestinationPrefixListId: !Ref S3ArtifactPrefixListId }
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref RestoreDatabaseSecurityGroup }
  EndpointIngressFromRestoreReader:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref EndpointSecurityGroupId, IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref RestoreReaderSecurityGroup }
  RestoreReaderExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: 'sts:AssumeRole' }]
      Policies:
        - PolicyName: entity-smoke-restore-reader-delivery
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: 'ecr:GetAuthorizationToken', Resource: '*' }
              - { Effect: Allow, Action: ['ecr:BatchCheckLayerAvailability', 'ecr:GetDownloadUrlForLayer', 'ecr:BatchGetImage'], Resource: !Ref ImageRepositoryArn }
              - { Effect: Allow, Action: ['logs:CreateLogStream', 'logs:PutLogEvents'], Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:${LogGroupName}:log-stream:entity-smoke-*' }
  RestoreReaderTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: 'sts:AssumeRole' }]
      Policies:
        - PolicyName: entity-smoke-restore-reader-database
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: 'rds-db:connect', Resource: !Sub 'arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${RestoredDatabase.DbiResourceId}/entity_smoke_runtime' }
  RestoreReaderTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: kanbien-core-platform-entity-smoke-restore-reader
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt RestoreReaderExecutionRole.Arn
      TaskRoleArn: !GetAtt RestoreReaderTaskRole.Arn
      ContainerDefinitions:
        - Name: entity-smoke-restore-reader
          Image: !Sub '${ImageRepositoryUri}@${ImageDigest}'
          Essential: true
          ReadonlyRootFilesystem: true
          LinuxParameters: { Capabilities: { Drop: [ALL] } }
          Command: [artifacts/kanbien-entity-smoke-database-proof.main.js]
          LogConfiguration:
            LogDriver: awslogs
            Options: { awslogs-group: !Ref LogGroupName, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: entity-smoke-restore-reader }
          Environment:
            - { Name: ENTITY_SMOKE_DATABASE_PROOF_OPERATION, Value: restore-read }
            - { Name: NODE_ENV, Value: production }
            - { Name: PLATFORM_SOURCE_COMMIT_SHA, Value: !Ref SourceRevision }
            - { Name: PERSISTENCE_POSTGRES_HOST, Value: !GetAtt RestoredDatabase.Endpoint.Address }
            - { Name: PERSISTENCE_POSTGRES_PORT, Value: '5432' }
            - { Name: PERSISTENCE_POSTGRES_DATABASE, Value: !Ref RestoredDatabaseName }
            - { Name: PERSISTENCE_POSTGRES_SCHEMA, Value: entity_smoke }
            - { Name: PERSISTENCE_POSTGRES_CA_PATH, Value: /app/assets/rds-eu-west-1-bundle.crt }
            - { Name: PERSISTENCE_POSTGRES_IAM_REGION, Value: !Ref 'AWS::Region' }
            - { Name: PERSISTENCE_POSTGRES_IAM_AUTHENTICATION_REFERENCE, Value: !Sub 'arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:${RestoredDatabase.DbiResourceId}/entity_smoke_runtime' }
            - { Name: PERSISTENCE_RUNTIME_DATABASE_USERNAME, Value: entity_smoke_runtime }
            - { Name: PLATFORM_DEPLOYMENT_EXPOSURE, Value: private }
  RestoreDatabaseIngressFromReader:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: { GroupId: !Ref RestoreDatabaseSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref RestoreReaderSecurityGroup }
Outputs:
  RestoredDatabaseIdentifier: { Value: !Ref RestoredDatabase }
  RestoredDatabaseResourceId: { Value: !GetAtt RestoredDatabase.DbiResourceId }
  RestoredDatabaseEndpoint: { Value: !GetAtt RestoredDatabase.Endpoint.Address }
  RestoreReaderTaskDefinitionArn: { Value: !Ref RestoreReaderTaskDefinition }
  RestoreReaderSecurityGroupId: { Value: !Ref RestoreReaderSecurityGroup }
