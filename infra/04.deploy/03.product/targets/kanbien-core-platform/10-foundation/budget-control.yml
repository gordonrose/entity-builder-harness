schema: deploy/provider-condition-declaration/v1
target: kanbien-core-platform
condition_id: target-filtered-monthly-budget-active
owner: cost-owner
required_evidence: provider-condition-evidence/v1
evidence_validator: scripts/04.deploy/lifecycle/00-target-alignment/validate-provider-condition-evidence/script.sh
required_for: target-mutation-cost-guard
status: verified
evidence: evidence/target-filtered-monthly-budget.yml
next_safe_recheck: fresh-read-only-budget-description-before-next-target-mutation
expected_provider_configuration:
  budget_name: kanbien-core-platform-monthly
  budget_type: COST
  time_unit: MONTHLY
  amount: 100
  unit: USD
  target_filter: user:Target$kanbien-core-platform
remediation_when_absent:
  intended_stack: kanbien-core-platform-foundation
  source_template: 30-provider-realization/aws/cloudformation/foundation.yml
  parameter_change:
    EnableTargetBudget: 'true'
  preserved_parameter_requirements:
    - current-network-and-registry-parameters
    - approved-non-secret-cost-alert-recipient
  governed_sequence:
    - create-and-review-a-foundation-update-change-set
    - execute-only-after-explicit-target-mutation-approval
    - read-only-describe-budget-must-match-expected-provider-configuration
    - replace-this-evidence-with-a-fresh-verified-observation
  required_authority: explicit-approval-for-foundation-stack-update-that-creates-the-target-budget
