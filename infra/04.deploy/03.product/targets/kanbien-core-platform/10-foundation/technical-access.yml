schema: deploy/technical-access/v1
target: kanbien-core-platform
status: established-e2c-fresh-e4-evidence-required
access_intents:
  - id: delivery-custody
    actor: delivery-pipeline
    purpose: obtain-approved-immutable-package-and-submit-reviewed-change-set
    provider_identity: github-kanbien-core-platform-delivery-fresh-e4-evidence-required
    owner: deployment-platform
    forbidden:
      - secret-value-read
      - arbitrary-target-selection
      - staging-access
  - id: workload-startup
    actor: target-runtime
    purpose: obtain-selected-package-and-approved-non-secret-startup-configuration
    provider_identity: kanbien-core-platform-task-execution-fresh-e4-evidence-required
    owner: platform-runtime
    forbidden:
      - delivery-mutation
      - application-data-access
      - staging-access
maintenance:
  delivery-repository-observation:
    operation: add-repository-observation
    controller: scripts/04.deploy/lifecycle/50-deploy/capabilities/foundation-access-update/script.py
    workflow: .agentic/aws/50-deploy/workflows/targets/kanbien-core-platform/10-foundation/update-delivery-observation-access.md
    logical_resource: DeliveryRole
    policy_name: publish-core-image
    resource_parameter: ExistingRepositoryArn
    action: ecr:DescribeRepositories
