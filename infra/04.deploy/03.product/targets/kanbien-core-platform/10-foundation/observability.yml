schema: deploy/observability-foundation/v1
target: kanbien-core-platform
status: local-contract-validated-live-proof-required
owner: observability-owner
collector:
  delivery: task-local-sidecar
  image: immutable-image-parameter-required-before-live-deployment
  config_parameter: /kanbien/core-platform/core-server-persistence/observability/collector-config
  config_values: non-secret-only
  startup: start-before-application-container
  shutdown: application-stops-exporting-before-collector-task-termination
  # The ADOT EMF exporter creates the reviewed custom metric through
  # CloudWatch Logs.  The existing target-private Logs endpoint is therefore
  # the actual delivery dependency; a monitoring endpoint would not prove this
  # exporter path and would add an unused recurring-cost resource.
  private_delivery: cloudwatch-logs-interface-endpoint
  task_role: scoped-cloudwatch-logs-put-events
metric_sources:
  application: scope-contract:core-server-persistence.observability_mvp.metric_catalogue.application
  rds_native: scope-contract:core-server-persistence.observability_mvp.metric_catalogue.rds_native
notification:
  destination: target-owned-topic-parameter
  acceptance: external-subscription-confirmation-and-delivery-receipt-without-address-or-message-content

