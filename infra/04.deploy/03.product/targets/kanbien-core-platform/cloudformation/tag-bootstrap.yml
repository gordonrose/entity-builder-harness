AWSTemplateFormatVersion: '2010-09-09'
Description: E2a only. Empty tagged repository; no runtime, role, network, or image.

Resources:
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: kanbien-core-platform/core-server
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      Tags: [{ Key: Target, Value: kanbien-core-platform }]

Outputs:
  RepositoryArn: { Value: !GetAtt Repository.Arn }
  RepositoryUri: { Value: !GetAtt Repository.RepositoryUri }
