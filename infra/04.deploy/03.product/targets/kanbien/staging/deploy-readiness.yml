blockers:
  - id: platform-shell-readiness.deferred-worker-runtime
    severity: blocking
    path: runtime.worker
    reason: The target is intentionally server-only until a declared background workload exists; no worker task definition or service has been deployed or exercised.
    resolution: When a product selects a queue-backed job workload, deploy the worker task definition and service, then record queue, dead-letter, worker health, and rollback evidence.
  - id: platform-shell-readiness.protected-dummy-route-deployment-smoke
    severity: blocking
    path: auth.route_exposure.protected_dummy_route.deployment_smoke
    reason: A controlled Cognito token proves the correctly scoped protected route returns 200, alongside the existing unauthenticated 401 proof. The separately scoped client, exact finite allowlist, immutable image, completed revision-5 rollout, healthy target, and five OK alarms are now recorded. The one remaining proof is the bounded valid wrong-scope 403 request.
    resolution: With explicit current-chat approval, run the bounded status-only negative-authz smoke command once and record its safe 403 result. Never use an invalid token as an authorization proof or commit credentials/token values.
  - id: platform-shell-readiness.public-rate-limit-and-ingress-policy
    severity: blocking
    path: auth.rate_limiting
    reason: The deployed workflow proves liveness only. Deployed 429 behaviour, ALB-only ingress, WAF host scope, and routing evidence have not yet been independently recorded.
    resolution: Run at most the declared window limit plus one sequential request and stop on the first 429; use read-only WAF association/listener-host-rule inspection plus a bounded public-host check. Record only aggregate counts, final status, and safe resource evidence.
  - id: platform-shell-readiness.capability-slo-and-coverage
    severity: blocking
    path: observability.slos-and-coverage
    reason: CloudWatch PromQL returns the deployed protected-route outcome counter and latency histogram, and the live coverage verifier has produced both `observed` and fail-closed `missing` verdicts. The corrected disposable revision 4 kept the application endpoint at `4318`, moved only the collector receiver to `4319`, returned a protected `200`, and then produced `missing` with `insufficient-confidence` after full-window isolation. Baseline revision 2 was restored and a two-request recovery sequence returned `observed`; the first request established the fresh cumulative counter baseline and the later request advanced it. Main-only workflow run `35764615475` then proved the governed two-point, 75-second synthetic implementation produces `observed` coverage after its five-minute arrival grace. The operator has confirmed receipt of the existing missing-coverage concern without repository retention of message content. The 28-day calculation remains insufficient-confidence below 100 eligible observations. Dashboard/runbook, capability-alarm delivery, and clock-triggered schedule proof remain unproven.
    resolution: Use the declared two-point synthetic sequence for every scheduled freshness check, record the first clock-triggered runs, calculate each SLO from its 28 one-day PromQL windows with its confidence state, and then complete dashboard/runbook and capability-alarm delivery proof. The temporary best-effort GitHub schedule must not be treated as telemetry coverage or customer-SLO proof.
  - id: platform-shell-readiness.cost-allocation-and-budget
    severity: blocking
    path: operations.budget.cost_allocation
    reason: Platform-shell resources carry the service=platform-shell tag, but the account has not yet activated that user-defined cost-allocation tag or proven the intended monthly budget and alert delivery.
    resolution: After the foundation resources exist, activate the service tag in Billing and Cost Management, allow billing data to appear, configure and verify the tag-scoped monthly budget and forecast alerts, then record the evidence without placing billing data in source control.
