blockers:
  - id: platform-shell-readiness.deferred-worker-runtime
    severity: blocking
    path: runtime.worker
    reason: The target is intentionally server-only until a declared background workload exists; no worker task definition or service has been deployed or exercised.
    resolution: When a product selects a queue-backed job workload, deploy the worker task definition and service, then record queue, dead-letter, worker health, and rollback evidence.
  - id: platform-shell-readiness.protected-dummy-route-deployment-smoke
    severity: blocking
    path: auth.route_exposure.protected_dummy_route.deployment_smoke
    reason: The deployed workflow and independent public check prove the unauthenticated 401 boundary, but deployed forbidden 403 and correctly-scoped 200 requests remain unproven.
    resolution: Acquire a controlled Cognito access token and record wrong-scope 403 plus declared-scope 200 proofs without committing credentials or token values.
  - id: platform-shell-readiness.public-rate-limit-and-ingress-policy
    severity: blocking
    path: auth.rate_limiting
    reason: The deployed workflow proves liveness only. Deployed 429 behaviour, ALB-only ingress, WAF host scope, and routing evidence have not yet been independently recorded.
    resolution: Run a bounded rate-limit and WAF/routing verification, then record safe result summaries and links to the relevant logs or metrics.
  - id: platform-shell-readiness.operational-proof
    severity: blocking
    path: proof
    reason: The service is deployed, but CloudWatch log delivery, alarm delivery, and rollback exercise evidence remain unrecorded.
    resolution: Verify a redacted operational log record, alarm destination delivery, and an explicitly governed rollback rehearsal before marking the target ready.
  - id: platform-shell-readiness.cost-allocation-and-budget
