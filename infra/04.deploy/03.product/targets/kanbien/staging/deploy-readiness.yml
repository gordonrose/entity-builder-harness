blockers:
  - id: platform-shell-readiness.github-source
    severity: blocking
    path: source
    reason: The production-bound source commit and workflow run identity are not selected for this Kanbien staging proof.
    resolution: After this workflow is merged to main and run, record the remote-main commit SHA, workflow run id, and environment protection proof before ECS deployment execution.
  - id: platform-shell-readiness.github-detail
    severity: blocking
    path: github
    reason: GitHub workflow, source policy, OIDC trust, and environment protection settings are selected, but the live deployment role still has its older direct-service policy rather than the repository's narrowed CloudFormation service-stack policy. No workflow run id or deploy proof exists yet.
    resolution: Apply the reviewed IAM inline-policy update through a separate governed AWS change, inspect the live policy, then run the selected manual GitHub workflow after the foundation stack exists.
  - id: platform-shell-readiness.image-provenance
    severity: blocking
    path: artifacts
    reason: The platform shell image has only been proven locally; the target ECR repository exists with immutable tags and scan-on-push, but no immutable deploy image digest, base digest, scan result, SBOM, or attestation is recorded.
    resolution: Build from pushed origin/main through the repeatable GitHub/OIDC path, record the immutable image digest, base digest, and scan result, then deploy ECS by digest after runtime targets are selected; keep SBOM plus attestation as blockers before public exposure.
  - id: platform-shell-readiness.runtime-target
    severity: blocking
    path: runtime
    reason: The existing service-platform ECS service remains unselected. The new platform-shell target is now defined by validated CloudFormation templates, but no task definition, ECS service, target group, host rule, or DNS record has been created.
    resolution: Review the rendered foundation change set, create the new target through the governed AWS plan, then deploy the immutable image-digest service stack. Keep the worker slot deferred until an app-declared background workload exists.
  - id: platform-shell-readiness.aws-detail
    severity: blocking
    path: aws
    reason: The existing staging cluster, ALB, certificate, ECR repository, and machine Cognito configuration are confirmed, but platform-shell service security, target group, DNS/host route, log group, alarms, and creation proof do not exist.
    resolution: Select and create the platform-shell ECS/ALB runtime target through a governed AWS change plan, then record creation and inspection proof.
  - id: platform-shell-readiness.smoke-proof
    severity: blocking
    path: proof
    reason: A current read-only inspection confirms no platform-shell workload or operational delivery resources exist. Deployment smoke, logs/metrics proof, DNS/routing proof, dummy route proof, and rollback proof require the selected runtime target to be created.
    resolution: Complete target inspection, deploy through the governed workflow, verify health and dummy app behavior, and record rollback proof.
  - id: platform-shell-readiness.protected-dummy-route-deployment-smoke
    severity: blocking
    path: auth.route_exposure.protected_dummy_route.deployment_smoke
    reason: Local server tests prove 401, 403, and success paths, but deployed protected dummy-route smoke proof does not exist yet.
    resolution: After the smoke app and staging target are deployed, record deployment smoke proof for unauthenticated, forbidden, and authorized requests.
  - id: platform-shell-readiness.public-rate-limit-and-ingress-policy
    severity: blocking
    path: auth.rate_limiting
    reason: The shared DynamoDB limiter, ALB-only client-address resolver, explicit transport limits, and host-scoped WAF template now have local proof. They have no deployed infrastructure, negative rate-limit proof, or reviewed shared-ALB change set.
    resolution: Review the rendered foundation change set, confirm the ALB-only security-group precondition and WAF host scope, then complete deployed rate-limit, WAF, and routing smoke evidence before public exposure.
  - id: platform-shell-readiness.cost-allocation-and-budget
    severity: blocking
    path: operations.budget.cost_allocation
    reason: Platform-shell resources carry the service=platform-shell tag, but the account has not yet activated that user-defined cost-allocation tag or proven the intended monthly budget and alert delivery.
    resolution: After the foundation resources exist, activate the service tag in Billing and Cost Management, allow billing data to appear, configure and verify the tag-scoped monthly budget and forecast alerts, then record the evidence without placing billing data in source control.
