#   layer: 04.deploy
#   domain: infra.ci-cd
#   disciplines:
#   - security
#   - sre
#   - architecture
#   kind: cloudformation-template
#   purpose: Deploy an immutable platform-shell image digest into the dedicated Kanbien staging ECS Fargate service.
#   portability:
#     class: target-specific
#     targets:
#     - kanbien/staging
#   used_by:
#   - id: aws.plan.kanbien-staging-platform-shell-initial-deployment
#     path: docs/aws/kanbien-staging-platform-shell-initial-deployment-plan.md

AWSTemplateFormatVersion: "2010-09-09"
Description: ECS Fargate service for the Kanbien staging platform shell.

Parameters:
  FoundationStackName:
    Type: String
    Default: kanbien-staging-platform-shell-foundation
    Description: Name of the foundation stack that owns the service dependencies.
  ClusterArn:
    Type: String
    Default: arn:aws:ecs:eu-west-1:337159794548:cluster/kanbien-staging
    Description: Existing ECS cluster ARN.
  ServiceName:
    Type: String
    Default: kanbien-staging-platform-shell
  ImageUri:
    Type: String
    AllowedPattern: ^.+@sha256:[0-9a-f]{64}$
    ConstraintDescription: ImageUri must be an immutable repository@sha256 digest reference.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 3
  WorkerDesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 1
    Description: Normal steady state is zero; a bounded worker proof temporarily scales this service to one task and returns it to zero.
  Cpu:
    Type: String
    Default: "512"
    AllowedValues:
      - "512"
  Memory:
    Type: String
    Default: "1024"
    AllowedValues:
      - "1024"

Resources:
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref ServiceName
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn:
        Fn::ImportValue: !Sub ${FoundationStackName}-TaskExecutionRoleArn
      TaskRoleArn:
        Fn::ImportValue: !Sub ${FoundationStackName}-TaskRoleArn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: platform-shell
          Image: !Ref ImageUri
          Essential: true
          ReadonlyRootFilesystem: true
          Cpu: 384
          MemoryReservation: 512
          StopTimeout: 30
          DependsOn:
            - ContainerName: otel-collector
              Condition: START
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: HOST
              Value: 0.0.0.0
            - Name: PORT
              Value: "3000"
            - Name: PLATFORM_DEPLOYMENT_EXPOSURE
              Value: public
            - Name: PLATFORM_AUTH_PROVIDER
              Value: cognito
            - Name: PLATFORM_AUTH_COGNITO_REGION
              Value: eu-west-1
            - Name: PLATFORM_AUTH_COGNITO_USER_POOL_ID
              Value: eu-west-1_EQaXioA1n
            - Name: PLATFORM_AUTH_COGNITO_APP_CLIENT_ID
              Value: 4n7kuqstbvb97ur3btbur8afjt
            - Name: PLATFORM_AUTH_COGNITO_ADDITIONAL_APP_CLIENT_IDS
              Value: '["15po9eg4hgknb2pi2d1bdfhdds"]'
            - Name: PLATFORM_AUTHZ_SCOPE_PERMISSIONS
              Value: '{"platform-shell/smoke.read":["platform-smoke.smoke:read"]}'
            - Name: PLATFORM_CORS_ALLOWLIST
              Value: https://staging.platform.kanbien.com
            - Name: PLATFORM_HEALTH_LIVEZ_EXPOSURE
              Value: public
            - Name: PLATFORM_HEALTH_READYZ_EXPOSURE
              Value: authenticated
            - Name: PLATFORM_RATE_LIMIT_PROVIDER
              Value: dynamodb
            - Name: PLATFORM_RATE_LIMIT_DYNAMODB_TABLE
              Value:
                Fn::ImportValue: !Sub ${FoundationStackName}-RateLimitTableName
            - Name: PLATFORM_RATE_LIMIT_DYNAMODB_REGION
              Value: eu-west-1
            - Name: PLATFORM_RATE_LIMIT_LIMIT
              Value: "120"
            - Name: PLATFORM_RATE_LIMIT_WINDOW_MS
              Value: "60000"
            - Name: PLATFORM_TRUSTED_INGRESS_MODE
              Value: alb-security-group-only
            - Name: PLATFORM_SERVER_MAX_REQUEST_BODY_BYTES
              Value: "1048576"
            - Name: PLATFORM_SERVER_MAX_HEADER_BYTES
              Value: "16384"
            - Name: PLATFORM_SERVER_MAX_HEADERS_COUNT
              Value: "100"
            - Name: PLATFORM_SERVER_HEADERS_TIMEOUT_MS
              Value: "10000"
            - Name: PLATFORM_SERVER_REQUEST_TIMEOUT_MS
              Value: "30000"
            - Name: PLATFORM_SERVER_KEEP_ALIVE_TIMEOUT_MS
              Value: "5000"
            - Name: PLATFORM_SERVER_HANDLER_TIMEOUT_MS
              Value: "30000"
            - Name: PLATFORM_SERVER_SHUTDOWN_DRAIN_TIMEOUT_MS
              Value: "30000"
            - Name: PLATFORM_SERVER_MAX_CONCURRENT_REQUESTS
              Value: "100"
            - Name: PLATFORM_SERVER_MAX_REQUESTS_PER_SOCKET
              Value: "1000"
            - Name: PLATFORM_SMOKE_APP_NAME
              Value: Kanbien Platform Smoke
            - Name: PLATFORM_OBSERVABILITY_METRICS_PROVIDER
              Value: cloudwatch-otel
            - Name: PLATFORM_OBSERVABILITY_METRICS_ENDPOINT
              Value: http://127.0.0.1:4318/v1/metrics
            - Name: PLATFORM_OBSERVABILITY_METRICS_REGION
              Value: eu-west-1
            - Name: PLATFORM_OBSERVABILITY_SERVICE_NAME
              Value: kanbien-staging-platform-shell
            - Name: PLATFORM_OBSERVABILITY_DEPLOYMENT_ENVIRONMENT
              Value: staging
            - Name: PLATFORM_OBSERVABILITY_EXPORT_INTERVAL_MS
              Value: "60000"
            - Name: PLATFORM_OBSERVABILITY_EXPORT_TIMEOUT_MS
              Value: "10000"
            - Name: PLATFORM_OBSERVABILITY_METRIC_SERIES_JSON
              Value: '[{"sourceName":"platform.server.request.outcome","sourceKind":"counter","sourceUnit":"count","instrumentName":"kanbien.platform.server.request.outcome","description":"Completed protected platform-smoke read requests by approved outcome.","allowedLabelNames":["capability","action","execution_context","http_method","http_status_code","outcome","error_class"],"cardinalityLimit":512},{"sourceName":"platform.server.request_response_latency","sourceKind":"timer","sourceUnit":"ms","instrumentName":"kanbien.platform.server.request.duration","description":"Protected platform-smoke read request and response latency in milliseconds.","allowedLabelNames":["capability","action","execution_context","http_method","http_status_code","outcome","error_class"],"cardinalityLimit":512,"histogramBucketBoundaries":[50,100,200,300,500,750,1000,2500,5000,10000,30000]}]'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub ${FoundationStackName}-LogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: platform-shell
          HealthCheck:
            Command:
              - CMD
              - /nodejs/bin/node
              - -e
              - "fetch('http://127.0.0.1:3000/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
        - Name: otel-collector
          Image: public.ecr.aws/aws-observability/aws-otel-collector@sha256:198e84d58236b3885919e721040b90dce29dec557783ff0fa0956f7ccc78f625
          Essential: true
          ReadonlyRootFilesystem: true
          Cpu: 128
          MemoryReservation: 256
          StopTimeout: 30
          Environment:
            - Name: AWS_REGION
              Value: eu-west-1
          Secrets:
            - Name: AOT_CONFIG_CONTENT
              ValueFrom:
                Fn::ImportValue: !Sub ${FoundationStackName}-OtelCollectorConfigurationParameterArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub ${FoundationStackName}-OtelCollectorLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: otel-collector
      Tags:
        - Key: service
          Value: platform-shell
        - Key: environment
          Value: staging
        - Key: managed-by
          Value: cloudformation

  Service:
    Type: AWS::ECS::Service
    DependsOn: TaskDefinition
    Properties:
      ServiceName: !Ref ServiceName
      Cluster: !Ref ClusterArn
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableExecuteCommand: false
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      HealthCheckGracePeriodSeconds: 30
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub ${FoundationStackName}-ServiceSecurityGroupId
          Subnets: !Split
            - ","
            - Fn::ImportValue: !Sub ${FoundationStackName}-PublicSubnetIdsCsv
      LoadBalancers:
        - ContainerName: platform-shell
          ContainerPort: 3000
          TargetGroupArn:
            Fn::ImportValue: !Sub ${FoundationStackName}-TargetGroupArn
      TaskDefinition: !Ref TaskDefinition
      Tags:
        - Key: service
          Value: platform-shell
        - Key: environment
          Value: staging
        - Key: managed-by
          Value: cloudformation

  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: kanbien-staging-platform-shell-worker
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      ExecutionRoleArn:
        Fn::ImportValue: !Sub ${FoundationStackName}-TaskExecutionRoleArn
      TaskRoleArn:
        Fn::ImportValue: !Sub ${FoundationStackName}-WorkerTaskRoleArn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: platform-shell-worker
          Image: !Ref ImageUri
          Command:
            - .cache/platform-shell-image-build/infra/04.deploy/03.product/entrypoints/kanbien-platform-worker.main.js
          Essential: true
          ReadonlyRootFilesystem: true
          Cpu: 384
          MemoryReservation: 512
          StopTimeout: 30
          DependsOn:
            - ContainerName: otel-collector
              Condition: START
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PLATFORM_WORKER_QUEUE_PROVIDER
              Value: sqs
            - Name: PLATFORM_WORKER_SQS_QUEUE_URL
              Value:
                Fn::ImportValue: !Sub ${FoundationStackName}-WorkerQueueUrl
            - Name: PLATFORM_WORKER_SQS_REGION
              Value: eu-west-1
            - Name: PLATFORM_WORKER_SQS_WAIT_TIME_SECONDS
              Value: "20"
            - Name: PLATFORM_WORKER_SQS_VISIBILITY_TIMEOUT_SECONDS
              Value: "30"
            - Name: PLATFORM_WORKER_POLL_FAILURE_BACKOFF_MS
              Value: "1000"
            - Name: PLATFORM_SMOKE_APP_NAME
              Value: Kanbien Platform Smoke
            - Name: PLATFORM_OBSERVABILITY_METRICS_PROVIDER
              Value: cloudwatch-otel
            - Name: PLATFORM_OBSERVABILITY_METRICS_ENDPOINT
              Value: http://127.0.0.1:4318/v1/metrics
            - Name: PLATFORM_OBSERVABILITY_METRICS_REGION
              Value: eu-west-1
            - Name: PLATFORM_OBSERVABILITY_SERVICE_NAME
              Value: kanbien-staging-platform-shell-worker
            - Name: PLATFORM_OBSERVABILITY_DEPLOYMENT_ENVIRONMENT
              Value: staging
            - Name: PLATFORM_OBSERVABILITY_EXPORT_INTERVAL_MS
              Value: "60000"
            - Name: PLATFORM_OBSERVABILITY_EXPORT_TIMEOUT_MS
              Value: "10000"
            - Name: PLATFORM_OBSERVABILITY_METRIC_SERIES_JSON
              Value: '[{"sourceName":"platform.worker.job.delivery","sourceKind":"counter","sourceUnit":"count","instrumentName":"kanbien.platform.worker.job.delivery","description":"Completed platform-smoke worker job deliveries by approved outcome.","allowedLabelNames":["capability","action","execution_context","job_delivery_disposition","outcome","error_class"],"cardinalityLimit":512},{"sourceName":"platform.worker.job.execution_latency","sourceKind":"timer","sourceUnit":"ms","instrumentName":"kanbien.platform.worker.job.execution.duration","description":"Platform-smoke worker job execution latency in milliseconds.","allowedLabelNames":["capability","action","execution_context","job_delivery_disposition","outcome","error_class"],"cardinalityLimit":512,"histogramBucketBoundaries":[50,100,200,300,500,750,1000,2500,5000,10000,30000]}]'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub ${FoundationStackName}-WorkerLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: platform-shell-worker
        - Name: otel-collector
          Image: public.ecr.aws/aws-observability/aws-otel-collector@sha256:198e84d58236b3885919e721040b90dce29dec557783ff0fa0956f7ccc78f625
          Essential: true
          ReadonlyRootFilesystem: true
          Cpu: 128
          MemoryReservation: 256
          StopTimeout: 30
          Environment:
            - Name: AWS_REGION
              Value: eu-west-1
          Secrets:
            - Name: AOT_CONFIG_CONTENT
              ValueFrom:
                Fn::ImportValue: !Sub ${FoundationStackName}-OtelCollectorConfigurationParameterArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group:
                Fn::ImportValue: !Sub ${FoundationStackName}-WorkerOtelCollectorLogGroupName
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker-otel-collector
      Tags:
        - Key: service
          Value: platform-shell
        - Key: component
          Value: worker
        - Key: environment
          Value: staging
        - Key: managed-by
          Value: cloudformation

  WorkerService:
    Type: AWS::ECS::Service
    DependsOn: WorkerTaskDefinition
    Properties:
      ServiceName: kanbien-staging-platform-shell-worker
      Cluster: !Ref ClusterArn
      DesiredCount: !Ref WorkerDesiredCount
      LaunchType: FARGATE
      PlatformVersion: LATEST
      EnableExecuteCommand: false
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - Fn::ImportValue: !Sub ${FoundationStackName}-WorkerSecurityGroupId
          Subnets: !Split
            - ","
            - Fn::ImportValue: !Sub ${FoundationStackName}-PublicSubnetIdsCsv
      TaskDefinition: !Ref WorkerTaskDefinition
      Tags:
        - Key: service
          Value: platform-shell
        - Key: component
          Value: worker
        - Key: environment
          Value: staging
        - Key: managed-by
          Value: cloudformation

  EcsRunningCountAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: Service
    Properties:
      AlarmName: kanbien-staging-platform-shell-ecs-running-count-mismatch
      AlarmDescription: The platform-shell ECS service has fewer running tasks than desired.
      Namespace: ECS/ContainerInsights
      MetricName: RunningTaskCount
      Statistic: Minimum
      Unit: Count
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      ComparisonOperator: LessThanThreshold
      Threshold: !Ref DesiredCount
      TreatMissingData: breaching
      Dimensions:
        - Name: ClusterName
          Value: !Select [1, !Split ["/", !Ref ClusterArn]]
        - Name: ServiceName
          Value: !Ref ServiceName
      AlarmActions:
        - Fn::ImportValue: !Sub ${FoundationStackName}-AlarmTopicArn
      Tags:
        - Key: service
          Value: platform-shell
        - Key: environment
          Value: staging
        - Key: managed-by
          Value: cloudformation

  EcsHighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: Service
    Properties:
      AlarmName: kanbien-staging-platform-shell-ecs-high-cpu
      AlarmDescription: The platform-shell ECS service has sustained high CPU utilisation.
      Namespace: AWS/ECS
      MetricName: CPUUtilization
      Statistic: Average
      Unit: Percent
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 80
      TreatMissingData: notBreaching
      Dimensions:
        - Name: ClusterName
          Value: !Select [1, !Split ["/", !Ref ClusterArn]]
        - Name: ServiceName
          Value: !Ref ServiceName
      AlarmActions:
        - Fn::ImportValue: !Sub ${FoundationStackName}-AlarmTopicArn
      Tags:
        - Key: service
          Value: platform-shell
        - Key: environment
          Value: staging
        - Key: managed-by
          Value: cloudformation

  EcsHighMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    DependsOn: Service
    Properties:
      AlarmName: kanbien-staging-platform-shell-ecs-high-memory
      AlarmDescription: The platform-shell ECS service has sustained high memory utilisation.
      Namespace: AWS/ECS
      MetricName: MemoryUtilization
      Statistic: Average
      Unit: Percent
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 80
      TreatMissingData: notBreaching
      Dimensions:
        - Name: ClusterName
          Value: !Select [1, !Split ["/", !Ref ClusterArn]]
        - Name: ServiceName
          Value: !Ref ServiceName
      AlarmActions:
        - Fn::ImportValue: !Sub ${FoundationStackName}-AlarmTopicArn
      Tags:
        - Key: service
          Value: platform-shell
        - Key: environment
          Value: staging
        - Key: managed-by
          Value: cloudformation

Outputs:
  ServiceArn:
    Value: !Ref Service
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  WorkerServiceArn:
    Value: !Ref WorkerService
  WorkerTaskDefinitionArn:
    Value: !Ref WorkerTaskDefinition
