schema: deploy/cloudformation-composition/v1
description: >-
  Compose one deployable CloudFormation foundation template from focused source
  units. The rendered result remains one stack; this manifest is not passed to
  AWS directly.
fragments:
  - foundation/template.yml
  - foundation/logging.yml
  - foundation/rate-limiting.yml
  - foundation/workload-iam.yml
  - foundation/public-ingress.yml
  - foundation/edge-protection.yml
  - foundation/alerting.yml
  - foundation/outputs.yml
