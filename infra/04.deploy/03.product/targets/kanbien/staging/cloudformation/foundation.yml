# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: infra.04-deploy.03-product.targets.kanbien.staging.cloudformation.foundation
#   version: 1
#   status: draft
#   layer: 04.deploy
#   domain: infra.ci-cd
#   disciplines:
#   - security
#   - sre
#   - architecture
#   kind: cloudformation-template
#   purpose: Create the dedicated security, routing, rate-limit, logging, alerting, and IAM foundation for the Kanbien staging platform shell.
#   portability:
#     class: target-specific
#     targets:
#     - kanbien/staging
#   used_by:
#   - id: aws.plan.kanbien-staging-platform-shell-initial-deployment
#     path: docs/aws/kanbien-staging-platform-shell-initial-deployment-plan.md

AWSTemplateFormatVersion: "2010-09-09"
Description: Dedicated foundation for the Kanbien staging platform-shell ECS Fargate service.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC that contains the selected ECS cluster and ALB.
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: ^(?:[0-9]{1,3}\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$
    Description: Existing VPC CIDR used only for outbound DNS resolution.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Existing subnets where the Fargate task receives a public address for low-cost outbound access.
  ExistingAlbArn:
    Type: String
    Description: Existing shared public ALB ARN. This stack never creates or replaces it.
  ExistingAlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Existing shared ALB security group allowed to reach the service task.
  ExistingHttpsListenerArn:
    Type: String
    Description: Existing HTTPS listener ARN that receives the new host-specific rule.
  ExistingAlbDnsName:
    Type: String
    Description: Existing ALB DNS name used by the Route 53 alias record.
  ExistingAlbCanonicalHostedZoneId:
    Type: String
    Description: Canonical hosted-zone ID for the existing ALB alias target.
  HostedZoneId:
    Type: String
    Description: Existing Route 53 hosted-zone ID for kanbien.com.
  HostName:
    Type: String
    Default: staging.platform.kanbien.com
    AllowedPattern: ^[a-z0-9.-]+$
    Description: New public hostname owned by this stack and the only host inspected by its WAF rules.
  ListenerRulePriority:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 50000
    Description: Unused priority on the shared HTTPS listener, inspected immediately before apply.
  AlarmEmail:
    Type: String
    Description: Email address that receives alarm subscription confirmation and operational alerts.
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
    Description: Short operational-log retention; audit retention is a separate future policy.

Resources:
  PlatformShellLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /ecs/kanbien-staging-platform-shell
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: service
          Value: platform-shell
        - Key: environment
          Value: staging
        - Key: managed-by
          Value: cloudformation

  RateLimitTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: kanbien-staging-platform-shell-rate-limits
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: keyHash
          AttributeType: S
        - AttributeName: windowStartedAtMs
          AttributeType: N
      KeySchema:
        - AttributeName: keyHash
          KeyType: HASH
        - AttributeName: windowStartedAtMs
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      Tags:
        - Key: service
          Value: platform-shell
        - Key: environment
          Value: staging
        - Key: data-classification
          Value: security-operational-hash
        - Key: managed-by
          Value: cloudformation

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kanbien-staging-platform-shell-task-execution
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Tags:
        - Key: service
          Value: platform-shell
        - Key: environment
          Value: staging
        - Key: managed-by
          Value: cloudformation

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kanbien-staging-platform-shell-task
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: platform-shell-shared-rate-limit-counter
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: UpdateOnlyThePlatformShellRateLimitTable
                Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                Resource: !GetAtt RateLimitTable.Arn
      Tags:
        - Key: service
          Value: platform-shell
        - Key: environment
          Value: staging
        - Key: managed-by
          Value: cloudformation

  ServiceDeploymentExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kanbien-staging-platform-shell-service-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: deploy-only-the-platform-shell-ecs-service
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManagePlatformShellTaskDefinitionsAndService
                Effect: Allow
                Action:
                  - ecs:CreateService
                  - ecs:DeleteService
                  - ecs:DeregisterTaskDefinition
                  - ecs:DescribeClusters
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                  - ecs:RegisterTaskDefinition
                  - ecs:TagResource
                  - ecs:UpdateService
                Resource: "*"
              - Sid: InspectSelectedLoadBalancerTargetGroup
                Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeTargetGroups
                Resource: "*"
              - Sid: PassOnlyThePlatformShellTaskRolesToEcsTasks
                Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
      Tags:
        - Key: service
          Value: platform-shell
        - Key: environment
          Value: staging
        - Key: managed-by
          Value: cloudformation

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Only the existing staging ALB may reach the platform-shell task on its HTTP port.
      GroupName: kanbien-staging-platform-shell-service
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: HTTPS terminates at the shared ALB; task traffic is ALB-only.
          IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref ExistingAlbSecurityGroupId
      SecurityGroupEgress:
        - Description: TLS egress for ECR image pulls, CloudWatch Logs, DynamoDB, Cognito JWKS, and AWS APIs.
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
        - Description: UDP DNS only to the VPC resolver address range.
          IpProtocol: udp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcCidr
        - Description: TCP DNS fallback only to the VPC resolver address range.
          IpProtocol: tcp
          FromPort: 53
          ToPort: 53
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: kanbien-staging-platform-shell-service
        - Key: service
          Value: platform-shell
        - Key: environment
          Value: staging
        - Key: managed-by
          Value: cloudformation

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: kanbien-stg-platform-shell
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      ProtocolVersion: HTTP1
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /livez
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
      Tags:
        - Key: service
          Value: platform-shell
        - Key: environment
          Value: staging
        - Key: managed-by
          Value: cloudformation

  HostRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref ExistingHttpsListenerArn
      Priority: !Ref ListenerRulePriority
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - !Ref HostName
      Actions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  DnsAlias:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref HostName
      Type: A
      AliasTarget:
        DNSName: !Ref ExistingAlbDnsName
        HostedZoneId: !Ref ExistingAlbCanonicalHostedZoneId
        EvaluateTargetHealth: true

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: kanbien-staging-platform-shell
      Scope: REGIONAL
      DefaultAction:
        Allow: {}
      Description: WAF rules scoped only to the new staging.platform.kanbien.com host on the shared staging ALB.
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: kanbien-staging-platform-shell
        SampledRequestsEnabled: true
      Rules:
        - Name: aws-ip-reputation-on-platform-host
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch:
                    SingleHeader:
                      Name: host
                  PositionalConstraint: EXACTLY
                  SearchString: !Ref HostName
                  TextTransformations:
                    - Priority: 0
                      Type: LOWERCASE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: platform-shell-ip-reputation
            SampledRequestsEnabled: true
        - Name: aws-common-rules-on-platform-host
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch:
                    SingleHeader:
                      Name: host
                  PositionalConstraint: EXACTLY
                  SearchString: !Ref HostName
                  TextTransformations:
                    - Priority: 0
                      Type: LOWERCASE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: platform-shell-common-rules
            SampledRequestsEnabled: true
        - Name: aws-known-bad-inputs-on-platform-host
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch:
                    SingleHeader:
                      Name: host
                  PositionalConstraint: EXACTLY
                  SearchString: !Ref HostName
                  TextTransformations:
                    - Priority: 0
                      Type: LOWERCASE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: platform-shell-known-bad-inputs
            SampledRequestsEnabled: true
        - Name: ip-rate-limit-on-platform-host
          Priority: 3
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 300
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch:
                    SingleHeader:
                      Name: host
                  PositionalConstraint: EXACTLY
                  SearchString: !Ref HostName
                  TextTransformations:
                    - Priority: 0
                      Type: LOWERCASE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: platform-shell-ip-rate-limit
            SampledRequestsEnabled: true

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref ExistingAlbArn
      WebACLArn: !GetAtt WebAcl.Arn

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: kanbien-staging-platform-shell-alarms
      DisplayName: Kanbien staging platform shell alarms
      Tags:
        - Key: service
          Value: platform-shell
        - Key: environment
          Value: staging
        - Key: managed-by
          Value: cloudformation

  AlarmTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref AlarmTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudWatchAlarmsToPublish
            Effect: Allow
            Principal:
              Service: cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref AlarmTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  UnhealthyTargetAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kanbien-staging-platform-shell-unhealthy-targets
      AlarmDescription: The platform-shell target group has no healthy targets.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      ComparisonOperator: LessThanThreshold
      Threshold: 1
      TreatMissingData: breaching
      Dimensions:
        - Name: LoadBalancer
          Value: !Select [1, !Split ["loadbalancer/", !Ref ExistingAlbArn]]
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      AlarmActions:
        - !Ref AlarmTopic

  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kanbien-staging-platform-shell-target-5xx
      AlarmDescription: The platform-shell target group returned server errors.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Threshold: 5
      TreatMissingData: notBreaching
      Dimensions:
        - Name: LoadBalancer
          Value: !Select [1, !Split ["loadbalancer/", !Ref ExistingAlbArn]]
        - Name: TargetGroup
          Value: !GetAtt TargetGroup.TargetGroupFullName
      AlarmActions:
        - !Ref AlarmTopic

Outputs:
  LogGroupName:
    Value: !Ref PlatformShellLogGroup
    Export:
      Name: !Sub ${AWS::StackName}-LogGroupName
  RateLimitTableName:
    Value: !Ref RateLimitTable
    Export:
      Name: !Sub ${AWS::StackName}-RateLimitTableName
  RateLimitTableArn:
    Value: !GetAtt RateLimitTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-RateLimitTableArn
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-TaskExecutionRoleArn
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-TaskRoleArn
  ServiceDeploymentExecutionRoleArn:
    Value: !GetAtt ServiceDeploymentExecutionRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-ServiceDeploymentExecutionRoleArn
  ServiceSecurityGroupId:
    Value: !Ref ServiceSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-ServiceSecurityGroupId
  TargetGroupArn:
    Value: !Ref TargetGroup
    Export:
      Name: !Sub ${AWS::StackName}-TargetGroupArn
  PublicSubnetIdsCsv:
    Value: !Join [",", !Ref PublicSubnetIds]
    Export:
      Name: !Sub ${AWS::StackName}-PublicSubnetIdsCsv
  HostName:
    Value: !Ref HostName
    Export:
      Name: !Sub ${AWS::StackName}-HostName
  AlarmTopicArn:
    Value: !Ref AlarmTopic
    Export:
      Name: !Sub ${AWS::StackName}-AlarmTopicArn
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
    Export:
      Name: !Sub ${AWS::StackName}-WebAclArn
