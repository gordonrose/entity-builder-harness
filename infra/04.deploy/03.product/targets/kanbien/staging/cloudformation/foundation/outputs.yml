# Values deliberately exported for the separately deployed service stack.
Outputs:
  LogGroupName:
    Value: !Ref PlatformShellLogGroup
    Export:
      Name: !Sub ${AWS::StackName}-LogGroupName
  OtelCollectorLogGroupName:
    Value: !Ref PlatformShellOtelCollectorLogGroup
    Export:
      Name: !Sub ${AWS::StackName}-OtelCollectorLogGroupName
  WorkerLogGroupName:
    Value: !Ref PlatformShellWorkerLogGroup
    Export:
      Name: !Sub ${AWS::StackName}-WorkerLogGroupName
  WorkerOtelCollectorLogGroupName:
    Value: !Ref PlatformShellWorkerOtelCollectorLogGroup
    Export:
      Name: !Sub ${AWS::StackName}-WorkerOtelCollectorLogGroupName
  RelayLogGroupName:
    Value: !Ref PlatformShellRelayLogGroup
    Export:
      Name: !Sub ${AWS::StackName}-RelayLogGroupName
  RelayOtelCollectorLogGroupName:
    Value: !Ref PlatformShellRelayOtelCollectorLogGroup
    Export:
      Name: !Sub ${AWS::StackName}-RelayOtelCollectorLogGroupName
  OtelCollectorConfigurationParameterArn:
    Value: !GetAtt OtelCollectorConfigurationParameter.Arn
    Export:
      Name: !Sub ${AWS::StackName}-OtelCollectorConfigurationParameterArn
  RateLimitTableName:
    Value: !Ref RateLimitTable
    Export:
      Name: !Sub ${AWS::StackName}-RateLimitTableName
  RateLimitTableArn:
    Value: !GetAtt RateLimitTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-RateLimitTableArn
  PlatformPersistenceTableName:
    Value: !Ref PlatformPersistenceTable
    Export:
      Name: !Sub ${AWS::StackName}-PlatformPersistenceTableName
  PlatformPersistenceTableArn:
    Value: !GetAtt PlatformPersistenceTable.Arn
    Export:
      Name: !Sub ${AWS::StackName}-PlatformPersistenceTableArn
  PlatformPersistenceOutboxDueIndexName:
    Value: OutboxDueIndex
    Export:
      Name: !Sub ${AWS::StackName}-PlatformPersistenceOutboxDueIndexName
  PlatformPersistenceLineageCauseIndexName:
    Value: LineageCauseIndex
    Export:
      Name: !Sub ${AWS::StackName}-PlatformPersistenceLineageCauseIndexName
  TaskExecutionRoleArn:
    Value: !GetAtt TaskExecutionRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-TaskExecutionRoleArn
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-TaskRoleArn
  WorkerTaskRoleArn:
    Value: !GetAtt WorkerTaskRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-WorkerTaskRoleArn
  RelayTaskRoleArn:
    Value: !GetAtt RelayTaskRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-RelayTaskRoleArn
  ServiceDeploymentExecutionRoleArn:
    Value: !GetAtt ServiceDeploymentExecutionRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-ServiceDeploymentExecutionRoleArn
  ServiceSecurityGroupId:
    Value: !Ref ServiceSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-ServiceSecurityGroupId
  WorkerSecurityGroupId:
    Value: !Ref WorkerSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-WorkerSecurityGroupId
  RelaySecurityGroupId:
    Value: !Ref RelaySecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-RelaySecurityGroupId
  WorkerQueueUrl:
    Value: !Ref WorkerQueue
    Export:
      Name: !Sub ${AWS::StackName}-WorkerQueueUrl
  WorkerQueueArn:
    Value: !GetAtt WorkerQueue.Arn
    Export:
      Name: !Sub ${AWS::StackName}-WorkerQueueArn
  WorkerDeadLetterQueueUrl:
    Value: !Ref WorkerDeadLetterQueue
    Export:
      Name: !Sub ${AWS::StackName}-WorkerDeadLetterQueueUrl
  WorkerDeadLetterQueueArn:
    Value: !GetAtt WorkerDeadLetterQueue.Arn
    Export:
      Name: !Sub ${AWS::StackName}-WorkerDeadLetterQueueArn
  TargetGroupArn:
    Value: !Ref TargetGroup
    Export:
      Name: !Sub ${AWS::StackName}-TargetGroupArn
  PublicSubnetIdsCsv:
    Value: !Join [",", !Ref PublicSubnetIds]
    Export:
      Name: !Sub ${AWS::StackName}-PublicSubnetIdsCsv
  HostName:
    Value: !Ref HostName
    Export:
      Name: !Sub ${AWS::StackName}-HostName
  AlarmTopicArn:
    Value: !Ref AlarmTopic
    Export:
      Name: !Sub ${AWS::StackName}-AlarmTopicArn
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
    Export:
      Name: !Sub ${AWS::StackName}-WebAclArn
  PlatformHostnameCertificateArn:
    Value: !Ref PlatformHostnameCertificate
    Export:
      Name: !Sub ${AWS::StackName}-PlatformHostnameCertificateArn
