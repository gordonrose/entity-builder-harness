#   purpose: Declare the provider-neutral execution graph that a published Kanbien staging candidate must prove before public promotion or relational work.
#   portability:
#     class: internal
#     targets:
#     - kanbien/staging
#   used_by:
#   - id: deploy.script.kanbien-staging-candidate-execution-preflight
#     path: scripts/04.deploy/run-platform-shell-candidate-execution-preflight/script.py
schema: operational-realization-contract/v1
id: kanbien-staging-candidate-execution-preflight
version: 1
provider_boundary: normalized-facts-only

artifacts:
  - id: candidate-runtime-artifact
    immutable_reference_mode: runtime-bound-sha256
    entrypoint: platform-server-entrypoint
    assertions:
      - target-platform-reviewed
      - source-revision-bound
      - runtime-payload-reviewed
      - entrypoint-executable

identities:
  - id: candidate-execution-identity
    permissions:
      - retrieve-artifact
      - read-runtime-configuration-references
      - emit-safe-telemetry

configuration_inputs:
  - id: candidate-runtime-configuration
    required_fields:
      - runtime-configuration-reference
      - runtime-secret-reference
    optional_fields: []
    sensitivity: secret-reference-only

connections:
  - id: candidate-governance-connection
    source: candidate-preflight-runner
    destination: request-governance-state
    transport_security: verified
  - id: candidate-application-connection
    source: candidate-preflight-runner
    destination: application-state
    transport_security: verified

state_stores:
  - id: request-governance-state
    semantics:
      - atomic-rate-governance-reviewed
      - isolation-boundary-reviewed
  - id: application-state
    semantics:
      - tenant-boundary-reviewed
      - transaction-boundary-reviewed

async_channels: []

observability_profiles:
  - id: candidate-preflight-observability
    required_facts:
      - outcome-category
      - execution-health
      - cleanup-verdict

recovery_plans:
  - id: candidate-preflight-recovery
    entry_condition: prior-attempt-reached-failed-or-stopped-terminal-state
    cleanup: stop-private-execution-and-verify-cleanup
    rollback: retain-active-public-runtime-unchanged

execution_units:
  - id: candidate-preflight-runner
    artifact: candidate-runtime-artifact
    identity: candidate-execution-identity
    configuration_inputs:
      - candidate-runtime-configuration
    connections:
      - candidate-governance-connection
      - candidate-application-connection
    state_stores:
      - request-governance-state
      - application-state
    async_channels: []
    observability_profile: candidate-preflight-observability
    recovery_plan: candidate-preflight-recovery

edges:
  - {from: candidate-preflight-runner, to: candidate-runtime-artifact, purpose: executes}
  - {from: candidate-preflight-runner, to: candidate-execution-identity, purpose: assumes}
  - {from: candidate-preflight-runner, to: candidate-runtime-configuration, purpose: reads-configuration}
  - {from: candidate-preflight-runner, to: candidate-governance-connection, purpose: connects}
  - {from: candidate-governance-connection, to: request-governance-state, purpose: reaches-state}
  - {from: candidate-preflight-runner, to: request-governance-state, purpose: governs-request}
  - {from: candidate-preflight-runner, to: candidate-application-connection, purpose: connects}
  - {from: candidate-application-connection, to: application-state, purpose: reaches-state}
  - {from: candidate-preflight-runner, to: application-state, purpose: prepares-state-boundary}
  - {from: candidate-preflight-runner, to: candidate-preflight-observability, purpose: emits-safe-telemetry}
  - {from: candidate-preflight-runner, to: candidate-preflight-recovery, purpose: recovers}

lifecycle:
  states: [prepared, running, succeeded, failed, stopped]
  terminal_states: [succeeded, failed, stopped]
  transitions:
    - {from: prepared, to: running}
    - {from: running, to: succeeded}
    - {from: running, to: failed}
    - {from: running, to: stopped}
  retry:
    mode: reviewed-recovery-only
    requires_new_label: true
    maximum_attempts: 1
    permitted_from: [failed, stopped]

change_shape:
  reviewed_change_summary_required: true
  allowed_operation_classes: [create, update]
  forbidden_operation_classes: [delete, replace, broaden-permission]

assumptions:
  - id: candidate-runtime-payload
    statement: payload-and-entrypoint-are-proven-in-a-disposable-environment
    required_proof: locally-proven
    actual_proof: locally-proven
  - id: candidate-image-platform
    statement: image-platform-and-source-revision-are-verified-before-target-preflight
    required_proof: live-read-proven
    actual_proof: live-read-proven

gates:
  - {id: source, prerequisites: [], may_mutate_live_target: false, evidence: [candidate-source-check]}
  - {id: artifact, prerequisites: [source], may_mutate_live_target: false, evidence: [candidate-artifact-check]}
  - {id: semantic-integration, prerequisites: [source, artifact], may_mutate_live_target: false, evidence: [candidate-semantic-check]}
  - {id: live-read, prerequisites: [source, artifact, semantic-integration], may_mutate_live_target: false, evidence: [candidate-live-read-check]}
  - {id: change-set, prerequisites: [source, artifact, semantic-integration, live-read], may_mutate_live_target: false, evidence: [candidate-change-shape-check]}
  - {id: execution-preflight, prerequisites: [source, artifact, semantic-integration, live-read, change-set], may_mutate_live_target: false, evidence: [candidate-execution-preflight-check]}
  - {id: controlled-execution, prerequisites: [source, artifact, semantic-integration, live-read, change-set, execution-preflight], may_mutate_live_target: true, evidence: [candidate-controlled-execution-check]}
  - {id: recovery, prerequisites: [source, artifact, semantic-integration, live-read, change-set, execution-preflight, controlled-execution], may_mutate_live_target: true, evidence: [candidate-recovery-check]}
