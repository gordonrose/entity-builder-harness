  alarms:
    - id: alb-unhealthy-targets
      purpose: Detect that no healthy platform-shell target is available behind the shared ALB.
      signal:
        namespace: AWS/ApplicationELB
        metric: HealthyHostCount
        dimensions:
          - name: LoadBalancer
            resolver: existing-alb-resource-suffix
          - name: TargetGroup
            resolver: foundation-target-group-full-name
      condition:
        statistic: Minimum
        comparison_operator: LessThanThreshold
        threshold:
          value: 1
        unit: Count
      evaluation:
        period_seconds: 60
        evaluation_periods: 2
        datapoints_to_alarm: 2
        treat_missing_data: breaching
      response:
        severity: critical
        alarm_destination: foundation-alarm-topic
        runbook: docs/aws/runbooks/platform-shell-staging-alarms.md
      implementation:
        stack: foundation
        logical_resource: UnhealthyTargetAlarm
        alarm_name: kanbien-staging-platform-shell-unhealthy-targets
        alarm_description: The platform-shell target group has no healthy targets.
    - id: alb-5xx-spike
      purpose: Detect a sustained burst of server errors returned by the platform-shell target group.
      signal:
        namespace: AWS/ApplicationELB
        metric: HTTPCode_Target_5XX_Count
        dimensions:
          - name: LoadBalancer
            resolver: existing-alb-resource-suffix
          - name: TargetGroup
            resolver: foundation-target-group-full-name
      condition:
        statistic: Sum
        comparison_operator: GreaterThanOrEqualToThreshold
        threshold:
          value: 5
        unit: Count
      evaluation:
        period_seconds: 60
        evaluation_periods: 5
        datapoints_to_alarm: 3
        treat_missing_data: notBreaching
      response:
        severity: warning
        alarm_destination: foundation-alarm-topic
        runbook: docs/aws/runbooks/platform-shell-staging-alarms.md
      implementation:
        stack: foundation
        logical_resource: Target5xxAlarm
        alarm_name: kanbien-staging-platform-shell-target-5xx
        alarm_description: The platform-shell target group returned server errors.
    - id: ecs-running-count-mismatch
      purpose: Detect when the ECS service has fewer running tasks than its declared desired count.
      signal:
        namespace: ECS/ContainerInsights
        metric: RunningTaskCount
        dimensions:
          - name: ClusterName
            resolver: cluster-name-from-cluster-arn
          - name: ServiceName
            resolver: service-name
      condition:
        statistic: Minimum
        comparison_operator: LessThanThreshold
        threshold:
          value_source: service-desired-count
        unit: Count
      evaluation:
        period_seconds: 60
        evaluation_periods: 2
        datapoints_to_alarm: 2
        treat_missing_data: breaching
      response:
        severity: critical
        alarm_destination: foundation-alarm-topic
        runbook: docs/aws/runbooks/platform-shell-staging-alarms.md
      implementation:
        stack: service
        logical_resource: EcsRunningCountAlarm
        alarm_name: kanbien-staging-platform-shell-ecs-running-count-mismatch
        alarm_description: The platform-shell ECS service has fewer running tasks than desired.
    - id: ecs-high-cpu
      purpose: Detect sustained service CPU pressure before it becomes an availability incident.
      signal:
        namespace: AWS/ECS
        metric: CPUUtilization
        dimensions:
          - name: ClusterName
            resolver: cluster-name-from-cluster-arn
          - name: ServiceName
            resolver: service-name
      condition:
        statistic: Average
        comparison_operator: GreaterThanOrEqualToThreshold
        threshold:
          value: 80
        unit: Percent
      evaluation:
        period_seconds: 60
        evaluation_periods: 5
        datapoints_to_alarm: 3
        treat_missing_data: notBreaching
      response:
        severity: warning
        alarm_destination: foundation-alarm-topic
        runbook: docs/aws/runbooks/platform-shell-staging-alarms.md
      implementation:
        stack: service
        logical_resource: EcsHighCpuAlarm
        alarm_name: kanbien-staging-platform-shell-ecs-high-cpu
        alarm_description: The platform-shell ECS service has sustained high CPU utilisation.
    - id: ecs-high-memory
