schema: deploy/sidecar-image-contract/v1
target: kanbien-core-platform
scope: core-server-persistence
candidate_id: observability-collector
package_contract_id: core-server-persistence-observability-collector-image
program_id: kanbien-observability-collector
source:
  kind: minimal-custom-collector-build
  upstream_release:
    repository: open-telemetry/opentelemetry-collector-releases
    version: v0.163.0
    contrib_manifest_sha256: 0bd72a020e0b8414c85df56fd5dcc1ebd05f160a8bbe03f8fb2c53a1248218e8
  builder_image:
    reference: docker.io/library/golang@sha256:27f2d3b83cfc5803c8078f8e730af0f7c431bf067afaec8f60a36fb763187cba
    go_version: 1.26.10
  source_files:
    dockerfile: infra/04.deploy/03.product/image/core-server-persistence-observability-collector/Dockerfile
    component_manifest: infra/04.deploy/03.product/image/core-server-persistence-observability-collector/builder-config.yaml
  selected_components: [otlp-http-receiver, memory-limiter, batch, aws-emf-exporter, health-check]
  identity_proof: reviewed-upstream-release-manifest-and-pinned-builder-image
destination:
  repository: kanbien-core-platform/core-server
  selection: private-ecr-immutable-digest
  precondition: exact-qualified-archive-must-pass-unprivileged-scan-before-private-publication
runtime:
  configuration_source: target-owned-ssm-parameter-non-secret
  configuration_environment: AOT_CONFIG_CONTENT
  receiver: otlp-http-127-0-0-1-4318
  exporter: aws-emf-cloudwatch-logs
  application_failure_effect: bounded-telemetry-failure-only
qualification:
  required_checks: [source-identity, minimal-source-build, configuration-startup, vulnerability-scan, sbom, provenance-attestation]
  receipt_schema: deploy/package-custody-receipt/v1
