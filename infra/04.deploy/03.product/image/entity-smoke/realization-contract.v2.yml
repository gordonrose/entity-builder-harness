    purpose: "assumes"
  -
    from: "feature-verifier"
    to: "feature-verifier-settings"
    purpose: "reads-configuration"
  -
    from: "feature-verifier"
    to: "feature-verifier-private-call"
    purpose: "connects"
  -
    from: "feature-verifier-private-call"
    to: "feature-runtime"
    purpose: "invokes-private-feature"
  -
    from: "feature-verifier"
    to: "feature-safe-observations"
    purpose: "reports-safe-result"
  -
    from: "feature-verifier"
    to: "feature-explicit-recovery"
    purpose: "recovers"
lifecycle:
  states: ["prepared","running","succeeded","failed","stopped"]
  terminal_states: ["succeeded","failed","stopped"]
  transitions:
    -
      from: "prepared"
      to: "running"
    -
      from: "running"
      to: "succeeded"
    -
      from: "running"
      to: "failed"
    -
      from: "running"
      to: "stopped"
  retry:
    mode: "reviewed-recovery-only"
    requires_new_label: true
    maximum_attempts: 1
    permitted_from: ["failed","stopped"]
change_shape:
  reviewed_change_summary_required: true
  allowed_operation_classes: ["create","update"]
  forbidden_operation_classes: ["delete","replace","broaden-permission"]
assumptions:
  -
    id: "feature-private-call-topology"
    statement: "private-verifier-calls-server-without-direct-storage"
    required_proof: "declared"
    actual_proof: "declared"
  -
    id: "feature-durable-semantics"
    statement: "declared-store-semantics-require-real-engine-and-live-proof-before-acceptance"
    required_proof: "declared"
    actual_proof: "declared"
gates:
  -
    id: "source"
    prerequisites: []
    may_mutate_live_target: false
    evidence: ["entity-smoke-source-check"]
  -
    id: "artifact"
    prerequisites: ["source"]
    may_mutate_live_target: false
    evidence: ["entity-smoke-image-check"]
  -
    id: "semantic-integration"
    prerequisites: ["source","artifact"]
    may_mutate_live_target: false
    evidence: ["entity-smoke-real-engine-check"]
  -
    id: "live-read"
    prerequisites: ["source","artifact","semantic-integration"]
    may_mutate_live_target: false
    evidence: ["entity-smoke-alignment-check"]
  -
    id: "change-set"
    prerequisites: ["source","artifact","semantic-integration","live-read"]
    may_mutate_live_target: false
    evidence: ["entity-smoke-change-shape-check"]
  -
    id: "execution-preflight"
    prerequisites: ["source","artifact","semantic-integration","live-read","change-set"]
    may_mutate_live_target: false
    evidence: ["entity-smoke-execution-preflight-check"]
  -
    id: "controlled-execution"
    prerequisites: ["source","artifact","semantic-integration","live-read","change-set","execution-preflight"]
    may_mutate_live_target: true
    evidence: ["entity-smoke-controlled-execution-check"]
  -
    id: "recovery"
    prerequisites: ["source","artifact","semantic-integration","live-read","change-set","execution-preflight","controlled-execution"]
    may_mutate_live_target: true
    evidence: ["entity-smoke-recovery-check"]

