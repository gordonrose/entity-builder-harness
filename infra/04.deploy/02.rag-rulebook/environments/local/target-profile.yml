schema: deploy/local-target-profile/v1
id: rag-rulebook-local
execution:
  kind: local
  publication: none
  provider_deployment: none
runtime:
  source_entrypoint: .agentic/02.rag-rulebook/service/server.mjs
  command:
  - node
  - .agentic/02.rag-rulebook/service/server.mjs
  configuration:
    RAG_REPO_ROOT: repository-or-image-root
    RAG_RUNTIME_DIR: fresh-local-cache
    HOST: loopback-by-default
    PORT: '3000'
  local_command: scripts/02.rag-rulebook/run-local-service/script.sh
  image_definition: infra/04.deploy/02.rag-rulebook/image/Dockerfile
  image_build: scripts/02.rag-rulebook/build-service-image/script.sh
  image_qualification: scripts/02.rag-rulebook/smoke-test-service-image/script.sh
declaration_contracts:
- infra/04.deploy/02.rag-rulebook/environments/local/declaration-contract.yml
