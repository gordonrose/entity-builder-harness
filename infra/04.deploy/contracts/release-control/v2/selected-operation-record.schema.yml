#   id: deploy.contract.selected-operation-record
#   version: 2
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract
#   purpose: Define closed selected target conformance snapshots without provider execution authority.
#   portability: {class: internal, targets: [kanbien-staging]}
