#     path: scripts/04.deploy/operational-realization-gate/selected_operation.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:selected-operation-record:v2",
  "type": "object",
  "properties": {
    "schema": {
      "const": "selected-operation-record/v2"
    },
    "scope": {
      "const": "selected-operation-conformance"
    },
    "operation_id": {
      "type": "string",
      "pattern": "^[a-z][a-z0-9-]{2,63}$",
      "maxLength": 128
    },
    "generation": {
      "type": "string",
      "pattern": "^[0-9a-f]{32}$",
      "maxLength": 128
    },
    "revision": {
      "type": "integer",
      "minimum": 0,
      "maximum": 9223372036854775807
    },
    "fence": {
      "type": "integer",
      "minimum": 0,
      "maximum": 9223372036854775807
    },
    "state": {
      "enum": [
        "prepared",
        "claimed",
        "reserved",
        "unknown",
        "observed",
        "cleanup-verified",
        "closed",
        "blocked"
      ]
    },
    "owner": {
      "anyOf": [
        {
          "type": "string",
          "pattern": "^[0-9a-f]{32}$",
          "maxLength": 128
        },
        {
          "type": "null"
        }
      ]
    },
    "lease_expires_at_ms": {
      "type": "integer",
      "minimum": 0,
      "maximum": 9223372036854775807
    },
    "authority_expires_at_ms": {
      "type": "integer",
      "minimum": 1,
      "maximum": 9223372036854775807
    },
    "updated_at_ms": {
      "type": "integer",
      "minimum": 1,
      "maximum": 9223372036854775807
    },
    "attempt": {
      "type": "integer",
      "minimum": 0,
      "maximum": 1
    },
    "mode": {
      "enum": [
        "normal",
        "reconcile"
      ]
    },
    "intent": {
      "type": "object",
      "properties": {
        "target": {
          "const": "kanbien/staging"
        },
        "provider": {
          "const": "aws"
        },
        "account": {
          "const": "337159794548"
        },
        "region": {
          "const": "eu-west-1"
        },
        "operation": {
          "const": "candidate-preflight"
        },
        "release_digest": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$",
          "maxLength": 128
        },
        "source_revision": {
          "type": "string",
          "pattern": "^([0-9a-f]{40}|[0-9a-f]{64})$",
          "maxLength": 128
        },
        "image_digest": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$",
          "maxLength": 128
        },
        "blueprint_digest": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$",
          "maxLength": 128
        },
        "policy": {
          "type": "object",
          "properties": {
            "schema": {
              "const": "selected-control-policy/v1"
            },
            "approval_scope": {
              "const": "source-implementation-only"
            },
            "executor": {
              "const": "protected-github-main-staging"
            },
            "retention_minimum_days": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "pitr_days": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "recovery_point_objective_ms": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "recovery_time_objective_ms": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "authority_window_ms": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "operation_timeout_ms": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "recovery_timeout_ms": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "lease_ms": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "renew_interval_ms": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "call_timeout_ms": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "call_safety_margin_ms": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "clock_uncertainty_max_ms": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "max_effect_attempts": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "max_read_attempts": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "additional_monthly_ceiling_usd": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "total_monthly_ceiling_usd": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "initial_qualification_ceiling_usd": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "automatic_deletion": {
              "const": false
            }
          },
          "required": [
            "schema",
            "approval_scope",
            "executor",
            "retention_minimum_days",
            "pitr_days",
            "recovery_point_objective_ms",
            "recovery_time_objective_ms",
            "authority_window_ms",
            "operation_timeout_ms",
            "recovery_timeout_ms",
            "lease_ms",
            "renew_interval_ms",
            "call_timeout_ms",
            "call_safety_margin_ms",
            "clock_uncertainty_max_ms",
            "max_effect_attempts",
            "max_read_attempts",
            "additional_monthly_ceiling_usd",
            "total_monthly_ceiling_usd",
            "initial_qualification_ceiling_usd",
            "automatic_deletion"
          ],
          "additionalProperties": false
        },
        "policy_digest": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$",
          "maxLength": 128
        },
        "created_at_ms": {
          "type": "integer",
          "minimum": 1,
          "maximum": 9223372036854775807
        },
        "authority_status": {
          "const": "not-granted"
        }
      },
      "required": [
        "target",
        "provider",
        "account",
        "region",
        "operation",
        "release_digest",
        "source_revision",
        "image_digest",
        "blueprint_digest",
        "policy",
        "policy_digest",
        "created_at_ms",
        "authority_status"
      ],
      "additionalProperties": false
    },
    "reservation": {
      "anyOf": [
        {
          "type": "object",
          "properties": {
            "action": {
              "const": "candidate-start"
            },
            "request_digest": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$",
              "maxLength": 128
            },
            "credential_expires_at_ms": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "reserved_at_ms": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            },
            "owner": {
              "type": "string",
              "pattern": "^[0-9a-f]{32}$",
              "maxLength": 128
            },
            "fence": {
              "type": "integer",
              "minimum": 1,
              "maximum": 9223372036854775807
            }
          },
          "required": [
            "action",
            "request_digest",
            "credential_expires_at_ms",
            "reserved_at_ms",
            "owner",
            "fence"
          ],
          "additionalProperties": false
        },
        {
          "type": "null"
        }
      ]
    },
    "observation_digest": {
      "anyOf": [
        {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$",
          "maxLength": 128
        },
        {
          "type": "null"
        }
      ]
    },
    "authorized": {
      "const": false
    },
    "release_eligibility": {
      "const": "blocked"
    },
    "operation_authorization": {
      "const": "blocked"
    }
  },
  "required": [
    "schema",
    "scope",
    "operation_id",
    "generation",
    "revision",
    "fence",
    "state",
    "owner",
    "lease_expires_at_ms",
    "authority_expires_at_ms",
    "updated_at_ms",
    "attempt",
    "mode",
    "intent",
    "reservation",
    "observation_digest",
    "authorized",
    "release_eligibility",
    "operation_authorization"
  ],
  "additionalProperties": false
}
