$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:release-control:selected-operation-evidence:v2
type: object
additionalProperties: false
required: [schema, generation, operation_id, record_digest, assertion, verdict, subject_digest, observed_at_ms, expires_at_ms, authorized]
properties:
  schema: {const: selected-operation-evidence/v2}
  generation: {type: string, pattern: '^[0-9a-f]{32}$'}
  operation_id: {type: string, pattern: '^[a-z][a-z0-9-]{2,63}$'}
  record_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  assertion: {enum: [fixture-observation, fixture-cleanup]}
  verdict: {enum: [passed, failed]}
  subject_digest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
  observed_at_ms: {type: integer, minimum: 1, maximum: 9007199254740991}
  expires_at_ms: {type: integer, minimum: 1, maximum: 9007199254740991}
  authorized: {const: false}
