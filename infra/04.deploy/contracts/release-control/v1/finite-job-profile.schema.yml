{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:finite-job-profile:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "id",
    "artifact",
    "execution",
    "limits",
    "completion"
  ],
  "properties": {
    "schema": {
      "const": "finite-job-profile/v1"
    },
    "id": {
      "type": "string",
      "pattern": "^[a-z][a-z0-9-]{0,63}$",
      "maxLength": 64
    },
    "artifact": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "image_id",
        "payload_digest"
      ],
      "properties": {
        "image_id": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$",
          "maxLength": 71
        },
        "payload_digest": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$",
          "maxLength": 71
        }
      }
    },
    "execution": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "entrypoint",
        "command",
        "working_dir"
      ],
      "properties": {
        "entrypoint": {
          "const": [
            "/nodejs/bin/node"
          ]
        },
        "command": {
          "type": "array",
          "minItems": 1,
          "maxItems": 9,
          "prefixItems": [
            {
              "type": "string",
              "minLength": 1,
              "maxLength": 512,
              "pattern": "^[A-Za-z0-9_.@+-]+(?:/[A-Za-z0-9_.@+-]+)*\\.(?:js|mjs|cjs)$"
            }
          ],
          "items": {
            "type": "string",
            "minLength": 1,
            "maxLength": 64,
            "pattern": "^[A-Za-z][A-Za-z0-9_-]{0,63}$"
          }
        },
        "working_dir": {
          "const": "/app"
        }
      }
    },
    "limits": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "timeout_seconds",
        "output_bytes"
      ],
      "properties": {
        "timeout_seconds": {
          "type": "integer",
          "minimum": 1,
          "maximum": 120
        },
        "output_bytes": {
          "type": "integer",
          "minimum": 128,
          "maximum": 65536
        }
      }
    },
    "completion": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "protocol",
        "required_checks"
      ],
      "properties": {
        "protocol": {
          "const": "finite-job-terminal/v1"
        },
        "required_checks": {
          "type": "array",
          "items": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{0,63}$",
            "maxLength": 64
          },
          "minItems": 1,
          "maxItems": 16,
          "uniqueItems": true
        }
      }
    }
  }
}
