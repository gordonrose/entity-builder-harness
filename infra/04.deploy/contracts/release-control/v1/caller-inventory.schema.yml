# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.release-control.caller-inventory.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Bind discovered invocation subjects and their source review without execution authority.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operational-realization-caller-coverage
#     path: scripts/04.deploy/operational-realization-gate/caller_coverage.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:caller-inventory:v1",
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "schema": {
      "const": "caller-inventory/v1"
    },
    "collector_revision": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "entrypoint": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "path": {
          "type": "string",
          "pattern": "^(?!/)(?!.*(?:^|/)\\.\\.(?:/|$))[A-Za-z0-9_./-]+$",
          "maxLength": 512
        },
        "node_id": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        }
      },
      "required": [
        "path",
        "node_id"
      ]
    },
    "sources": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "path": {
            "type": "string",
            "pattern": "^(?!/)(?!.*(?:^|/)\\.\\.(?:/|$))[A-Za-z0-9_./-]+$",
            "maxLength": 512
          },
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "id",
          "path",
          "digest"
        ]
      },
      "minItems": 1,
      "maxItems": 10000,
      "uniqueItems": true
    },
    "nodes": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "kind": {
            "enum": [
              "workflow",
              "workflow-step",
              "package-command",
              "script-entrypoint",
              "tool-command",
              "configuration"
            ]
          },
          "locator_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "detail_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "issues": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^[a-z][a-z0-9-]{2,79}$"
            },
            "minItems": 0,
            "maxItems": 10000,
            "uniqueItems": true
          }
        },
        "required": [
          "id",
          "source_id",
          "kind",
          "locator_digest",
          "detail_digest",
          "issues"
        ]
      },
      "minItems": 1,
      "maxItems": 10000,
      "uniqueItems": true
    },
    "edges": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "caller_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "callee_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "kind": {
            "enum": [
              "invokes",
              "npm-pre",
              "npm-post"
            ]
          },
          "call_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "id",
          "caller_id",
          "callee_id",
          "kind",
          "call_digest"
        ]
      },
      "minItems": 0,
      "maxItems": 10000,
      "uniqueItems": true
    },
    "findings": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          },
          "subject_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "code",
          "subject_id"
        ]
      },
      "minItems": 0,
      "maxItems": 10000,
      "uniqueItems": true
    },
    "graph_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    }
  },
  "required": [
    "schema",
    "collector_revision",
    "entrypoint",
    "sources",
    "nodes",
    "edges",
    "findings",
    "graph_digest"
  ]
}
