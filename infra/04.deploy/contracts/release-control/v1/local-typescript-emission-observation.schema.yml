# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.local-typescript-emission-observation.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: schema
#   purpose: Bind actual compiler writeFile source relationships to immutable observed inputs and outputs.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.local-build-contracts
#     path: scripts/04.deploy/operational-realization-gate/local_build_contracts.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:local-typescript-emission-observation:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "configuration",
    "node_version",
    "typescript_version",
    "verdict",
    "no_emit",
    "emit_skipped",
    "inputs",
    "resolutions",
    "outputs",
    "diagnostics",
    "findings",
    "observation_digest",
    "emission_map",
    "output_mode",
    "existing_remainder"
  ],
  "properties": {
    "schema": {
      "const": "local-typescript-emission-observation/v1"
    },
    "configuration": {
      "type": "string",
      "minLength": 1,
      "maxLength": 512,
      "pattern": "^[A-Za-z0-9_./@+-]+$"
    },
    "node_version": {
      "type": "string",
      "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    },
    "typescript_version": {
      "anyOf": [
        {
          "const": "5.9.3"
        },
        {
          "type": "null"
        }
      ]
    },
    "verdict": {
      "enum": [
        "passed",
        "failed"
      ]
    },
    "no_emit": {
      "type": "boolean"
    },
    "emit_skipped": {
      "type": "boolean"
    },
    "inputs": {
      "type": "array",
      "maxItems": 20000,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "kind",
          "path",
          "digest",
          "bytes"
        ],
        "properties": {
          "kind": {
            "enum": [
              "repository",
              "dependency"
            ]
          },
          "path": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512,
            "pattern": "^[A-Za-z0-9_./@+-]+$"
          },
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "bytes": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1073741824
          }
        }
      }
    },
    "resolutions": {
      "type": "array",
      "maxItems": 50000,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "from",
          "specifier_digest",
          "mode",
          "resolved_path",
          "is_external"
        ],
        "properties": {
          "from": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512,
            "pattern": "^[A-Za-z0-9_./@+-]+$"
          },
          "specifier_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "mode": {
            "enum": [
              "default",
              "import",
              "require"
            ]
          },
          "resolved_path": {
            "anyOf": [
              {
                "type": "string",
                "minLength": 1,
                "maxLength": 512,
                "pattern": "^[A-Za-z0-9_./@+-]+$"
              },
              {
                "type": "null"
              }
            ]
          },
          "is_external": {
            "type": "boolean"
          }
        }
      }
    },
    "outputs": {
      "type": "array",
      "maxItems": 20000,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "path",
          "digest",
          "bytes"
        ],
        "properties": {
          "path": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512,
            "pattern": "^[A-Za-z0-9_./@+-]+$"
          },
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "bytes": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1073741824
          }
        }
      }
    },
    "diagnostics": {
      "type": "array",
      "maxItems": 5000,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "phase",
          "category",
          "code",
          "path",
          "line",
          "column"
        ],
        "properties": {
          "phase": {
            "enum": [
              "config",
              "program",
              "emit"
            ]
          },
          "category": {
            "enum": [
              "error",
              "warning",
              "suggestion",
              "message"
            ]
          },
          "code": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1073741824
          },
          "path": {
            "anyOf": [
              {
                "type": "string",
                "minLength": 1,
                "maxLength": 512,
                "pattern": "^[A-Za-z0-9_./@+-]+$"
              },
              {
                "type": "null"
              }
            ]
          },
          "line": {
            "anyOf": [
              {
                "type": "integer",
                "minimum": 0,
                "maximum": 1073741824
              },
              {
                "type": "null"
              }
            ]
          },
          "column": {
            "anyOf": [
              {
                "type": "integer",
                "minimum": 0,
                "maximum": 1073741824
              },
              {
                "type": "null"
              }
            ]
          }
        }
      }
    },
    "findings": {
      "type": "array",
      "maxItems": 100,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code"
        ],
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^observer-[a-z0-9-]+$",
            "maxLength": 120
          }
        }
      }
    },
    "observation_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "emission_map": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "schema",
        "module_kind",
        "entries"
      ],
      "properties": {
        "schema": {
          "const": "local-typescript-emission-map/v1"
        },
        "module_kind": {
          "enum": [
            "commonjs",
            "other"
          ]
        },
        "entries": {
          "type": "array",
          "maxItems": 10000,
          "items": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "output_path",
              "source_paths",
              "kind"
            ],
            "properties": {
              "output_path": {
                "type": "string",
                "minLength": 1,
                "maxLength": 512,
                "pattern": "^[A-Za-z0-9_./@+-]+$"
              },
              "source_paths": {
                "type": "array",
                "maxItems": 10000,
                "uniqueItems": true,
                "items": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 512,
                  "pattern": "^[A-Za-z0-9_./@+-]+$"
                }
              },
              "kind": {
                "enum": [
                  "javascript",
                  "declaration",
                  "source-map",
                  "build-info",
                  "other"
                ]
              }
            }
          }
        }
      }
    },
    "output_mode": {
      "enum": [
        "fresh-exclusive",
        "verify-existing"
      ]
    },
    "existing_remainder": {
      "type": "array",
      "maxItems": 20000,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "path",
          "digest",
          "bytes"
        ],
        "properties": {
          "path": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512,
            "pattern": "^[A-Za-z0-9_./@+-]+$"
          },
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "bytes": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1073741824
          }
        }
      }
    }
  }
}
