# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.local-build-result.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: schema
#   purpose: Bound safe local build evidence without granting release or operation authority.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.local-build-contracts
#     path: scripts/04.deploy/operational-realization-gate/local_build_contracts.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:local-build-result:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "scope",
    "authorized",
    "release_eligibility",
    "operation_authorization",
    "qualification_verdict",
    "source_closure",
    "verdict",
    "source_digest",
    "build_inventory_digest",
    "graph_digest",
    "runner_digest",
    "toolchain",
    "sandbox",
    "builds",
    "findings",
    "result_digest"
  ],
  "properties": {
    "schema": {
      "const": "local-build-result/v1"
    },
    "scope": {
      "const": "locked-local-build"
    },
    "authorized": {
      "const": false
    },
    "release_eligibility": {
      "const": "blocked"
    },
    "operation_authorization": {
      "const": "blocked"
    },
    "qualification_verdict": {
      "const": "blocked"
    },
    "source_closure": {
      "const": "blocked"
    },
    "verdict": {
      "enum": [
        "passed",
        "failed"
      ]
    },
    "source_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "build_inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "graph_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "runner_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "toolchain": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "contract_digest",
        "node_version",
        "npm_version",
        "typescript_version",
        "lock_digest",
        "dependency_digest"
      ],
      "properties": {
        "contract_digest": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        },
        "node_version": {
          "const": "22.23.3"
        },
        "npm_version": {
          "const": "10.9.9"
        },
        "typescript_version": {
          "const": "5.9.3"
        },
        "lock_digest": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        },
        "dependency_digest": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        }
      }
    },
    "sandbox": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "filesystem",
        "network",
        "environment",
        "timeout_seconds",
        "source_checkout",
        "authority"
      ],
      "properties": {
        "filesystem": {
          "const": "disposable-selected-sources"
        },
        "network": {
          "const": "private-loopback-only"
        },
        "environment": {
          "const": "explicit-allowlist"
        },
        "timeout_seconds": {
          "const": 180
        },
        "source_checkout": {
          "const": "not-mounted"
        },
        "authority": {
          "const": "none"
        }
      }
    },
    "builds": {
      "type": "array",
      "maxItems": 7,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "build_id",
          "configuration",
          "observation",
          "runtime",
          "prediction_status",
          "unpredicted_outputs",
          "unemitted_predictions"
        ],
        "properties": {
          "build_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "configuration": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512,
            "pattern": "^[A-Za-z0-9_./@+-]+$"
          },
          "observation": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "schema",
              "configuration",
              "node_version",
              "typescript_version",
              "verdict",
              "no_emit",
              "emit_skipped",
              "inputs",
              "resolutions",
              "outputs",
              "diagnostics",
              "findings",
              "observation_digest"
            ],
            "properties": {
              "schema": {
                "const": "local-typescript-observation/v1"
              },
              "configuration": {
                "type": "string",
                "minLength": 1,
                "maxLength": 512,
                "pattern": "^[A-Za-z0-9_./@+-]+$"
              },
              "node_version": {
                "type": "string",
                "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+$"
              },
              "typescript_version": {
                "anyOf": [
                  {
                    "const": "5.9.3"
                  },
                  {
                    "type": "null"
                  }
                ]
              },
              "verdict": {
                "enum": [
                  "passed",
                  "failed"
                ]
              },
              "no_emit": {
                "type": "boolean"
              },
              "emit_skipped": {
                "type": "boolean"
              },
              "inputs": {
                "type": "array",
                "maxItems": 20000,
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "kind",
                    "path",
                    "digest",
                    "bytes"
                  ],
                  "properties": {
                    "kind": {
                      "enum": [
                        "repository",
                        "dependency"
                      ]
                    },
                    "path": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 512,
                      "pattern": "^[A-Za-z0-9_./@+-]+$"
                    },
                    "digest": {
                      "type": "string",
                      "pattern": "^sha256:[0-9a-f]{64}$"
                    },
                    "bytes": {
                      "type": "integer",
                      "minimum": 0,
                      "maximum": 1073741824
                    }
                  }
                }
              },
              "resolutions": {
                "type": "array",
                "maxItems": 50000,
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "from",
                    "specifier_digest",
                    "mode",
                    "resolved_path",
                    "is_external"
                  ],
                  "properties": {
                    "from": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 512,
                      "pattern": "^[A-Za-z0-9_./@+-]+$"
                    },
                    "specifier_digest": {
                      "type": "string",
                      "pattern": "^sha256:[0-9a-f]{64}$"
                    },
                    "mode": {
                      "enum": [
                        "default",
                        "import",
                        "require"
                      ]
                    },
                    "resolved_path": {
                      "anyOf": [
                        {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 512,
                          "pattern": "^[A-Za-z0-9_./@+-]+$"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "is_external": {
                      "type": "boolean"
                    }
                  }
                }
              },
              "outputs": {
                "type": "array",
                "maxItems": 20000,
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "path",
                    "digest",
                    "bytes"
                  ],
                  "properties": {
                    "path": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 512,
                      "pattern": "^[A-Za-z0-9_./@+-]+$"
                    },
                    "digest": {
                      "type": "string",
                      "pattern": "^sha256:[0-9a-f]{64}$"
                    },
                    "bytes": {
                      "type": "integer",
                      "minimum": 0,
                      "maximum": 1073741824
                    }
                  }
                }
              },
              "diagnostics": {
                "type": "array",
                "maxItems": 5000,
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "phase",
                    "category",
                    "code",
                    "path",
                    "line",
                    "column"
                  ],
                  "properties": {
                    "phase": {
                      "enum": [
                        "config",
                        "program",
                        "emit"
                      ]
                    },
                    "category": {
                      "enum": [
                        "error",
                        "warning",
                        "suggestion",
                        "message"
                      ]
                    },
                    "code": {
                      "type": "integer",
                      "minimum": 0,
                      "maximum": 1073741824
                    },
                    "path": {
                      "anyOf": [
                        {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 512,
                          "pattern": "^[A-Za-z0-9_./@+-]+$"
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "line": {
                      "anyOf": [
                        {
                          "type": "integer",
                          "minimum": 0,
                          "maximum": 1073741824
                        },
                        {
                          "type": "null"
                        }
                      ]
                    },
                    "column": {
                      "anyOf": [
                        {
                          "type": "integer",
                          "minimum": 0,
                          "maximum": 1073741824
                        },
                        {
                          "type": "null"
                        }
                      ]
                    }
                  }
                }
              },
              "findings": {
                "type": "array",
                "maxItems": 100,
                "items": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "code"
                  ],
                  "properties": {
                    "code": {
                      "type": "string",
                      "pattern": "^observer-[a-z0-9-]+$",
                      "maxLength": 120
                    }
                  }
                }
              },
              "observation_digest": {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              }
            }
          },
          "runtime": {
            "anyOf": [
              {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "schema",
                  "scope",
                  "configuration",
                  "kind",
                  "authorized",
                  "qualification_verdict",
                  "source_inventory_digest",
                  "generator",
                  "compiler_artifact_digest",
                  "dependency_tree_digest",
                  "copied_dependency_digest",
                  "artifact_files",
                  "selected_runtime_tests",
                  "executed_runner_count",
                  "returncode",
                  "stdout_digest",
                  "stderr_digest",
                  "receipt_digest"
                ],
                "properties": {
                  "schema": {
                    "const": "local-runtime-observation/v1"
                  },
                  "scope": {
                    "const": "isolated-local-runtime"
                  },
                  "configuration": {
                    "type": "string",
                    "minLength": 1,
                    "maxLength": 512,
                    "pattern": "^[A-Za-z0-9_./@+-]+$"
                  },
                  "kind": {
                    "enum": [
                      "runtime-test-runner",
                      "image-shim-generator"
                    ]
                  },
                  "authorized": {
                    "const": false
                  },
                  "qualification_verdict": {
                    "const": "blocked"
                  },
                  "source_inventory_digest": {
                    "type": "string",
                    "pattern": "^sha256:[0-9a-f]{64}$"
                  },
                  "generator": {
                    "type": "object",
                    "additionalProperties": false,
                    "required": [
                      "path",
                      "digest"
                    ],
                    "properties": {
                      "path": {
                        "type": "string",
                        "minLength": 1,
                        "maxLength": 512,
                        "pattern": "^[A-Za-z0-9_./@+-]+$"
                      },
                      "digest": {
                        "type": "string",
                        "pattern": "^sha256:[0-9a-f]{64}$"
                      }
                    }
                  },
                  "compiler_artifact_digest": {
                    "type": "string",
                    "pattern": "^sha256:[0-9a-f]{64}$"
                  },
                  "dependency_tree_digest": {
                    "type": "string",
                    "pattern": "^sha256:[0-9a-f]{64}$"
                  },
                  "copied_dependency_digest": {
                    "type": "string",
                    "pattern": "^sha256:[0-9a-f]{64}$"
                  },
                  "artifact_files": {
                    "type": "array",
                    "maxItems": 20000,
                    "items": {
                      "type": "object",
                      "additionalProperties": false,
                      "required": [
                        "path",
                        "digest",
                        "bytes"
                      ],
                      "properties": {
                        "path": {
                          "type": "string",
                          "minLength": 1,
                          "maxLength": 512,
                          "pattern": "^[A-Za-z0-9_./@+-]+$"
                        },
                        "digest": {
                          "type": "string",
                          "pattern": "^sha256:[0-9a-f]{64}$"
                        },
                        "bytes": {
                          "type": "integer",
                          "minimum": 0,
                          "maximum": 1073741824
                        }
                      }
                    }
                  },
                  "selected_runtime_tests": {
                    "type": "array",
                    "maxItems": 1000,
                    "items": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 512,
                      "pattern": "^[A-Za-z0-9_./@+-]+$"
                    }
                  },
                  "executed_runner_count": {
                    "enum": [
                      0,
                      1
                    ]
                  },
                  "returncode": {
                    "const": 0
                  },
                  "stdout_digest": {
                    "type": "string",
                    "pattern": "^sha256:[0-9a-f]{64}$"
                  },
                  "stderr_digest": {
                    "type": "string",
                    "pattern": "^sha256:[0-9a-f]{64}$"
                  },
                  "receipt_digest": {
                    "type": "string",
                    "pattern": "^sha256:[0-9a-f]{64}$"
                  }
                }
              },
              {
                "type": "null"
              }
            ]
          },
          "prediction_status": {
            "enum": [
              "bounded",
              "unresolved"
            ]
          },
          "unpredicted_outputs": {
            "type": "array",
            "maxItems": 20000,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 512,
              "pattern": "^[A-Za-z0-9_./@+-]+$"
            }
          },
          "unemitted_predictions": {
            "type": "array",
            "maxItems": 20000,
            "items": {
              "type": "string",
              "minLength": 1,
              "maxLength": 512,
              "pattern": "^[A-Za-z0-9_./@+-]+$"
            }
          }
        }
      }
    },
    "findings": {
      "type": "array",
      "maxItems": 100,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code"
        ],
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^local-build-[a-z0-9-]+$",
            "maxLength": 120
          }
        }
      }
    },
    "result_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    }
  }
}
