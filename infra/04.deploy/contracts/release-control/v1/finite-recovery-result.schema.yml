# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.finite-recovery-result
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract
#   purpose: Normalize local inert recovery observations without product or provider authority.
#   portability: {class: reusable, targets: [entity-builder]}
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:finite-recovery-result:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "scope",
    "operation_id",
    "attempt_digest",
    "state",
    "terminal_observed",
    "cleanup_verified",
    "resource_id",
    "action_counts",
    "journal_digest",
    "action_journal_digest",
    "semantic_verdict",
    "product_profile_updates",
    "authorized",
    "release_eligibility",
    "operation_authorization",
    "qualification_verdict",
    "source_closure"
  ],
  "properties": {
    "schema": {
      "const": "finite-recovery-result/v1"
    },
    "scope": {
      "const": "local-inert-recovery"
    },
    "operation_id": {
      "type": "string",
      "pattern": "^[a-z][a-z0-9-]{2,63}$"
    },
    "attempt_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "state": {
      "enum": [
        "prepared",
        "executing",
        "observing",
        "unknown",
        "succeeded",
        "failed",
        "cleanup-verified",
        "closed"
      ]
    },
    "terminal_observed": {
      "type": "boolean"
    },
    "cleanup_verified": {
      "type": "boolean"
    },
    "resource_id": {
      "type": [
        "string",
        "null"
      ],
      "pattern": "^[0-9a-f]{64}$"
    },
    "action_counts": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "create",
        "start",
        "inspect",
        "logs",
        "cleanup"
      ],
      "properties": {
        "create": {
          "type": "integer",
          "minimum": 0,
          "maximum": 1
        },
        "start": {
          "type": "integer",
          "minimum": 0,
          "maximum": 1
        },
        "inspect": {
          "type": "integer",
          "minimum": 0,
          "maximum": 32
        },
        "logs": {
          "type": "integer",
          "minimum": 0,
          "maximum": 3
        },
        "cleanup": {
          "type": "integer",
          "minimum": 0,
          "maximum": 3
        }
      }
    },
    "journal_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "action_journal_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "semantic_verdict": {
      "const": "unverified"
    },
    "product_profile_updates": {
      "const": []
    },
    "authorized": {
      "const": false
    },
    "release_eligibility": {
      "const": "blocked"
    },
    "operation_authorization": {
      "const": "blocked"
    },
    "qualification_verdict": {
      "const": "blocked"
    },
    "source_closure": {
      "const": "blocked"
    }
  }
}
