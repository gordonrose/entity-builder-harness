# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.release-control.source-operation-contracts.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Account for reviewed source operation obligations without granting qualification or authority.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operational-realization-operation-contracts
#     path: scripts/04.deploy/operational-realization-gate/operation_contracts.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:source-operation-contracts:v1",
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "schema": {
      "const": "source-operation-contracts/v1"
    },
    "inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "graph_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "caller_accounting_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "target_id": {
      "type": "string",
      "pattern": "^[a-z][a-z0-9-]{1,63}(?:/[a-z][a-z0-9-]{1,63})*$"
    },
    "bindings": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "subject_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "owner": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          },
          "operation_id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          },
          "operation_profile": {
            "enum": [
              "static-artifact",
              "inspection",
              "service-rollout",
              "finite-job",
              "queue-consumer",
              "infrastructure-change",
              "migration",
              "restore",
              "scheduled-control"
            ]
          },
          "review_status": {
            "enum": [
              "pending",
              "reviewed"
            ]
          },
          "invocation_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$"
            },
            "minItems": 1,
            "maxItems": 10000,
            "uniqueItems": true
          },
          "observation_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$"
            },
            "minItems": 0,
            "maxItems": 10000,
            "uniqueItems": true
          },
          "dependency_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$"
            },
            "minItems": 0,
            "maxItems": 10000,
            "uniqueItems": true
          },
          "argument_policy": {
            "const": "observed-variants-only"
          },
          "unobserved_arguments": {
            "const": "blocked"
          },
          "completion_rule": {
            "const": "profile-specific-verification-required"
          },
          "failure_state": {
            "const": "blocked"
          },
          "recovery_route": {
            "const": "reviewed-recovery-required"
          },
          "evidence_rules": {
            "type": "array",
            "items": {
              "enum": [
                "source-semantics",
                "exact-artifact",
                "supply-chain",
                "authority",
                "recovery"
              ]
            },
            "minItems": 5,
            "maxItems": 5,
            "uniqueItems": true
          }
        },
        "required": [
          "subject_id",
          "owner",
          "operation_id",
          "operation_profile",
          "review_status",
          "invocation_ids",
          "observation_ids",
          "dependency_ids",
          "argument_policy",
          "unobserved_arguments",
          "completion_rule",
          "failure_state",
          "recovery_route",
          "evidence_rules"
        ]
      },
      "minItems": 1,
      "maxItems": 10000,
      "uniqueItems": true
    }
  },
  "required": [
    "schema",
    "inventory_digest",
    "graph_digest",
    "caller_accounting_digest",
    "target_id",
    "bindings"
  ]
}
