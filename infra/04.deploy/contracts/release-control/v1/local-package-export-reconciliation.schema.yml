# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.release-control.local-package-export-reconciliation.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Account every declared export separately from source-bound executable aliases and remaining behavioral obligations.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operational-realization-package-exports
#     path: scripts/04.deploy/operational-realization-gate/package_exports.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:local-package-export-reconciliation:v1",
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "schema": {
      "const": "local-package-export-reconciliation/v1"
    },
    "scope": {
      "const": "compiler-export-reconciliation"
    },
    "authorized": {
      "const": false
    },
    "release_eligibility": {
      "const": "blocked"
    },
    "operation_authorization": {
      "const": "blocked"
    },
    "qualification_verdict": {
      "const": "blocked"
    },
    "source_closure": {
      "const": "blocked"
    },
    "review_verdict": {
      "const": "not-evaluated"
    },
    "configuration": {
      "type": "string",
      "pattern": "^[A-Za-z0-9_./@+-]+$",
      "maxLength": 512
    },
    "source_inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "export_inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "compiler_observation_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "projection_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "policy_revision": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "declared_exports": {
      "type": "integer",
      "minimum": 0,
      "maximum": 10000
    },
    "selected_exports": {
      "type": "integer",
      "minimum": 0,
      "maximum": 10000
    },
    "outside_selected_exports": {
      "type": "integer",
      "minimum": 0,
      "maximum": 10000
    },
    "exports": {
      "type": "array",
      "maxItems": 10000,
      "uniqueItems": true,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "export_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "selection": {
            "enum": [
              "emitted",
              "outside-selected-compilation"
            ]
          },
          "output_digest": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              {
                "type": "null"
              }
            ]
          },
          "output_path_digest": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              {
                "type": "null"
              }
            ]
          },
          "qualification": {
            "const": "unqualified"
          }
        },
        "required": [
          "export_id",
          "selection",
          "output_digest",
          "output_path_digest",
          "qualification"
        ]
      }
    },
    "aliases": {
      "type": "array",
      "maxItems": 10000,
      "uniqueItems": true,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "route": {
            "const": "source-bound-executable-alias"
          },
          "source_bindings": {
            "type": "array",
            "maxItems": 10000,
            "uniqueItems": true,
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "path_digest": {
                  "type": "string",
                  "pattern": "^sha256:[0-9a-f]{64}$"
                },
                "source_digest": {
                  "type": "string",
                  "pattern": "^sha256:[0-9a-f]{64}$"
                }
              },
              "required": [
                "path_digest",
                "source_digest"
              ]
            }
          },
          "resolution_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "qualification": {
            "const": "unqualified"
          }
        },
        "required": [
          "id",
          "route",
          "source_bindings",
          "resolution_digest",
          "qualification"
        ]
      }
    },
    "generated_files": {
      "type": "array",
      "maxItems": 10000,
      "uniqueItems": true,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "path": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_./@+-]+$",
            "maxLength": 512
          },
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "bytes": {
            "type": "integer",
            "minimum": 0,
            "maximum": 16777216
          }
        },
        "required": [
          "path",
          "digest",
          "bytes"
        ]
      }
    },
    "source_findings": {
      "type": "array",
      "maxItems": 10000,
      "uniqueItems": true,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          },
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "code",
          "source_id"
        ]
      }
    },
    "structural_verdict": {
      "const": "accounted"
    },
    "findings": {
      "type": "array",
      "maxItems": 0
    },
    "receipt_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    }
  },
  "required": [
    "schema",
    "scope",
    "authorized",
    "release_eligibility",
    "operation_authorization",
    "qualification_verdict",
    "source_closure",
    "review_verdict",
    "configuration",
    "source_inventory_digest",
    "export_inventory_digest",
    "compiler_observation_digest",
    "projection_digest",
    "policy_revision",
    "declared_exports",
    "selected_exports",
    "outside_selected_exports",
    "exports",
    "aliases",
    "generated_files",
    "source_findings",
    "structural_verdict",
    "findings",
    "receipt_digest"
  ]
}
