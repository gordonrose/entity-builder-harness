# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.selected-effect-route.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Normalize selected source route requirements while keeping effect authority unavailable.
#   portability: {class: internal, targets: [kanbien/staging]}
#   used_by:
#   - id: deploy.script.selected-effect-control
#     path: scripts/04.deploy/operational-realization-gate/selected_effect_control.py
$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:release-control:selected-effect-route:v1
type: object
additionalProperties: false
required:
  - schema
  - route
  - mode
  - operation_ids
  - control_plane_result_digest
  - admission_digest
  - required_receipts
  - authorized
  - release_eligibility
  - operation_authorization
  - findings
  - result_digest
properties:
  schema: {const: selected-effect-route/v1}
  route: {enum: [candidate-execution-preflight, postgresql-relational-smoke]}
  mode:
    enum: [execute, execute-bootstrap-recovery, execute-recovery-continuation, diagnose-bootstrap-recovery]
  operation_ids:
    type: array
    minItems: 1
    maxItems: 5
    uniqueItems: true
    items:
      enum: [candidate-server, bootstrap, migration, relational-relay, relational-worker, restore-verify]
  control_plane_result_digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'
  admission_digest:
    type: [string, 'null']
    pattern: '^sha256:[0-9a-f]{64}$'
  required_receipts:
    type: array
    minItems: 6
    maxItems: 6
    uniqueItems: true
    items:
      enum:
        - selected-admission-result/v1
        - selected-operation-record/v2
        - selected-store-event/v2
        - selected-operation-evidence/v2
        - selected-control-plane-result/v1
        - authenticated-selected-transport/v1
  authorized: {const: false}
  release_eligibility: {const: blocked}
  operation_authorization: {const: blocked}
  findings:
    type: array
    minItems: 1
    maxItems: 1
    items:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {const: selected-live-control-receipt-required}
  result_digest:
    type: string
    pattern: '^sha256:[0-9a-f]{64}$'

