# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.release-control.source-build-artifact.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Record safe local artifact bytes and source candidate membership without asserting provenance or qualification.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.release-control.build-artifacts
#     path: scripts/04.deploy/release-control/discovery/build_artifacts.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:source-build-artifact:v1",
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "schema": {
      "const": "source-build-artifact/v1"
    },
    "scope": {
      "const": "build-artifact-accounting"
    },
    "authorized": {
      "const": false
    },
    "source_closure": {
      "const": "blocked"
    },
    "provenance": {
      "const": "unproven"
    },
    "qualification_verdict": {
      "const": "blocked"
    },
    "artifact_verdict": {
      "enum": [
        "complete",
        "incomplete"
      ]
    },
    "binder_revision": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "build_id": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "files": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "path": {
            "type": "string",
            "pattern": "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$))(?!.*//)(?!.*\\/$)[A-Za-z0-9_./@+-]+$",
            "maxLength": 512
          },
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "bytes": {
            "type": "integer",
            "minimum": 0,
            "maximum": 2097152
          }
        },
        "required": [
          "path",
          "digest",
          "bytes"
        ]
      },
      "maxItems": 10000,
      "uniqueItems": true
    },
    "mappings": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "path": {
            "type": "string",
            "pattern": "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$))(?!.*//)(?!.*\\/$)[A-Za-z0-9_./@+-]+$",
            "maxLength": 512
          },
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "kind": {
            "enum": [
              "javascript",
              "declaration",
              "runtime-test"
            ]
          }
        },
        "required": [
          "path",
          "source_id",
          "kind"
        ]
      },
      "maxItems": 10000,
      "uniqueItems": true
    },
    "generator_sources": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "path": {
            "type": "string",
            "pattern": "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$))(?!.*//)(?!.*\\/$)[A-Za-z0-9_./@+-]+$",
            "maxLength": 512
          },
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "id",
          "path",
          "digest"
        ]
      },
      "maxItems": 10000,
      "uniqueItems": true
    },
    "shim_targets": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "manifest_path": {
            "type": "string",
            "pattern": "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$))(?!.*//)(?!.*\\/$)[A-Za-z0-9_./@+-]+$",
            "maxLength": 512
          },
          "shim_path": {
            "type": "string",
            "pattern": "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$))(?!.*//)(?!.*\\/$)[A-Za-z0-9_./@+-]+$",
            "maxLength": 512
          },
          "target_path": {
            "type": "string",
            "pattern": "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$))(?!.*//)(?!.*\\/$)[A-Za-z0-9_./@+-]+$",
            "maxLength": 512
          },
          "generator_source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "manifest_path",
          "shim_path",
          "target_path",
          "generator_source_id"
        ]
      },
      "maxItems": 10000,
      "uniqueItems": true
    },
    "runtime_tests": {
      "type": "array",
      "items": {
        "type": "string",
        "pattern": "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$))(?!.*//)(?!.*\\/$)[A-Za-z0-9_./@+-]+$",
        "maxLength": 512
      },
      "maxItems": 10000,
      "uniqueItems": true
    },
    "findings": {
      "type": "array",
      "items": {
        "type": "string",
        "pattern": "^[a-z][a-z0-9-]{2,79}$"
      },
      "maxItems": 10000,
      "uniqueItems": true
    },
    "artifact_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    }
  },
  "required": [
    "schema",
    "scope",
    "authorized",
    "source_closure",
    "provenance",
    "qualification_verdict",
    "artifact_verdict",
    "binder_revision",
    "inventory_digest",
    "build_id",
    "files",
    "mappings",
    "generator_sources",
    "shim_targets",
    "runtime_tests",
    "findings",
    "artifact_digest"
  ]
}
