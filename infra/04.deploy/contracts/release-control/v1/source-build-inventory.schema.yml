# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.release-control.source-build-inventory.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Bind selected build configurations, workspaces, source imports and bounded output candidates.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operational-realization-build-contracts
#     path: scripts/04.deploy/operational-realization-gate/build_contracts.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:source-build-inventory:v1",
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "schema": {
      "const": "source-build-inventory/v1"
    },
    "graph_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "collector_revision": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "sources": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "path": {
            "type": "string",
            "pattern": "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$))(?!.*//)(?!.*\\/$)[A-Za-z0-9_./-]+$",
            "maxLength": 512
          },
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "id",
          "path",
          "digest"
        ]
      },
      "minItems": 1,
      "maxItems": 4000
    },
    "builds": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "invocation_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$"
            },
            "minItems": 1,
            "maxItems": 10000,
            "uniqueItems": true
          },
          "config_source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "effective_config_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "root_source_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$"
            },
            "minItems": 0,
            "maxItems": 4000,
            "uniqueItems": true
          },
          "workspace_source_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$"
            },
            "minItems": 0,
            "maxItems": 4000,
            "uniqueItems": true
          },
          "output_mode": {
            "enum": [
              "no-emit",
              "declarations",
              "javascript",
              "unresolved"
            ]
          },
          "prediction_status": {
            "enum": [
              "bounded",
              "unresolved"
            ]
          },
          "output_root": {
            "type": "string",
            "pattern": "^(?:|(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$))(?!.*//)(?!.*\\/$)[A-Za-z0-9_./-]+)$",
            "maxLength": 512
          },
          "expected_outputs": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "path": {
                  "type": "string",
                  "pattern": "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$))(?!.*//)(?!.*\\/$)[A-Za-z0-9_./-]+$",
                  "maxLength": 512
                },
                "source_id": {
                  "type": "string",
                  "pattern": "^sha256:[0-9a-f]{64}$"
                },
                "kind": {
                  "enum": [
                    "javascript",
                    "declaration",
                    "runtime-test"
                  ]
                }
              },
              "required": [
                "path",
                "source_id",
                "kind"
              ]
            },
            "minItems": 0,
            "maxItems": 8000
          }
        },
        "required": [
          "id",
          "source_id",
          "invocation_ids",
          "config_source_id",
          "effective_config_digest",
          "root_source_ids",
          "workspace_source_ids",
          "output_mode",
          "prediction_status",
          "output_root",
          "expected_outputs"
        ]
      },
      "minItems": 1,
      "maxItems": 1000
    },
    "bindings": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "build_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "kind": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          },
          "locator_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "detail_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "id",
          "build_id",
          "source_id",
          "kind",
          "locator_digest",
          "detail_digest"
        ]
      },
      "minItems": 0,
      "maxItems": 50000
    },
    "edges": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "build_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "from_source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "to_source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "kind": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          },
          "detail_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "id",
          "build_id",
          "from_source_id",
          "to_source_id",
          "kind",
          "detail_digest"
        ]
      },
      "minItems": 0,
      "maxItems": 50000
    },
    "findings": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "build_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "code": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          }
        },
        "required": [
          "build_id",
          "code"
        ]
      },
      "minItems": 0,
      "maxItems": 50000
    },
    "inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    }
  },
  "required": [
    "schema",
    "graph_digest",
    "collector_revision",
    "sources",
    "builds",
    "bindings",
    "edges",
    "findings",
    "inventory_digest"
  ]
}
