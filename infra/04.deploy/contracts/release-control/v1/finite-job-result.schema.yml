{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:finite-job-result:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "scope",
    "authorized",
    "release_eligibility",
    "operation_authorization",
    "qualification_verdict",
    "source_closure",
    "semantic_verdict",
    "profile",
    "profile_digest",
    "schema_digests",
    "run_id",
    "settings",
    "outcome",
    "failure_code",
    "exit_code",
    "oom_killed",
    "terminal_digest",
    "checks",
    "cleanup_verified",
    "elapsed_ms",
    "result_digest"
  ],
  "properties": {
    "schema": {
      "const": "finite-job-result/v1"
    },
    "scope": {
      "const": "local-finite-execution"
    },
    "authorized": {
      "const": false
    },
    "release_eligibility": {
      "const": "blocked"
    },
    "operation_authorization": {
      "const": "blocked"
    },
    "qualification_verdict": {
      "const": "blocked"
    },
    "source_closure": {
      "const": "blocked"
    },
    "semantic_verdict": {
      "const": "unverified"
    },
    "profile": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "schema",
        "id",
        "artifact",
        "execution",
        "limits",
        "completion"
      ],
      "properties": {
        "schema": {
          "const": "finite-job-profile/v1"
        },
        "id": {
          "type": "string",
          "pattern": "^[a-z][a-z0-9-]{0,63}$",
          "maxLength": 64
        },
        "artifact": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "image_id",
            "payload_digest"
          ],
          "properties": {
            "image_id": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$",
              "maxLength": 71
            },
            "payload_digest": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$",
              "maxLength": 71
            }
          }
        },
        "execution": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "entrypoint",
            "command",
            "working_dir"
          ],
          "properties": {
            "entrypoint": {
              "const": [
                "/nodejs/bin/node"
              ]
            },
            "command": {
              "type": "array",
              "minItems": 1,
              "maxItems": 9,
              "prefixItems": [
                {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 512,
                  "pattern": "^[A-Za-z0-9_.@+-]+(?:/[A-Za-z0-9_.@+-]+)*\\.(?:js|mjs|cjs)$"
                }
              ],
              "items": {
                "type": "string",
                "minLength": 1,
                "maxLength": 64,
                "pattern": "^[A-Za-z][A-Za-z0-9_-]{0,63}$"
              }
            },
            "working_dir": {
              "const": "/app"
            }
          }
        },
        "limits": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "timeout_seconds",
            "output_bytes"
          ],
          "properties": {
            "timeout_seconds": {
              "type": "integer",
              "minimum": 1,
              "maximum": 120
            },
            "output_bytes": {
              "type": "integer",
              "minimum": 128,
              "maximum": 65536
            }
          }
        },
        "completion": {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "protocol",
            "required_checks"
          ],
          "properties": {
            "protocol": {
              "const": "finite-job-terminal/v1"
            },
            "required_checks": {
              "type": "array",
              "items": {
                "type": "string",
                "pattern": "^[a-z][a-z0-9-]{0,63}$",
                "maxLength": 64
              },
              "minItems": 1,
              "maxItems": 16,
              "uniqueItems": true
            }
          }
        }
      }
    },
    "profile_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$",
      "maxLength": 71
    },
    "schema_digests": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "finite-job-profile/v1",
        "finite-job-result/v1"
      ],
      "properties": {
        "finite-job-profile/v1": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$",
          "maxLength": 71
        },
        "finite-job-result/v1": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$",
          "maxLength": 71
        }
      }
    },
    "run_id": {
      "type": "string",
      "pattern": "^[0-9a-f]{32}$",
      "maxLength": 32
    },
    "settings": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "network",
        "read_only",
        "user",
        "capabilities",
        "no_new_privileges",
        "memory_bytes",
        "cpus",
        "pids_limit",
        "tmpfs_bytes",
        "published_ports",
        "host_mounts",
        "restart",
        "ipc",
        "environment_keys"
      ],
      "properties": {
        "network": {
          "const": "none"
        },
        "read_only": {
          "const": true
        },
        "user": {
          "const": "65532:65532"
        },
        "capabilities": {
          "const": "none"
        },
        "no_new_privileges": {
          "const": true
        },
        "memory_bytes": {
          "const": 536870912
        },
        "cpus": {
          "const": 1
        },
        "pids_limit": {
          "const": 128
        },
        "tmpfs_bytes": {
          "const": 16777216
        },
        "published_ports": {
          "const": []
        },
        "host_mounts": {
          "const": []
        },
        "restart": {
          "const": "no"
        },
        "ipc": {
          "const": "none"
        },
        "environment_keys": {
          "const": [
            "RELEASE_CONTROL_PROFILE_DIGEST",
            "RELEASE_CONTROL_RUN_ID"
          ]
        }
      }
    },
    "outcome": {
      "enum": [
        "completed",
        "failed",
        "timed-out",
        "interrupted",
        "unknown"
      ]
    },
    "failure_code": {
      "enum": [
        null,
        "engine-unavailable",
        "image-mismatch",
        "payload-mismatch",
        "command-mismatch",
        "isolation-mismatch",
        "start-failed",
        "exit-nonzero",
        "oom-killed",
        "terminal-invalid",
        "output-limit",
        "deadline-exceeded",
        "interrupted",
        "cleanup-failed",
        "observation-unavailable"
      ]
    },
    "exit_code": {
      "type": [
        "integer",
        "null"
      ],
      "minimum": 0,
      "maximum": 255
    },
    "oom_killed": {
      "type": [
        "boolean",
        "null"
      ]
    },
    "terminal_digest": {
      "anyOf": [
        {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$",
          "maxLength": 71
        },
        {
          "type": "null"
        }
      ]
    },
    "checks": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "verdict"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{0,63}$",
            "maxLength": 64
          },
          "verdict": {
            "const": "passed"
          }
        }
      },
      "minItems": 0,
      "maxItems": 16,
      "uniqueItems": true
    },
    "cleanup_verified": {
      "type": "boolean"
    },
    "elapsed_ms": {
      "type": "integer",
      "minimum": 0
    },
    "result_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$",
      "maxLength": 71
    }
  }
}
