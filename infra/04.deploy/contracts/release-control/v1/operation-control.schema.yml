# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.operation-control
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract
#   purpose: Define local control-store conformance without cloud authority.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operation-journal
#     path: scripts/04.deploy/operational-realization-gate/operation_journal.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:operation-control:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "operation_id",
    "idempotency_key",
    "release_digest",
    "profile_digest",
    "artifact_digest",
    "environment_digest",
    "authority_policy_digest",
    "recovery_route",
    "scopes",
    "policy"
  ],
  "properties": {
    "schema": {
      "const": "operation-control/v1"
    },
    "operation_id": {
      "type": "string",
      "pattern": "^[a-z][a-z0-9-]{2,63}$",
      "maxLength": 128
    },
    "idempotency_key": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$",
      "maxLength": 128
    },
    "release_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$",
      "maxLength": 128
    },
    "profile_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$",
      "maxLength": 128
    },
    "artifact_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$",
      "maxLength": 128
    },
    "environment_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$",
      "maxLength": 128
    },
    "authority_policy_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$",
      "maxLength": 128
    },
    "recovery_route": {
      "const": "local-fixture-reconcile"
    },
    "scopes": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "scope_id",
          "provider",
          "namespace",
          "target",
          "resource"
        ],
        "properties": {
          "scope_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$",
            "maxLength": 128
          },
          "provider": {
            "const": "local-fixture"
          },
          "namespace": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$",
            "maxLength": 128
          },
          "target": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$",
            "maxLength": 128
          },
          "resource": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$",
            "maxLength": 128
          }
        }
      },
      "minItems": 1,
      "maxItems": 16,
      "uniqueItems": true
    },
    "policy": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "scope",
        "lease_ms",
        "operation_timeout_ms",
        "call_timeout_ms",
        "max_attempts",
        "evidence_lifetime_ms"
      ],
      "properties": {
        "scope": {
          "const": "local-conformance"
        },
        "lease_ms": {
          "type": "integer",
          "minimum": 20,
          "maximum": 30000
        },
        "operation_timeout_ms": {
          "type": "integer",
          "minimum": 100,
          "maximum": 120000
        },
        "call_timeout_ms": {
          "type": "integer",
          "minimum": 1,
          "maximum": 30000
        },
        "max_attempts": {
          "type": "integer",
          "minimum": 1,
          "maximum": 3
        },
        "evidence_lifetime_ms": {
          "type": "integer",
          "minimum": 1,
          "maximum": 120000
        }
      }
    }
  }
}
