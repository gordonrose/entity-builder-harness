# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.release-control.estate-caller-inventory.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Bind compatible aggregate caller roots and literal proofs without admitting execution authority.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operational-realization-estate-caller-coverage
#     path: scripts/04.deploy/operational-realization-gate/estate_caller_coverage.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:estate-caller-inventory:v1",
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "collector_revision": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "sources": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "path": {
            "type": "string",
            "pattern": "^(?!/)(?!.*(?:^|/)\\.\\.(?:/|$))[A-Za-z0-9_./-]+$",
            "maxLength": 512
          },
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "id",
          "path",
          "digest"
        ]
      },
      "minItems": 0,
      "maxItems": 10000,
      "uniqueItems": true
    },
    "nodes": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "kind": {
            "enum": [
              "workflow",
              "workflow-step",
              "package-command",
              "script-entrypoint",
              "tool-command",
              "configuration",
              "package-invocation"
            ]
          },
          "locator_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "detail_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "issues": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^[a-z][a-z0-9-]{2,79}$"
            },
            "minItems": 0,
            "maxItems": 10000,
            "uniqueItems": true
          }
        },
        "required": [
          "id",
          "source_id",
          "kind",
          "locator_digest",
          "detail_digest",
          "issues"
        ]
      },
      "minItems": 0,
      "maxItems": 10000,
      "uniqueItems": true
    },
    "edges": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "caller_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "callee_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "kind": {
            "enum": [
              "invokes",
              "npm-pre",
              "npm-post"
            ]
          },
          "call_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "id",
          "caller_id",
          "callee_id",
          "kind",
          "call_digest"
        ]
      },
      "minItems": 0,
      "maxItems": 10000,
      "uniqueItems": true
    },
    "findings": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          },
          "subject_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "code",
          "subject_id"
        ]
      },
      "minItems": 0,
      "maxItems": 10000,
      "uniqueItems": true
    },
    "graph_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "schema": {
      "const": "estate-caller-inventory/v1"
    },
    "scope": {
      "const": "root-package-and-workflow-callers"
    },
    "source_inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "root_bindings": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "kind": {
            "enum": [
              "workflow",
              "package-command"
            ]
          },
          "node_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "observation_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "kind",
          "node_id",
          "observation_id"
        ]
      },
      "maxItems": 10000,
      "uniqueItems": true
    },
    "observation_links": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "node_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "observation_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "node_id",
          "observation_id"
        ]
      },
      "maxItems": 10000,
      "uniqueItems": true
    },
    "structural_proofs": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "observation_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "node_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "source_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "rule": {
            "enum": [
              "literal-package-command/v1",
              "python-dispatch/v1"
            ]
          },
          "outgoing_edge_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$"
            },
            "maxItems": 10000,
            "uniqueItems": true
          },
          "incoming_edge_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$"
            },
            "maxItems": 10000,
            "uniqueItems": true
          },
          "context_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "observation_id",
          "node_id",
          "source_digest",
          "rule",
          "outgoing_edge_ids",
          "incoming_edge_ids",
          "context_digest"
        ]
      },
      "maxItems": 10000,
      "uniqueItems": true
    },
    "diagnostics": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          }
        },
        "required": [
          "code"
        ]
      },
      "maxItems": 100,
      "uniqueItems": true
    },
    "invocations": {
      "type": "array",
      "maxItems": 10000,
      "uniqueItems": true,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "node_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "command_node_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "lifecycle": {
            "type": "boolean"
          }
        },
        "required": [
          "node_id",
          "command_node_id",
          "lifecycle"
        ]
      }
    }
  },
  "required": [
    "collector_revision",
    "sources",
    "nodes",
    "edges",
    "findings",
    "graph_digest",
    "schema",
    "scope",
    "source_inventory_digest",
    "root_bindings",
    "observation_links",
    "structural_proofs",
    "diagnostics",
    "invocations"
  ]
}
