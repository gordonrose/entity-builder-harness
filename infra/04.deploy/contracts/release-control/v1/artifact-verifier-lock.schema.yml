# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.artifact-verifier-lock
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract
#   purpose: Define bounded artifact supply-chain evidence and preserve independent release authority.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.artifact-admission
#     path: scripts/04.deploy/operational-realization-gate/artifact_admission.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:artifact-verifier-lock:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "version",
    "platform",
    "archive_url",
    "archive_digest",
    "binary_digest",
    "binary_bytes",
    "member",
    "trusted_root_digest",
    "trusted_root_observed_at",
    "upstream_commit"
  ],
  "properties": {
    "schema": {
      "const": "artifact-verifier-lock/v1"
    },
    "version": {
      "type": "string",
      "minLength": 1,
      "maxLength": 512,
      "pattern": "^[0-9]+\\.[0-9]+\\.[0-9]+$"
    },
    "platform": {
      "const": "linux-amd64"
    },
    "archive_url": {
      "type": "string",
      "minLength": 1,
      "maxLength": 512,
      "pattern": "^https://github.com/cli/cli/releases/download/v[0-9.]+/gh_[0-9.]+_linux_amd64.tar.gz$"
    },
    "archive_digest": {
      "type": "string",
      "minLength": 1,
      "maxLength": 512,
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "binary_digest": {
      "type": "string",
      "minLength": 1,
      "maxLength": 512,
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "binary_bytes": {
      "type": "integer",
      "minimum": 1,
      "maximum": 134217728
    },
    "member": {
      "type": "string",
      "minLength": 1,
      "maxLength": 512,
      "pattern": "^gh_[0-9.]+_linux_amd64/bin/gh$"
    },
    "trusted_root_digest": {
      "type": "string",
      "minLength": 1,
      "maxLength": 512,
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "trusted_root_observed_at": {
      "type": "integer",
      "minimum": 1
    },
    "upstream_commit": {
      "type": "string",
      "minLength": 1,
      "maxLength": 512,
      "pattern": "^[0-9a-f]{40}$"
    }
  }
}
