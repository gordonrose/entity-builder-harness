# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.selected-readiness-error.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Close the passive selected-target readiness boundary without granting qualification or authority.
#   portability: {class: internal, targets: [kanbien/staging]}
#   used_by:
#   - id: deploy.script.selected-readiness-cli
#     path: scripts/04.deploy/operational-realization-gate/selected_readiness_cli.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:selected-readiness-error:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "scope",
    "verdict",
    "authorized",
    "release_eligibility",
    "operation_authorization",
    "qualification_verdict",
    "findings"
  ],
  "properties": {
    "schema": {
      "const": "selected-readiness-error/v1"
    },
    "scope": {
      "const": "selected-target-passive-readiness"
    },
    "verdict": {
      "const": "blocked"
    },
    "authorized": {
      "const": false
    },
    "release_eligibility": {
      "const": "blocked"
    },
    "operation_authorization": {
      "const": "blocked"
    },
    "qualification_verdict": {
      "const": "blocked"
    },
    "findings": {
      "type": "array",
      "minItems": 1,
      "maxItems": 1,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code"
        ],
        "properties": {
          "code": {
            "enum": [
              "arguments-invalid",
              "readiness-dependency-unavailable",
              "readiness-source-invalid",
              "readiness-result-invalid",
              "readiness-inspector-source-mismatch",
              "readiness-target-mismatch",
              "readiness-policy-invalid",
              "readiness-source-groups-invalid",
              "readiness-source-changed",
              "readiness-evidence-expired",
              "readiness-inspection-timeout",
              "readiness-inspection-blocked",
              "readiness-inspection-unavailable"
            ]
          }
        }
      }
    }
  }
}
