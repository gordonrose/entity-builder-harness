# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.release-control.source-composition.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Define closed source discovery and composition coverage input.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operational-realization-source-coverage
#     path: scripts/04.deploy/operational-realization-gate/source_coverage.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:source-composition:v1",
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "schema": {
      "const": "release-source-composition/v1"
    },
    "target_id": {
      "type": "string",
      "pattern": "^[a-z][a-z0-9/-]{2,127}$"
    },
    "inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "artifacts": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$"
          },
          "kind": {
            "enum": [
              "container-image",
              "source-bundle",
              "provider-definition"
            ]
          },
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "observation_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$"
            },
            "minItems": 1,
            "uniqueItems": true
          }
        },
        "required": [
          "id",
          "kind",
          "digest",
          "observation_ids"
        ]
      },
      "minItems": 1,
      "uniqueItems": true
    },
    "operations": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$"
          },
          "execution_unit": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$"
          },
          "operation_profile": {
            "enum": [
              "static-artifact",
              "inspection",
              "service-rollout",
              "finite-job",
              "queue-consumer",
              "infrastructure-change",
              "migration",
              "restore",
              "scheduled-control"
            ]
          },
          "artifact_id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$"
          },
          "observation_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$"
            },
            "minItems": 1,
            "uniqueItems": true
          },
          "resource_access": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "properties": {
                "resource_id": {
                  "type": "string",
                  "pattern": "^[a-z][a-z0-9-]{2,63}$"
                },
                "effect": {
                  "type": "string",
                  "enum": [
                    "inspect",
                    "consume",
                    "create",
                    "update",
                    "delete",
                    "cleanup"
                  ]
                }
              },
              "required": [
                "resource_id",
                "effect"
              ]
            },
            "minItems": 0,
            "uniqueItems": true
          }
        },
        "required": [
          "id",
          "execution_unit",
          "operation_profile",
          "artifact_id",
          "observation_ids",
          "resource_access"
        ]
      },
      "minItems": 1,
      "uniqueItems": true
    },
    "resources": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$"
          },
          "provider_boundary": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$"
          },
          "owner": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$"
          },
          "management": {
            "enum": [
              "managed",
              "external"
            ]
          },
          "permitted_effects": {
            "type": "array",
            "items": {
              "type": "string",
              "enum": [
                "inspect",
                "consume",
                "create",
                "update",
                "delete",
                "cleanup"
              ]
            },
            "minItems": 1,
            "uniqueItems": true
          },
          "cleanup_owner": {
            "enum": [
              "release",
              "external"
            ]
          },
          "authority_revision": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "observation_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$"
            },
            "minItems": 1,
            "uniqueItems": true
          }
        },
        "required": [
          "id",
          "provider_boundary",
          "owner",
          "management",
          "permitted_effects",
          "cleanup_owner",
          "authority_revision",
          "observation_ids"
        ]
      },
      "minItems": 0,
      "uniqueItems": true
    },
    "bindings": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "observation_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "operation_id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$"
          },
          "kind": {
            "enum": [
              "artifact",
              "command",
              "configuration",
              "secret",
              "identity",
              "dependency"
            ]
          }
        },
        "required": [
          "observation_id",
          "operation_id",
          "kind"
        ]
      },
      "minItems": 0,
      "uniqueItems": true
    }
  },
  "required": [
    "schema",
    "target_id",
    "inventory_digest",
    "artifacts",
    "operations",
    "resources",
    "bindings"
  ]
}
