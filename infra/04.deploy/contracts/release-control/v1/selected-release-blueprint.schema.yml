# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.selected-release-blueprint.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Bind the selected staging source graph to closed immutable release inputs without authority.
#   portability: {class: internal, targets: [kanbien/staging]}
#   used_by:
#   - id: deploy.script.selected-release-blueprint
#     path: scripts/04.deploy/release-control/selected_blueprint.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:selected-release-blueprint:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "id",
    "target_id",
    "owner",
    "risk_tier",
    "realization_contract",
    "acceptance_policy",
    "image_default_operation",
    "source_bindings",
    "operations"
  ],
  "properties": {
    "schema": {
      "const": "selected-release-blueprint/v1"
    },
    "id": {
      "$ref": "#/$defs/safe_id"
    },
    "target_id": {
      "const": "kanbien/staging"
    },
    "owner": {
      "$ref": "#/$defs/safe_id"
    },
    "risk_tier": {
      "$ref": "#/$defs/safe_id"
    },
    "realization_contract": {
      "$ref": "#/$defs/safe_path"
    },
    "acceptance_policy": {
      "$ref": "#/$defs/safe_path"
    },
    "image_default_operation": {
      "$ref": "#/$defs/safe_id"
    },
    "source_bindings": {
      "type": "array",
      "minItems": 1,
      "maxItems": 500,
      "uniqueItems": true,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "path",
          "digest"
        ],
        "properties": {
          "path": {
            "$ref": "#/$defs/safe_path"
          },
          "digest": {
            "$ref": "#/$defs/digest"
          }
        }
      }
    },
    "operations": {
      "type": "array",
      "minItems": 1,
      "maxItems": 500,
      "uniqueItems": true,
      "items": {
        "$ref": "#/$defs/operation"
      }
    }
  },
  "$defs": {
    "safe_id": {
      "type": "string",
      "minLength": 3,
      "maxLength": 64,
      "pattern": "^[a-z][a-z0-9-]{2,63}$"
    },
    "safe_path": {
      "type": "string",
      "minLength": 1,
      "maxLength": 1024,
      "pattern": "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$))[A-Za-z0-9_@.+-]+(?:/[A-Za-z0-9_@.+-]+)*$"
    },
    "digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "operation": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "operation_id",
        "source_profile",
        "execution_unit",
        "operation_profile",
        "artifact_id",
        "acting_identity",
        "command_ref",
        "depends_on"
      ],
      "properties": {
        "operation_id": {
          "$ref": "#/$defs/safe_id"
        },
        "source_profile": {
          "type": "string",
          "minLength": 1,
          "maxLength": 160,
          "pattern": "^[A-Za-z][A-Za-z0-9_-]{0,159}$"
        },
        "execution_unit": {
          "$ref": "#/$defs/safe_id"
        },
        "operation_profile": {
          "type": "string",
          "enum": [
            "static-artifact",
            "inspection",
            "service-rollout",
            "finite-job",
            "queue-consumer",
            "infrastructure-change",
            "migration",
            "restore",
            "scheduled-control"
          ]
        },
        "artifact_id": {
          "$ref": "#/$defs/safe_id"
        },
        "acting_identity": {
          "$ref": "#/$defs/safe_id"
        },
        "command_ref": {
          "$ref": "#/$defs/safe_id"
        },
        "depends_on": {
          "type": "array",
          "items": {
            "$ref": "#/$defs/safe_id"
          },
          "uniqueItems": true,
          "maxItems": 500
        }
      }
    }
  }
}
