# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.release-control.source-inventory.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Define closed source discovery and composition coverage input.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operational-realization-source-coverage
#     path: scripts/04.deploy/operational-realization-gate/source_coverage.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:source-inventory:v1",
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "schema": {
      "const": "source-inventory/v1"
    },
    "collector_revision": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "scope": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "roots": {
          "type": "array",
          "items": {
            "type": "string"
          },
          "minItems": 1,
          "uniqueItems": true
        },
        "policy": {
          "const": "source-surface/v1"
        }
      },
      "required": [
        "roots",
        "policy"
      ]
    },
    "sources": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "path": {
            "type": "string",
            "pattern": "^[a-zA-Z0-9_./-]+$"
          },
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "id",
          "path",
          "digest"
        ]
      },
      "minItems": 0,
      "uniqueItems": true
    },
    "observations": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "kind": {
            "enum": [
              "source-file",
              "package-command",
              "package-export",
              "package-bin",
              "script-entrypoint",
              "source-entrypoint",
              "workflow-step",
              "workflow-service",
              "image-command",
              "container",
              "command-binding",
              "configuration-binding",
              "secret-binding",
              "identity-binding",
              "resource",
              "external-dependency",
              "infrastructure-symbol",
              "infrastructure-reference"
            ]
          },
          "locator_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "subject_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "detail_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "issues": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^[a-z][a-z0-9-]{2,63}$"
            },
            "minItems": 0,
            "uniqueItems": true
          },
          "target_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "reference_kind": {
            "enum": [
              "ref",
              "get-att",
              "sub",
              "condition",
              "depends-on",
              "mapping"
            ]
          },
          "symbol_kind": {
            "enum": [
              "parameter",
              "condition",
              "mapping",
              "output",
              "pseudo-parameter"
            ]
          }
        },
        "required": [
          "id",
          "source_id",
          "kind",
          "locator_digest",
          "subject_id",
          "detail_digest",
          "issues"
        ],
        "allOf": [
          {
            "if": {
              "properties": {
                "kind": {
                  "const": "infrastructure-reference"
                }
              }
            },
            "then": {
              "required": [
                "target_id",
                "reference_kind"
              ]
            },
            "else": {
              "not": {
                "anyOf": [
                  {
                    "required": [
                      "target_id"
                    ]
                  },
                  {
                    "required": [
                      "reference_kind"
                    ]
                  }
                ]
              }
            }
          },
          {
            "if": {
              "properties": {
                "kind": {
                  "const": "infrastructure-symbol"
                }
              }
            },
            "then": {
              "required": [
                "symbol_kind"
              ]
            },
            "else": {
              "not": {
                "required": [
                  "symbol_kind"
                ]
              }
            }
          }
        ]
      },
      "minItems": 0,
      "uniqueItems": true
    },
    "findings": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$"
          },
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "code",
          "source_id"
        ]
      },
      "minItems": 0,
      "uniqueItems": true
    },
    "inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    }
  },
  "required": [
    "schema",
    "collector_revision",
    "scope",
    "sources",
    "observations",
    "findings",
    "inventory_digest"
  ]
}
