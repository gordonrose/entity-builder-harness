# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.release-control.source-adoption-ledger.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Define closed source discovery and composition coverage input.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operational-realization-source-coverage
#     path: scripts/04.deploy/operational-realization-gate/source_coverage.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:source-adoption-ledger:v1",
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "schema": {
      "const": "source-adoption-ledger/v1"
    },
    "inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "entries": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "source_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "owner": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$"
          },
          "disposition": {
            "enum": [
              "migrate",
              "temporary-compatible",
              "retire",
              "historical",
              "test-only"
            ]
          },
          "review_status": {
            "enum": [
              "pending",
              "reviewed"
            ]
          },
          "replacement_profile": {
            "enum": [
              "static-artifact",
              "inspection",
              "service-rollout",
              "finite-job",
              "queue-consumer",
              "infrastructure-change",
              "migration",
              "restore",
              "scheduled-control"
            ]
          },
          "expires_on": {
            "type": "string",
            "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
          }
        },
        "required": [
          "source_id",
          "source_digest",
          "owner",
          "disposition",
          "review_status"
        ]
      },
      "minItems": 0,
      "uniqueItems": true
    }
  },
  "required": [
    "schema",
    "inventory_digest",
    "entries"
  ]
}
