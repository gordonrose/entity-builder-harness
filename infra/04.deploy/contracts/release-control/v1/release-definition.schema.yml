# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.release-control.release-definition.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Define immutable provider-neutral release bindings and operation references.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operational-realization-release-compiler
#     path: scripts/04.deploy/operational-realization-gate/release_compiler.py
$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:release-control:release-definition:v1
title: Immutable release definition v1
description: Provider-neutral immutable release bindings. The compiler must also validate acceptance_matrix
  against acceptance-matrix.schema.yml and check realization-contract references.
type: object
additionalProperties: false
required:
- schema
- release_id
- source_revision
- target_composition_revision
- artifact_digests
- target_id
- risk_tier
- operation_graph
- environment_contract_revision
- acceptance_matrix
- evidence_policy_revision
- realization_contract_digest
properties:
  schema:
    const: release-definition/v1
  release_id:
    $ref: '#/$defs/safe_id'
  source_revision:
    type: string
    pattern: ^(?:[0-9a-f]{40}|[0-9a-f]{64})$
  target_composition_revision:
    $ref: '#/$defs/digest'
  artifact_digests:
    type: array
    items:
      $ref: '#/$defs/artifact_binding'
    minItems: 1
  target_id:
    type: string
    maxLength: 255
    pattern: ^[a-z][a-z0-9-]{2,63}(?:/[a-z][a-z0-9-]{2,63})*$
  risk_tier:
    $ref: '#/$defs/safe_id'
  operation_graph:
    type: array
    items:
      $ref: '#/$defs/operation'
    minItems: 1
  environment_contract_revision:
    $ref: '#/$defs/digest'
  acceptance_matrix:
    $ref: '#/$defs/acceptance_matrix'
  evidence_policy_revision:
    $ref: '#/$defs/digest'
  realization_contract_digest:
    $ref: '#/$defs/digest'
$defs:
  safe_id:
    type: string
    pattern: ^[a-z][a-z0-9-]{2,63}$
  digest:
    type: string
    pattern: ^sha256:[0-9a-f]{64}$
  operation_profile:
    type: string
    enum:
    - static-artifact
    - inspection
    - service-rollout
    - finite-job
    - queue-consumer
    - infrastructure-change
    - migration
    - restore
    - scheduled-control
  artifact_binding:
    type: object
    additionalProperties: false
    required:
    - artifact_id
    - digest
    properties:
      artifact_id:
        $ref: '#/$defs/safe_id'
      digest:
        $ref: '#/$defs/digest'
  operation:
    type: object
    additionalProperties: false
    required:
    - operation_id
    - execution_unit
    - operation_profile
    - artifact_id
    - acting_identity
    - command_ref
    - depends_on
    properties:
      operation_id:
        $ref: '#/$defs/safe_id'
      execution_unit:
        $ref: '#/$defs/safe_id'
      operation_profile:
        $ref: '#/$defs/operation_profile'
      artifact_id:
        $ref: '#/$defs/safe_id'
      acting_identity:
        $ref: '#/$defs/safe_id'
      command_ref:
        $ref: '#/$defs/safe_id'
      depends_on:
        type: array
        items:
          $ref: '#/$defs/safe_id'
        uniqueItems: true
  acceptance_matrix:
    description: The standalone versioned acceptance-matrix schema supplies the single authoritative gate
      order and validates every row.
    type: object
    additionalProperties: false
    required:
    - schema
    - rows
    properties:
      schema:
        const: release-acceptance-matrix/v1
      rows:
        type: array
        minItems: 17
        maxItems: 17
