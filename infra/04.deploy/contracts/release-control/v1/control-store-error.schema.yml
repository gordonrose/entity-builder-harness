# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.control-store-error
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract
#   purpose: Define safe bootstrap and conformance failures without raw paths or exception data.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.control-store-cli
#     path: scripts/04.deploy/operational-realization-gate/control_store_cli.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:control-store-error:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "scope",
    "verdict",
    "authorized",
    "release_eligibility",
    "operation_authorization",
    "qualification_verdict",
    "findings"
  ],
  "properties": {
    "schema": {
      "const": "control-store-error/v1"
    },
    "scope": {
      "const": "local-process-restart-conformance"
    },
    "verdict": {
      "const": "blocked"
    },
    "authorized": {
      "const": false
    },
    "release_eligibility": {
      "const": "blocked"
    },
    "operation_authorization": {
      "const": "blocked"
    },
    "qualification_verdict": {
      "const": "blocked"
    },
    "findings": {
      "type": "array",
      "minItems": 1,
      "maxItems": 1,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code"
        ],
        "properties": {
          "code": {
            "enum": [
              "input-invalid",
              "scratch-root-invalid",
              "schema-invalid",
              "source-invalid",
              "source-changed",
              "dependency-unavailable",
              "conformance-failed"
            ]
          }
        }
      }
    }
  }
}
