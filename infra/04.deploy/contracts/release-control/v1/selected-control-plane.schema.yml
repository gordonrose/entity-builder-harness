{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:selected-control-plane:v1",
  "type": "object",
  "additionalProperties": false,
  "required": ["schema", "target", "account_id", "region", "executor", "journal", "evidence", "recovery", "authority", "lease", "cost"],
  "properties": {
    "schema": {"const": "selected-control-plane/v1"},
    "target": {"const": "kanbien/staging"},
    "account_id": {"const": "337159794548"},
    "region": {"const": "eu-west-1"},
    "executor": {
      "type": "object", "additionalProperties": false,
      "required": ["role_name", "github_repository", "github_ref", "github_environment", "max_session_seconds"],
      "properties": {
        "role_name": {"const": "kanbien-staging-platform-shell-release-control-controller"},
        "github_repository": {"const": "gordonrose/entity-builder-harness"},
        "github_ref": {"const": "refs/heads/main"},
        "github_environment": {"const": "staging"},
        "max_session_seconds": {"const": 7200}
      }
    },
    "journal": {
      "type": "object", "additionalProperties": false,
      "required": ["table_name", "partition_key", "sort_key", "encryption", "ttl_enabled"],
      "properties": {
        "table_name": {"const": "kanbien-staging-platform-shell-release-control"},
        "partition_key": {"const": "pk"},
        "sort_key": {"const": "sk"},
        "encryption": {"const": "aws-owned"},
        "ttl_enabled": {"const": false}
      }
    },
    "evidence": {
      "type": "object", "additionalProperties": false,
      "required": ["bucket_name", "prefix", "versioning", "encryption", "public_access", "minimum_retention_days"],
      "properties": {
        "bucket_name": {"const": "kanbien-staging-platform-shell-release-evidence-337159794548"},
        "prefix": {"const": "kanbien/staging/operations/"},
        "versioning": {"const": true},
        "encryption": {"const": "AES256"},
        "public_access": {"const": "blocked"},
        "minimum_retention_days": {"const": 90}
      }
    },
    "recovery": {
      "type": "object", "additionalProperties": false,
      "required": ["point_in_time_recovery_days", "recovery_point_minutes", "recovery_time_hours"],
      "properties": {
        "point_in_time_recovery_days": {"const": 35},
        "recovery_point_minutes": {"const": 5},
        "recovery_time_hours": {"const": 4}
      }
    },
    "authority": {
      "type": "object", "additionalProperties": false,
      "required": ["window_minutes", "execution_minutes", "recovery_minutes", "max_effect_attempts"],
      "properties": {
        "window_minutes": {"const": 120},
        "execution_minutes": {"const": 90},
        "recovery_minutes": {"const": 30},
        "max_effect_attempts": {"const": 1}
      }
    },
    "lease": {
      "type": "object", "additionalProperties": false,
      "required": ["seconds", "renew_every_seconds", "minimum_effect_seconds", "clock_uncertainty_seconds"],
      "properties": {
        "seconds": {"const": 60},
        "renew_every_seconds": {"const": 20},
        "minimum_effect_seconds": {"const": 35},
        "clock_uncertainty_seconds": {"const": 5}
      }
    },
    "cost": {
      "type": "object", "additionalProperties": false,
      "required": ["monthly_ceiling_usd", "initial_qualification_ceiling_usd", "existing_service_budget_usd"],
      "properties": {
        "monthly_ceiling_usd": {"const": 5},
        "initial_qualification_ceiling_usd": {"const": 2},
        "existing_service_budget_usd": {"const": 25}
      }
    }
  }
}
