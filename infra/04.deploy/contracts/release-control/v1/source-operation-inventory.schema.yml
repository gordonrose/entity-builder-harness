# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.release-control.source-operation-inventory.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Bind safe script and action observations and dependencies to fresh caller subjects.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operational-realization-operation-contracts
#     path: scripts/04.deploy/operational-realization-gate/operation_contracts.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:source-operation-inventory:v1",
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "schema": {
      "const": "source-operation-inventory/v1"
    },
    "graph_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "collector_revision": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "sources": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "path": {
            "type": "string",
            "pattern": "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$))(?!.*//)(?!.*\\/$)[A-Za-z0-9_./-]+$",
            "maxLength": 512
          },
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "id",
          "path",
          "digest"
        ]
      },
      "minItems": 1,
      "maxItems": 10000,
      "uniqueItems": true
    },
    "subjects": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "kind": {
            "enum": [
              "script",
              "action",
              "tool"
            ]
          },
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "detail_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "invocation_ids": {
            "type": "array",
            "items": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$"
            },
            "minItems": 1,
            "maxItems": 10000,
            "uniqueItems": true
          }
        },
        "required": [
          "id",
          "kind",
          "source_id",
          "detail_digest",
          "invocation_ids"
        ]
      },
      "minItems": 1,
      "maxItems": 10000,
      "uniqueItems": true
    },
    "observations": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "subject_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "kind": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          },
          "locator_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "detail_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "id",
          "subject_id",
          "source_id",
          "kind",
          "locator_digest",
          "detail_digest"
        ]
      },
      "minItems": 0,
      "maxItems": 10000,
      "uniqueItems": true
    },
    "dependencies": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "subject_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "from_source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "to_source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "kind": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          },
          "detail_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "id",
          "subject_id",
          "from_source_id",
          "to_source_id",
          "kind",
          "detail_digest"
        ]
      },
      "minItems": 0,
      "maxItems": 10000,
      "uniqueItems": true
    },
    "findings": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "subject_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "code": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          }
        },
        "required": [
          "subject_id",
          "code"
        ]
      },
      "minItems": 0,
      "maxItems": 10000,
      "uniqueItems": true
    },
    "inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    }
  },
  "required": [
    "schema",
    "graph_digest",
    "collector_revision",
    "sources",
    "subjects",
    "observations",
    "dependencies",
    "findings",
    "inventory_digest"
  ]
}
