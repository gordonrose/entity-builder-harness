# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.local-runtime-observation.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: schema
#   purpose: Bound safe local build evidence without granting release or operation authority.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.local-build-contracts
#     path: scripts/04.deploy/operational-realization-gate/local_build_contracts.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:local-runtime-observation:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "scope",
    "configuration",
    "kind",
    "authorized",
    "qualification_verdict",
    "source_inventory_digest",
    "generator",
    "compiler_artifact_digest",
    "dependency_tree_digest",
    "copied_dependency_digest",
    "artifact_files",
    "selected_runtime_tests",
    "executed_runner_count",
    "returncode",
    "stdout_digest",
    "stderr_digest",
    "receipt_digest"
  ],
  "properties": {
    "schema": {
      "const": "local-runtime-observation/v1"
    },
    "scope": {
      "const": "isolated-local-runtime"
    },
    "configuration": {
      "type": "string",
      "minLength": 1,
      "maxLength": 512,
      "pattern": "^[A-Za-z0-9_./@+-]+$"
    },
    "kind": {
      "enum": [
        "runtime-test-runner",
        "image-shim-generator"
      ]
    },
    "authorized": {
      "const": false
    },
    "qualification_verdict": {
      "const": "blocked"
    },
    "source_inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "generator": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "path",
        "digest"
      ],
      "properties": {
        "path": {
          "type": "string",
          "minLength": 1,
          "maxLength": 512,
          "pattern": "^[A-Za-z0-9_./@+-]+$"
        },
        "digest": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        }
      }
    },
    "compiler_artifact_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "dependency_tree_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "copied_dependency_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "artifact_files": {
      "type": "array",
      "maxItems": 20000,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "path",
          "digest",
          "bytes"
        ],
        "properties": {
          "path": {
            "type": "string",
            "minLength": 1,
            "maxLength": 512,
            "pattern": "^[A-Za-z0-9_./@+-]+$"
          },
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "bytes": {
            "type": "integer",
            "minimum": 0,
            "maximum": 1073741824
          }
        }
      }
    },
    "selected_runtime_tests": {
      "type": "array",
      "maxItems": 1000,
      "items": {
        "type": "string",
        "minLength": 1,
        "maxLength": 512,
        "pattern": "^[A-Za-z0-9_./@+-]+$"
      }
    },
    "executed_runner_count": {
      "enum": [
        0,
        1
      ]
    },
    "returncode": {
      "const": 0
    },
    "stdout_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "stderr_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "receipt_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    }
  }
}
