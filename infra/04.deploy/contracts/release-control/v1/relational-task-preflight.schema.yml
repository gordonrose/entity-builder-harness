$schema: https://json-schema.org/draft/2020-12/schema
$id: urn:release-control:relational-task-preflight:v1
title: Relational task database preflight v1
description: A process-local read-only prerequisite result. The controller must independently bind the task revision, image, mode and freshness. This is not effect proof or operation authorization.
type: object
additionalProperties: false
required: [schema, scope, operation, verdict, authorized]
properties:
  schema:
    const: relational-task-preflight/v1
  scope:
    const: read-only-database-prerequisites
  operation:
    type: string
    enum: [bootstrap, migration, relay, worker, restore-verify]
  verdict:
    type: string
    enum: [passed, failed]
  authorized:
    const: false
