{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:dependency-effect-profile:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "scope",
    "repository_head",
    "source_digest",
    "build_result_digest",
    "runner_digest",
    "lock_digest",
    "expectations_digest",
    "artifact",
    "dependency",
    "commands",
    "schema_digests"
  ],
  "properties": {
    "schema": {
      "const": "dependency-effect-profile/v1"
    },
    "scope": {
      "const": "local-packaged-postgresql-effects"
    },
    "repository_head": {
      "type": "string",
      "pattern": "^[a-f0-9]{40}$"
    },
    "source_digest": {
      "type": "string",
      "pattern": "^sha256:[a-f0-9]{64}$",
      "maxLength": 71
    },
    "build_result_digest": {
      "type": "string",
      "pattern": "^sha256:[a-f0-9]{64}$",
      "maxLength": 71
    },
    "runner_digest": {
      "type": "string",
      "pattern": "^sha256:[a-f0-9]{64}$",
      "maxLength": 71
    },
    "lock_digest": {
      "type": "string",
      "pattern": "^sha256:[a-f0-9]{64}$",
      "maxLength": 71
    },
    "expectations_digest": {
      "type": "string",
      "pattern": "^sha256:[a-f0-9]{64}$",
      "maxLength": 71
    },
    "artifact": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "image_id",
        "payload_digest"
      ],
      "properties": {
        "image_id": {
          "type": "string",
          "pattern": "^sha256:[a-f0-9]{64}$",
          "maxLength": 71
        },
        "payload_digest": {
          "type": "string",
          "pattern": "^sha256:[a-f0-9]{64}$",
          "maxLength": 71
        }
      }
    },
    "dependency": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "image",
        "image_id",
        "engine_version",
        "network",
        "published_ports",
        "tls"
      ],
      "properties": {
        "image": {
          "type": "string",
          "pattern": "^docker\\.io/library/postgres@sha256:[a-f0-9]{64}$"
        },
        "image_id": {
          "type": "string",
          "pattern": "^sha256:[a-f0-9]{64}$",
          "maxLength": 71
        },
        "engine_version": {
          "const": "17.11"
        },
        "network": {
          "const": "owned-internal"
        },
        "published_ports": {
          "const": []
        },
        "tls": {
          "const": "verify-full-local-ca"
        }
      }
    },
    "commands": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "bootstrap",
        "migration"
      ],
      "properties": {
        "bootstrap": {
          "const": [
            ".cache/platform-shell-image-build/infra/04.deploy/03.product/entrypoints/kanbien-platform-postgresql-bootstrap.main.js"
          ]
        },
        "migration": {
          "const": [
            ".cache/platform-shell-image-build/infra/04.deploy/03.product/entrypoints/kanbien-platform-postgresql-migration.main.js"
          ]
        }
      }
    },
    "schema_digests": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "dependency-effect-profile/v1",
        "dependency-effect-result/v1"
      ],
      "properties": {
        "dependency-effect-profile/v1": {
          "type": "string",
          "pattern": "^sha256:[a-f0-9]{64}$",
          "maxLength": 71
        },
        "dependency-effect-result/v1": {
          "type": "string",
          "pattern": "^sha256:[a-f0-9]{64}$",
          "maxLength": 71
        }
      }
    }
  }
}
