{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:finite-recovery-image-lock:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "qualification_receipt",
    "qualification_receipt_digest",
    "qualified_source_revision",
    "image_id",
    "payload_digest",
    "recipe_digest",
    "runtime_image",
    "runtime_config_digest"
  ],
  "properties": {
    "schema": {
      "const": "finite-recovery-image-lock/v1"
    },
    "qualification_receipt": {
      "const": "docs/04.deploy/plans/release-control-source-adoption/2026-09-29-finite-jobs/finite-job-conformance-result.json"
    },
    "qualification_receipt_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "qualified_source_revision": {
      "type": "string",
      "pattern": "^[0-9a-f]{40}$"
    },
    "image_id": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "payload_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "recipe_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "runtime_image": {
      "type": "string",
      "pattern": "^gcr\\.io/distroless/nodejs22-debian12@sha256:[0-9a-f]{64}$"
    },
    "runtime_config_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    }
  }
}
