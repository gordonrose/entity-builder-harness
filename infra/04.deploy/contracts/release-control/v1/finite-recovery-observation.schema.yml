# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.finite-recovery-observation
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract
#   purpose: Bind inert finite fixture identity and observations across local process recovery.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.finite-recovery-contracts
#     path: scripts/04.deploy/operational-realization-gate/finite_recovery_contracts.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:finite-recovery-observation:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "operation_id",
    "attempt_digest",
    "resource_id",
    "state",
    "exit_code",
    "oom_killed",
    "terminal"
  ],
  "properties": {
    "schema": {
      "const": "finite-recovery-observation/v1"
    },
    "operation_id": {
      "type": "string",
      "pattern": "^[a-z][a-z0-9-]{2,63}$",
      "maxLength": 64
    },
    "attempt_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$",
      "maxLength": 71
    },
    "resource_id": {
      "type": [
        "string",
        "null"
      ],
      "pattern": "^[0-9a-f]{64}$",
      "maxLength": 64
    },
    "state": {
      "enum": [
        "absent",
        "created",
        "running",
        "exited"
      ]
    },
    "exit_code": {
      "type": [
        "integer",
        "null"
      ],
      "minimum": 0,
      "maximum": 255
    },
    "oom_killed": {
      "type": [
        "boolean",
        "null"
      ]
    },
    "terminal": {
      "anyOf": [
        {
          "type": "null"
        },
        {
          "type": "object",
          "additionalProperties": false,
          "required": [
            "schema",
            "run_id",
            "profile_digest",
            "outcome",
            "checks"
          ],
          "properties": {
            "schema": {
              "const": "finite-job-terminal/v1"
            },
            "run_id": {
              "type": "string",
              "pattern": "^[0-9a-f]{32}$",
              "maxLength": 32
            },
            "profile_digest": {
              "type": "string",
              "pattern": "^sha256:[0-9a-f]{64}$",
              "maxLength": 71
            },
            "outcome": {
              "const": "completed"
            },
            "checks": {
              "const": [
                {
                  "id": "fixture-calculation",
                  "verdict": "passed"
                }
              ]
            }
          }
        }
      ]
    }
  }
}
