# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.release-control.source-adoption-migration.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Preserve historical adoption proposals and require pending review for the current source delta.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operational-realization-adoption-migration
#     path: scripts/04.deploy/operational-realization-gate/adoption_migration.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:source-adoption-migration:v1",
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "schema": {
      "const": "source-adoption-migration/v1"
    },
    "scope": {
      "const": "pending-adoption-migration"
    },
    "authorized": {
      "const": false
    },
    "release_eligibility": {
      "const": "blocked"
    },
    "operation_authorization": {
      "const": "blocked"
    },
    "review_verdict": {
      "const": "pending"
    },
    "retirement_authorized": {
      "const": false
    },
    "deletion_authorized": {
      "const": false
    },
    "prior_ledger_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "prior_inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "collector_revision": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "candidate_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "candidate": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "schema": {
          "const": "source-adoption-ledger/v1"
        },
        "inventory_digest": {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        },
        "entries": {
          "type": "array",
          "items": {
            "type": "object",
            "additionalProperties": false,
            "properties": {
              "source_id": {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              "source_digest": {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              "owner": {
                "type": "string",
                "pattern": "^[a-z][a-z0-9-]{2,63}$"
              },
              "disposition": {
                "enum": [
                  "migrate",
                  "temporary-compatible",
                  "retire",
                  "historical",
                  "test-only"
                ]
              },
              "review_status": {
                "const": "pending"
              },
              "replacement_profile": {
                "enum": [
                  "static-artifact",
                  "inspection",
                  "service-rollout",
                  "finite-job",
                  "queue-consumer",
                  "infrastructure-change",
                  "migration",
                  "restore",
                  "scheduled-control"
                ]
              },
              "expires_on": {
                "type": "string",
                "pattern": "^\\d{4}-\\d{2}-\\d{2}$"
              }
            },
            "required": [
              "source_id",
              "source_digest",
              "owner",
              "disposition",
              "review_status"
            ]
          },
          "minItems": 0,
          "uniqueItems": true
        }
      },
      "required": [
        "schema",
        "inventory_digest",
        "entries"
      ]
    },
    "counts": {
      "type": "object",
      "additionalProperties": false,
      "properties": {
        "added": {
          "type": "integer",
          "minimum": 0,
          "maximum": 10000
        },
        "changed": {
          "type": "integer",
          "minimum": 0,
          "maximum": 10000
        },
        "unchanged": {
          "type": "integer",
          "minimum": 0,
          "maximum": 10000
        },
        "removed": {
          "type": "integer",
          "minimum": 0,
          "maximum": 10000
        }
      },
      "required": [
        "added",
        "changed",
        "unchanged",
        "removed"
      ]
    },
    "changes": {
      "type": "array",
      "maxItems": 20000,
      "uniqueItems": true,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "change": {
            "enum": [
              "added",
              "changed",
              "unchanged",
              "removed"
            ]
          },
          "previous_digest": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              {
                "type": "null"
              }
            ]
          },
          "current_digest": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              {
                "type": "null"
              }
            ]
          }
        },
        "required": [
          "source_id",
          "change",
          "previous_digest",
          "current_digest"
        ]
      }
    },
    "policy_revision": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "result_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    }
  },
  "required": [
    "schema",
    "scope",
    "authorized",
    "release_eligibility",
    "operation_authorization",
    "review_verdict",
    "retirement_authorized",
    "deletion_authorized",
    "prior_ledger_digest",
    "prior_inventory_digest",
    "inventory_digest",
    "collector_revision",
    "candidate_digest",
    "candidate",
    "counts",
    "changes",
    "policy_revision",
    "result_digest"
  ]
}
