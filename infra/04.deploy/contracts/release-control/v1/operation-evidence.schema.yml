# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.operation-evidence
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract
#   purpose: Define local control-store conformance without cloud authority.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operation-journal
#     path: scripts/04.deploy/operational-realization-gate/operation_journal.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:operation-evidence:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "operation_id",
    "release_digest",
    "profile_digest",
    "attempt",
    "observed_revision",
    "fences",
    "assertion",
    "verdict",
    "subject_digest",
    "observed_at_ms",
    "expires_at_ms",
    "counts"
  ],
  "properties": {
    "schema": {
      "const": "operation-evidence/v1"
    },
    "operation_id": {
      "type": "string",
      "pattern": "^[a-z][a-z0-9-]{2,63}$",
      "maxLength": 128
    },
    "release_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$",
      "maxLength": 128
    },
    "profile_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$",
      "maxLength": 128
    },
    "attempt": {
      "type": "integer",
      "minimum": 0,
      "maximum": 3
    },
    "observed_revision": {
      "type": "integer",
      "minimum": 0,
      "maximum": 1000
    },
    "fences": {
      "type": "array",
      "minItems": 1,
      "maxItems": 16,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "scope_id",
          "generation"
        ],
        "properties": {
          "scope_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$",
            "maxLength": 128
          },
          "generation": {
            "type": "integer",
            "minimum": 1,
            "maximum": 9223372036854775807
          }
        }
      }
    },
    "assertion": {
      "enum": [
        "fixture-effect",
        "fixture-absent",
        "fixture-cleanup"
      ]
    },
    "verdict": {
      "enum": [
        "passed",
        "failed",
        "unknown"
      ]
    },
    "subject_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$",
      "maxLength": 128
    },
    "observed_at_ms": {
      "type": "integer",
      "minimum": 1,
      "maximum": 9223372036854775807
    },
    "expires_at_ms": {
      "type": "integer",
      "minimum": 1,
      "maximum": 9223372036854775807
    },
    "counts": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "effect_count",
        "owned_resources"
      ],
      "properties": {
        "effect_count": {
          "type": "integer",
          "minimum": 0,
          "maximum": 1
        },
        "owned_resources": {
          "type": "integer",
          "minimum": 0,
          "maximum": 32
        }
      }
    }
  }
}
