# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.selected-readiness-result.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Close the passive selected-target readiness boundary without granting qualification or authority.
#   portability: {class: internal, targets: [kanbien/staging]}
#   used_by:
#   - id: deploy.script.selected-readiness-cli
#     path: scripts/04.deploy/operational-realization-gate/selected_readiness_cli.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:selected-readiness-result:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "scope",
    "target_id",
    "verdict",
    "authorized",
    "release_eligibility",
    "operation_authorization",
    "qualification_verdict",
    "source_equivalence",
    "source_revision_status",
    "artifact_identity_status",
    "blueprint_result_digest",
    "release_digest",
    "source_bindings",
    "implementation_digest",
    "target_binding_digest",
    "observed_at_utc",
    "expires_at_utc",
    "checks",
    "groups",
    "subjects",
    "effect_summary",
    "findings",
    "remaining_obligations",
    "result_digest"
  ],
  "properties": {
    "schema": {
      "const": "selected-readiness-result/v1"
    },
    "scope": {
      "const": "selected-target-passive-readiness"
    },
    "target_id": {
      "const": "kanbien/staging"
    },
    "verdict": {
      "enum": [
        "observed",
        "blocked"
      ]
    },
    "authorized": {
      "const": false
    },
    "release_eligibility": {
      "const": "blocked"
    },
    "operation_authorization": {
      "const": "blocked"
    },
    "qualification_verdict": {
      "const": "blocked"
    },
    "source_equivalence": {
      "const": "blocked"
    },
    "source_revision_status": {
      "const": "declared"
    },
    "artifact_identity_status": {
      "const": "declared"
    },
    "blueprint_result_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "release_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "source_bindings": {
      "type": "array",
      "minItems": 1,
      "maxItems": 256,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "path",
          "digest"
        ],
        "properties": {
          "path": {
            "type": "string",
            "pattern": "^[A-Za-z0-9_./@+-]+$",
            "maxLength": 1024
          },
          "digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        }
      }
    },
    "implementation_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "target_binding_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "observed_at_utc": {
      "type": "string",
      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
    },
    "expires_at_utc": {
      "type": "string",
      "pattern": "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$"
    },
    "checks": {
      "type": "array",
      "maxItems": 32,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "id",
          "verdict"
        ],
        "properties": {
          "id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$"
          },
          "verdict": {
            "enum": [
              "observed",
              "blocked"
            ]
          }
        }
      }
    },
    "groups": {
      "type": "array",
      "maxItems": 9,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "group_digest",
          "task_revision_digest",
          "task_configuration_digest"
        ],
        "properties": {
          "group_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "task_revision_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "task_configuration_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        }
      }
    },
    "subjects": {
      "type": "array",
      "minItems": 13,
      "maxItems": 13,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "operation_id",
          "group_digest",
          "task_revision_digest",
          "configured_image_digest",
          "image_matches_declared_release",
          "explicit_command_matches_source",
          "identity_digest",
          "configuration_digest",
          "observation"
        ],
        "properties": {
          "operation_id": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,63}$"
          },
          "group_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "task_revision_digest": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              {
                "type": "null"
              }
            ]
          },
          "configured_image_digest": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              {
                "type": "null"
              }
            ]
          },
          "image_matches_declared_release": {
            "type": [
              "boolean",
              "null"
            ]
          },
          "explicit_command_matches_source": {
            "type": [
              "boolean",
              "null"
            ]
          },
          "identity_digest": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              {
                "type": "null"
              }
            ]
          },
          "configuration_digest": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              {
                "type": "null"
              }
            ]
          },
          "observation": {
            "enum": [
              "pending",
              "observed"
            ]
          }
        }
      }
    },
    "effect_summary": {
      "type": "object",
      "additionalProperties": false,
      "required": [
        "provider_effects_requested",
        "secret_values_requested",
        "observed_task_groups",
        "observed_subjects"
      ],
      "properties": {
        "provider_effects_requested": {
          "const": 0
        },
        "secret_values_requested": {
          "const": 0
        },
        "observed_task_groups": {
          "type": "integer",
          "minimum": 0,
          "maximum": 9
        },
        "observed_subjects": {
          "type": "integer",
          "minimum": 0,
          "maximum": 13
        }
      }
    },
    "findings": {
      "type": "array",
      "maxItems": 1,
      "items": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "code"
        ],
        "properties": {
          "code": {
            "enum": ["readiness-inspection-blocked", "readiness-image-mismatch", "readiness-passive-drift-stale"]
          }
        }
      }
    },
    "remaining_obligations": {
      "const": [
        "source-to-live-configuration-equivalence",
        "task-role-authority-and-network-proof",
        "per-task-no-effect-preflight",
        "independent-effect-and-cleanup-proof",
        "durable-operation-control",
        "explicit-operation-approval",
        "all-seventeen-release-gates"
      ]
    },
    "result_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    }
  }
}
