# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.operation-action-record
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract
#   purpose: Bind typed immutable adapter attachments and bounded consumed action reservations to a local control journal.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operation-actions
#     path: scripts/04.deploy/operational-realization-gate/operation_actions.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:operation-action-record:v1",
  "type": "object",
  "additionalProperties": false,
  "required": [
    "schema",
    "operation_id",
    "intent_digest",
    "attachment_type",
    "attachment_digest",
    "sequence",
    "event",
    "action",
    "ordinal",
    "claim_digest",
    "operation_revision",
    "observed_at_ms",
    "deadline_ms",
    "reservation_digest",
    "observation_digest",
    "previous_digest",
    "event_digest",
    "authorized",
    "release_eligibility",
    "operation_authorization"
  ],
  "properties": {
    "schema": {
      "const": "operation-action-record/v1"
    },
    "operation_id": {
      "type": "string",
      "pattern": "^[a-z][a-z0-9-]{2,63}$"
    },
    "intent_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "attachment_type": {
      "enum": [
        "finite-recovery-attempt/v1",
        "candidate-lifecycle-attempt/v1"
      ]
    },
    "attachment_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "sequence": {
      "type": "integer",
      "minimum": 0,
      "maximum": 127
    },
    "event": {
      "enum": [
        "attachment-bound",
        "reserved",
        "observed"
      ]
    },
    "action": {
      "anyOf": [
        {
          "type": "string",
          "pattern": "^[a-z][a-z0-9-]{2,63}$"
        },
        {
          "type": "null"
        }
      ]
    },
    "ordinal": {
      "type": "integer",
      "minimum": 0,
      "maximum": 32
    },
    "claim_digest": {
      "anyOf": [
        {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        },
        {
          "type": "null"
        }
      ]
    },
    "operation_revision": {
      "type": "integer",
      "minimum": 0,
      "maximum": 1000
    },
    "observed_at_ms": {
      "type": "integer",
      "minimum": 1,
      "maximum": 9223372036854775807
    },
    "deadline_ms": {
      "type": "integer",
      "minimum": 1,
      "maximum": 9223372036854775807
    },
    "reservation_digest": {
      "anyOf": [
        {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        },
        {
          "type": "null"
        }
      ]
    },
    "observation_digest": {
      "anyOf": [
        {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        },
        {
          "type": "null"
        }
      ]
    },
    "previous_digest": {
      "anyOf": [
        {
          "type": "string",
          "pattern": "^sha256:[0-9a-f]{64}$"
        },
        {
          "type": "null"
        }
      ]
    },
    "event_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "authorized": {
      "const": false
    },
    "release_eligibility": {
      "const": "blocked"
    },
    "operation_authorization": {
      "const": "blocked"
    }
  }
}
