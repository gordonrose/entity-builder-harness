# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.candidate-lifecycle-observation
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract
#   purpose: Preserve only digest-bound candidate task identity and terminal lifecycle state.
#   portability: {class: internal, targets: [kanbien-staging]}
#   used_by:
#   - id: deploy.script.candidate-lifecycle
#     path: scripts/04.deploy/operational-realization-gate/candidate_lifecycle.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:candidate-lifecycle-observation:v1",
  "type": "object",
  "additionalProperties": false,
  "required": ["schema", "operation_id", "attempt_digest", "state", "resource_id", "task_id_digest", "cluster_digest", "task_revision_digest", "image_digest", "authorized", "release_eligibility", "operation_authorization"],
  "properties": {
    "schema": {"const": "candidate-lifecycle-observation/v1"},
    "operation_id": {"const": "candidate-server"},
    "attempt_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
    "state": {"enum": ["running", "stopped"]},
    "resource_id": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
    "task_id_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
    "cluster_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
    "task_revision_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
    "image_digest": {"type": "string", "pattern": "^sha256:[0-9a-f]{64}$"},
    "authorized": {"const": false},
    "release_eligibility": {"const": "blocked"},
    "operation_authorization": {"const": "blocked"}
  }
}
