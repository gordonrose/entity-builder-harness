# agentic-artifact:
#   schema: agentic-artifact/v2
#   id: deploy.contract.release-control.estate-caller-reconciliation.v1
#   version: 1
#   status: active
#   layer: 04.deploy
#   domain: deployment.realization
#   disciplines: [architecture, security, sre]
#   kind: contract-schema
#   purpose: Keep raw source gaps distinct from machine-proved dispatch and unresolved child boundaries.
#   portability: {class: reusable, targets: [entity-builder]}
#   used_by:
#   - id: deploy.script.operational-realization-estate-caller-coverage
#     path: scripts/04.deploy/operational-realization-gate/estate_caller_coverage.py
{
  "$schema": "https://json-schema.org/draft/2020-12/schema",
  "$id": "urn:release-control:estate-caller-reconciliation:v1",
  "type": "object",
  "additionalProperties": false,
  "properties": {
    "schema": {
      "const": "estate-caller-reconciliation/v1"
    },
    "scope": {
      "const": "structural-caller-reconciliation"
    },
    "authorized": {
      "const": false
    },
    "release_eligibility": {
      "const": "blocked"
    },
    "operation_authorization": {
      "const": "blocked"
    },
    "qualification_verdict": {
      "const": "blocked"
    },
    "review_verdict": {
      "const": "not-evaluated"
    },
    "inventory_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "graph_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "collector_revision": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "policy_revision": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    },
    "roots": {
      "type": "integer",
      "minimum": 0,
      "maximum": 10000
    },
    "nodes": {
      "type": "integer",
      "minimum": 0,
      "maximum": 10000
    },
    "edges": {
      "type": "integer",
      "minimum": 0,
      "maximum": 10000
    },
    "resolved_observations": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "observation_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "node_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          },
          "rule": {
            "enum": [
              "literal-package-command/v1",
              "python-dispatch/v1"
            ]
          },
          "proof_digest": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "observation_id",
          "node_id",
          "rule",
          "proof_digest"
        ]
      },
      "maxItems": 10000,
      "uniqueItems": true
    },
    "raw_source_findings": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          },
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "code",
          "source_id"
        ]
      },
      "maxItems": 10000,
      "uniqueItems": true
    },
    "resolved_source_findings": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          },
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "code",
          "source_id"
        ]
      },
      "maxItems": 10000,
      "uniqueItems": true
    },
    "remaining_source_findings": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          },
          "source_id": {
            "type": "string",
            "pattern": "^sha256:[0-9a-f]{64}$"
          }
        },
        "required": [
          "code",
          "source_id"
        ]
      },
      "maxItems": 10000,
      "uniqueItems": true
    },
    "boundary_findings": {
      "type": "array",
      "items": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string",
            "pattern": "^[a-z][a-z0-9-]{2,79}$"
          },
          "subject_id": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^sha256:[0-9a-f]{64}$"
              },
              {
                "const": "estate-callers"
              }
            ]
          }
        },
        "required": [
          "code",
          "subject_id"
        ]
      },
      "maxItems": 10000,
      "uniqueItems": true
    },
    "structural_verdict": {
      "enum": [
        "blocked",
        "accounted"
      ]
    },
    "result_digest": {
      "type": "string",
      "pattern": "^sha256:[0-9a-f]{64}$"
    }
  },
  "required": [
    "schema",
    "scope",
    "authorized",
    "release_eligibility",
    "operation_authorization",
    "qualification_verdict",
    "review_verdict",
    "inventory_digest",
    "graph_digest",
    "collector_revision",
    "policy_revision",
    "roots",
    "nodes",
    "edges",
    "resolved_observations",
    "raw_source_findings",
    "resolved_source_findings",
    "remaining_source_findings",
    "boundary_findings",
    "structural_verdict",
    "result_digest"
  ]
}
